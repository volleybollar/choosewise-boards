<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y165 · Device connections</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Enheterna ----------
     Tre generiska enheter ritade som linjeikoner (inga märken): lärarens
     dator till vänster, klassrummets skärm och elevernas plattor till höger.
     Allt ligger till vänster om x 1460, så kamerazonen är tom. */
  .enhet { position: absolute; text-align: center; }
  .enhet svg { display: block; margin: 0 auto; overflow: visible; }
  .enhet svg .linje { fill: #fff; stroke: var(--cw-accent); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  .enhet .etikett { margin-top: 14px; white-space: nowrap; }

  /* ---------- Kopplingarna ----------
     Linjerna mellan enheterna ritas i en SVG över hela boarden. Varje sorts
     innehåll har sin färg: bilder i djupblått, uppgifter i mellanblått. */
  svg.kopplingar { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg.kopplingar line { stroke-width: 6; stroke-linecap: round; }
  svg.kopplingar circle { stroke: none; }
  .k1 line, .k1 circle { stroke: var(--cw-serie-1); fill: var(--cw-serie-1); }
  .k2 line, .k2 circle { stroke: var(--cw-serie-2); fill: var(--cw-serie-2); }

  /* Etiketten som säger vad som färdas på kopplingen. */
  .vad { position: absolute; white-space: nowrap; color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What is connected to what</h1>

  <!-- Kopplingarna: en linje och en prick som åker längs den en gång. -->
  <svg class="kopplingar" viewBox="0 0 1920 1080" aria-hidden="true">
    <g class="k1"><line x1="560" y1="450" x2="1040" y2="350"/><circle r="14" cx="560" cy="450"/></g>
    <g class="k2"><line x1="560" y1="540" x2="1080" y2="720"/><circle r="14" cx="560" cy="540"/></g>
  </svg>
  <div class="vad etikett v1" style="left:700px; top:330px">Slides</div>
  <div class="vad etikett v2" style="left:700px; top:650px">Tasks</div>

  <!-- Lärarens dator: skärm och tangentbordsdel. -->
  <div class="enhet e-dator" style="left:120px; top:340px; width:420px">
    <svg width="380" height="250" viewBox="0 0 380 250">
      <rect class="linje" x="40" y="10" width="300" height="190" rx="16"/>
      <path class="linje" d="M10 214 H370 L346 240 H34 Z"/>
    </svg>
    <div class="etikett">Teacher laptop</div>
  </div>

  <!-- Klassrummets skärm på ett stativ. -->
  <div class="enhet e-skarm" style="left:1050px; top:220px; width:420px">
    <svg width="400" height="250" viewBox="0 0 400 250">
      <rect class="linje" x="10" y="10" width="380" height="200" rx="16"/>
      <path class="linje" d="M200 210 V244 M140 244 H260"/>
    </svg>
    <div class="etikett">Classroom screen</div>
  </div>

  <!-- Elevernas plattor: två plattor som överlappar. -->
  <div class="enhet e-plattor" style="left:1080px; top:600px; width:380px">
    <svg width="260" height="230" viewBox="0 0 260 230">
      <rect class="linje" x="10" y="10" width="150" height="210" rx="22"/>
      <rect class="linje" x="100" y="20" width="150" height="210" rx="22"/>
    </svg>
    <div class="etikett">Student tablets</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk ritas varje koppling när Johan säger vad som färdas. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';

  // Linjerna ritas fram med samma streckteknik som i D52: streckmönstret
  // är lika långt som linjen och förskjutningen tweenas till noll.
  document.querySelectorAll('svg.kopplingar line').forEach(function (l) {
    var langd = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value);
    l.style.strokeDasharray = langd;
    l.style.strokeDashoffset = langd;
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och de tre enheterna, en i taget.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.enhet', { opacity: 0, y: 24, stagger: 0.5 }, 0.3);
  tl.set('svg.kopplingar circle', { opacity: 0 }, 0);

  // En koppling: linjen ritas från datorn, en prick åker längs den en gång
  // och tonas bort när den kommer fram, sedan kommer etiketten.
  function koppling(g, etikett, t) {
    var l = g.querySelector('line'), c = g.querySelector('circle');
    tl.to(l, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.inOut' }, t);
    tl.set(c, { opacity: 1 }, t + 0.9);
    tl.to(c, { attr: { cx: l.x2.baseVal.value, cy: l.y2.baseVal.value }, duration: 1.0, ease: 'power1.inOut' }, t + 0.9);
    tl.to(c, { opacity: 0, duration: 0.3 }, t + 1.8);
    tl.from(etikett, { opacity: 0, y: 16, duration: 0.6 }, t + 0.6);
  }
  koppling(document.querySelector('.k1'), '.v1', 2.2);
  koppling(document.querySelector('.k2'), '.v2', 4.4);

  // Fokus: kopplingen till elevernas plattor. Linjen och etiketten blir
  // koppar, skärmen och dess koppling tonas ned. Ett klick när fokus landar.
  var tF = 7.0;
  tl.to('.e-skarm, .k1, .v1', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.k2 line', { stroke: '#C2793A', duration: 0.6 }, tF);
  tl.to('.v2', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
