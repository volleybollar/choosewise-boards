<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P219 · A conversation with AI</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Chattfönstret ----------
     Ett generiskt fönster utan varumärke, som i N5. Det slutar vid x 1500,
     så att kamerazonen nere till höger alltid är tom. */
  .fonster {
    position: absolute; left: 140px; top: 100px; width: 1360px; height: 760px;
    background: #FFFFFF; color: var(--cw-text-ljus);
    border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-media); overflow: hidden;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }
  /* Fönstrets list: tre prickar och ett tomt adressfält. */
  .list { height: 76px; background: var(--cw-ljus-alt); display: flex; align-items: center; gap: 14px; padding: 0 28px; }
  .list i { width: 18px; height: 18px; border-radius: 50%; background: var(--cw-kant-ljus); }
  .adress { margin-left: 24px; flex: 1; height: 40px; border-radius: 999px; background: var(--cw-ljus); }

  /* Lärarens repliker: till höger i en ljusgrå bubbla. Bubblan har fast
     storlek, så den står still medan bara texten skrivs fram inuti den. */
  .prompt {
    position: absolute; right: 60px; height: 110px;
    background: var(--cw-ljus-alt); border-radius: 36px; padding: 28px 40px;
    font-size: var(--cw-min-etikett); line-height: 1.3; white-space: nowrap;
  }
  /* Delen av en replik som fokus pekar på. Strecket under ritas fram. */
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: -6px; height: 5px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }

  /* AI:ns svar: till vänster med en rund symbol, utan bubbla.
     "Tänker"-prickarna ligger på samma plats som svaret och syns före det. */
  .svar { position: absolute; left: 60px; display: flex; align-items: center; gap: 32px; }
  .avatar { flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--cw-accent); }
  .svar p { margin: 0; font-size: var(--cw-min-etikett); line-height: 1.3; }
  .tanker { position: absolute; left: 60px; display: flex; gap: 14px; }
  .tanker i { width: 20px; height: 20px; border-radius: 50%; background: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">
  <div class="fonster">
    <div class="list"><i></i><i></i><i></i><div class="adress"></div></div>

    <!-- Replik 1, läraren. Bubblan står på plats från början. -->
    <div class="prompt p1" style="top:130px; width:700px"><span class="del">Write a quiz on the water cycle.</span></div>

    <!-- Svar 1, AI. -->
    <div class="tanker t1" style="top:320px"><i></i><i></i><i></i></div>
    <div class="svar s1" style="top:296px"><div class="avatar"></div><p>Here are ten questions with answers.</p></div>

    <!-- Replik 2, läraren följer upp. Delad i tre delar så att mittendelen kan markeras. -->
    <div class="prompt p2" style="top:420px; width:580px"><span class="del">Make it </span><span class="del nyckel">easier for Year 4<b class="streck"></b></span><span class="del">.</span></div>

    <!-- Svar 2, AI. -->
    <div class="tanker t2" style="top:610px"><i></i><i></i><i></i></div>
    <div class="svar s2" style="top:586px"><div class="avatar"></div><p>Done. Shorter questions, simpler words.</p></div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN ===== Provtider; vid synk följer skrivandet Johans röst. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Skriver fram texten i en bubbla, ungefär 18 tecken i sekunden (tyst).
  // Texten i varje del sparas och töms först. Funktionen lägger skrivandet
  // på tidslinjen och svarar med hur lång tid det tar.
  function skriv(bubbla, start) {
    var delar = gsap.utils.toArray(bubbla.querySelectorAll('.del'));
    var texter = delar.map(function (d) { return d.firstChild.textContent; });
    var totalt = texter.join('').length;
    function visa(n) {
      texter.forEach(function (t, i) {
        delar[i].firstChild.textContent = t.slice(0, Math.max(0, Math.min(t.length, n)));
        n -= t.length;
      });
    }
    visa(0);
    var raknare = { n: 0 }, tid = totalt / 18;
    tl.to(raknare, { n: totalt, duration: tid, ease: 'none',
      onUpdate: function () { visa(Math.round(raknare.n)); } }, start);
    return tid;
  }

  // Tänkprickarna guppar en kort stund och försvinner, sedan kommer svaret.
  function svara(nr, start) {
    tl.from('.t' + nr, { opacity: 0, duration: 0.3 }, start);
    tl.to('.t' + nr + ' i', { y: -10, duration: 0.3, stagger: 0.12, yoyo: true, repeat: 3, ease: 'sine.inOut' }, start);
    tl.to('.t' + nr, { opacity: 0, duration: 0.3 }, start + 1.5);
    tl.from('.s' + nr + ' .avatar', { opacity: 0, scale: 0.6, duration: 0.5 }, start + 1.7);
    tl.from('.s' + nr + ' p', { opacity: 0, y: 20 }, start + 1.8);
    return 2.6;
  }

  // Fönstret glider upp med den tomma första bubblan på plats (framväxt, tyst).
  tl.from('.fonster', { opacity: 0, y: 40 }, 0);

  // Replik, svar, replik, svar.
  var t = 1.2;
  t += skriv(document.querySelector('.p1'), t) + 0.6;
  t += svara(1, t) + 0.4;
  tl.from('.p2', { opacity: 0, y: 20, duration: 0.5 }, t);   // den andra bubblan dyker upp tom
  t += 0.6;
  t += skriv(document.querySelector('.p2'), t) + 0.6;
  t += svara(2, t);

  // Fokus: strecket under "easier for Year 4" ritas fram i koppar och texten
  // blir kopparfärgad. Uppföljningen är poängen. Fokuskonturen är tyst.
  var tF = t + 0.8;
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.nyckel', { color: '#9C5A24', duration: 0.6 }, tF);
  tl.to({}, { duration: 2.5 });

  Tavla.start(tl);
</script>
</body>
</html>
