<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P198 · Odometer roll</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Mätarverket ----------
     Varje siffra har ett eget fönster (overflow: hidden). Inuti ligger en
     hög remsa med siffrorna 0–9 tre gånger. Remsan rullar uppåt och
     stannar på rätt siffra, som i en gammal mätare. */
  .fonster {
    position: absolute; top: 300px; width: 200px; height: 280px;
    overflow: hidden; background: var(--cw-ljus-alt);
    border-radius: var(--cw-radie-media);
  }
  .remsa div {
    height: 280px; line-height: 280px; text-align: center;
    font-size: 240px; font-weight: var(--cw-vikt-tunn);
  }
  /* Enheten bredvid siffrorna och förklaringen under. */
  .enhet {
    position: absolute; left: 800px; top: 440px; font-size: 96px;
    font-weight: var(--cw-vikt-tunn); color: var(--cw-text-ljus-dampad);
  }
  .forklaring { position: absolute; left: 120px; top: 640px; color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Time back each week</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Tre siffror. data-siffra är siffran remsan ska stanna på. -->
  <div class="fonster" style="left:120px"><div class="remsa" data-siffra="1"></div></div>
  <div class="fonster" style="left:340px"><div class="remsa" data-siffra="3"></div></div>
  <div class="fonster" style="left:560px"><div class="remsa" data-siffra="5"></div></div>
  <div class="enhet">min</div>
  <div class="forklaring etikett">Planning time saved per teacher</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== REMSORNA =====
     Fyll varje remsa med 0–9 tre gånger (30 siffror). */
  var HOJD = 280;
  var remsor = gsap.utils.toArray('.remsa');
  remsor.forEach(function (r) {
    for (var i = 0; i < 30; i++) {
      var d = document.createElement('div');
      d.textContent = i % 10;
      r.appendChild(d);
    }
  });

  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar sista siffran när Johan säger talet. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Struktur först: rubrik, märke, fönster, enhet och förklaring.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: 0.18 }, 0);
  tl.from('.fonster', { opacity: 0, y: 24, stagger: 0.18 }, 0.4);
  tl.from('.enhet, .forklaring', { opacity: 0, y: 16, stagger: 0.18 }, 0.8);

  // Remsorna rullar två varv och stannar på sin siffra, från vänster till
  // höger med 0,4 s mellanrum.
  remsor.forEach(function (r, i) {
    var mal = 20 + Number(r.dataset.siffra);
    tl.to(r, { y: -mal * HOJD, duration: 2.2, ease: 'power2.out' }, 2.0 + i * 0.4);
  });

  // Fokus: när sista siffran har landat blir talet koppar. Ett klick.
  var tF = 2.0 + (remsor.length - 1) * 0.4 + 2.1;
  tl.to('.remsa', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
