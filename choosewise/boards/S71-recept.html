<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S71 · Pick the recipe: three prompt templates</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Tre receptkort ----------
     Varje kort är en promptmall. Korten står i rad mellan x 120 och x 1520
     och slutar vid y 860, långt från kamerazonen nere till höger. */
  .kort {
    position: absolute; top: 300px; width: 440px; height: 560px;
    padding: 48px; background: #FFFFFF;
    border: 3px solid var(--cw-kant-ljus); border-radius: var(--cw-radie-kort);
  }
  /* Kortets nummer, stort och tunt, och mallens namn. */
  .kort .nr {
    display: block; font-size: var(--cw-min-siffra); font-weight: var(--cw-vikt-tunn);
    line-height: 1; color: var(--cw-text-ljus-dampad); margin-bottom: 20px;
  }
  .kort h2 { margin: 0 0 36px; font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); }

  /* Receptet: mallens rader i kodtypsnitt. [Luckorna] fyller läraren i,
     de är blå så att de syns. */
  .kort .rad { font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett); line-height: 1.5; color: var(--cw-text-ljus-dampad); }
  .kort .lucka { color: var(--cw-accent); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">
  <h1 class="rubrik">Pick the recipe, then cook</h1>

  <!-- Kort 1: förklara ett ämne. -->
  <div class="kort" style="left:120px">
    <span class="nr">01</span>
    <h2>Explain</h2>
    <div class="rad"><span class="lucka">[topic]</span></div>
    <div class="rad">for <span class="lucka">[age]</span></div>
    <div class="rad">in 3 steps</div>
  </div>

  <!-- Kort 2: gör ett förhör. Det här kortet väljs. -->
  <div class="kort vald" style="left:600px">
    <span class="nr">02</span>
    <h2>Quiz</h2>
    <div class="rad">5 questions</div>
    <div class="rad">on <span class="lucka">[topic]</span></div>
    <div class="rad">+ answers</div>
  </div>

  <!-- Kort 3: ge återkoppling på en elevtext. -->
  <div class="kort" style="left:1080px">
    <span class="nr">03</span>
    <h2>Feedback</h2>
    <div class="rad">on <span class="lucka">[text]</span></div>
    <div class="rad">2 strengths</div>
    <div class="rad">1 next step</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer varje kort när Johan nämner det, och valet
     landar på ordet "quiz". */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var kort = gsap.utils.toArray('.kort');
  var vald = document.querySelector('.kort.vald');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Rubriken, sedan korten ett i taget med raderna strax efter (tyst).
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  kort.forEach(function (k, i) {
    var t = 0.6 + i * 0.9;
    tl.from(k, { opacity: 0, y: 40 }, t);
    tl.from(k.querySelectorAll('.rad'), { opacity: 0, y: 16, stagger: STEG }, t + 0.3);
  });

  // Fokus: kortet "Quiz" lyfts och får kopparkant, de andra tonas ned.
  // Ett klick när valet landar.
  var tF = 5.2;
  tl.to(kort.filter(function (k) { return k !== vald; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(vald, { y: -30, borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(vald.querySelectorAll('.nr, h2'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.3, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
