<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S149 · Post card</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Inlägget ----------
     Ett generiskt socialt inlägg som belägg: avsändare, text och en rad
     med reaktioner. Inget märke från något socialt nätverk, inget riktigt
     namn. Kortet slutar vid x 1420 och y 870, långt från kamerazonen. */
  .post {
    position: absolute; left: 120px; top: 250px; width: 1300px; height: 620px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort); padding: 52px 72px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  .vem { display: flex; align-items: center; gap: 28px; }
  .vem svg { flex: 0 0 96px; }
  .vem .namn { font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); }
  .vem .var { font-size: var(--cw-min-etikett); }

  .text { margin-top: 44px; font-size: 54px; font-weight: var(--cw-vikt-display); line-height: 1.2; }
  .text p { margin: 0 0 20px; }
  /* Meningen som är beviset. Strecket under ritas fram i koppar. */
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: -2px; height: 6px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }

  /* Reaktionsraden längst ned: tre generiska ikoner med ord. */
  .reaktioner {
    position: absolute; left: 72px; right: 72px; bottom: 44px; padding-top: 32px;
    border-top: 2px solid var(--cw-ljus-alt); display: flex; gap: 72px;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }
  .reaktioner span { display: flex; align-items: center; gap: 16px; }
  .reaktioner svg * { fill: none; stroke: #4E5A68; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <!-- Inlägget är ett påhittat exempel. Byt mot ett riktigt inlägg
       (med tillstånd från den som skrev det) innan boarden används. -->
  <div class="exempel" style="left:120px; top:180px">Example post · replace with a real post and permission</div>

  <div class="post">
    <div class="vem">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="48" fill="#EFF2F6"/>
        <circle cx="48" cy="38" r="16" fill="#0B3A6F"/>
        <path d="M18 84 a30 26 0 0 1 60 0 Z" fill="#0B3A6F"/>
      </svg>
      <div><div class="namn">A teacher</div><div class="var dampad">Secondary school</div></div>
    </div>

    <div class="text">
      <p>We tried the exit-ticket prompt in Year 8 today.</p>
      <p><span class="nyckel">Pupils argued about the answers<b class="streck"></b></span>, not the AI.</p>
    </div>

    <div class="reaktioner">
      <span><svg width="44" height="44" viewBox="0 0 44 44"><path d="M8 20 h8 v18 h-8 Z M16 20 l8 -14 a5 5 0 0 1 6 5 v7 h8 a4 4 0 0 1 4 5 l-3 13 a4 4 0 0 1 -4 3 h-19"/></svg>Like</span>
      <span><svg width="44" height="44" viewBox="0 0 44 44"><path d="M6 8 h32 v22 h-18 l-9 8 v-8 h-5 Z"/></svg>Comment</span>
      <span><svg width="44" height="44" viewBox="0 0 44 44"><path d="M26 6 l12 12 l-12 12 M38 18 h-18 a12 12 0 0 0 -12 12 v6"/></svg>Share</span>
    </div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Inlägget kommer in som en helhet, texten rad för rad, och
     fokus landar på meningen som är beviset, med ett klick. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: märket och det tomma inlägget med reaktionsraden.
  tl.from('.exempel', { opacity: 0, y: 16 }, 0);
  tl.from('.post', { opacity: 0, y: 40 }, 0.2);
  tl.from('.reaktioner', { opacity: 0 }, 0.6);

  // Avsändaren och texten (tyst: framväxt).
  tl.from('.vem', { opacity: 0, x: -20 }, 1.2);
  tl.from('.text p', { opacity: 0, y: 20, stagger: 1.2 }, 2.0);

  // Fokus: strecket under beviset ritas fram och orden blir koppar.
  // Resten av inlägget tonas ned. Ett klick.
  var tF = 5.4;
  tl.to('.vem, .text p:first-child, .reaktioner', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.nyckel', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.6, 'landa');

  tl.to({}, { duration: 3 });  // vila

  Tavla.start(tl);
</script>
</body>
</html>
