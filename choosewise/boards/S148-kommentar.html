<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S148 · Comment card</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kommentarskortet ----------
     En fråga från en medlem i gemenskapen, som ett vitt kort. Medlemmen är
     generisk ("A member") med en enkel figur i stället för foto.
     Kortet slutar vid x 1520 och y 750, långt från kamerazonen. */
  .kort {
    position: absolute; left: 120px; top: 270px; width: 1400px; height: 480px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort); padding: 56px 72px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  .vem { display: flex; align-items: center; gap: 28px; }
  .vem svg { flex: 0 0 96px; }
  .vem .namn { font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); }
  .vem .var { font-size: var(--cw-min-etikett); }

  .fraga {
    margin-top: 56px; font-size: 72px; font-weight: var(--cw-vikt-display);
    letter-spacing: -0.01em; line-height: 1.15;
  }
  /* Kärnan i frågan. Strecket under ritas fram i koppar: boardens fokus. */
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: -4px; height: 6px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">A question from the community</h1>

  <div class="kort">
    <!-- Avsändaren: en egen enkel figur, inget foto och inget riktigt namn. -->
    <div class="vem">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="48" fill="#EFF2F6"/>
        <circle cx="48" cy="38" r="16" fill="#4A7FB5"/>
        <path d="M18 84 a30 26 0 0 1 60 0 Z" fill="#4A7FB5"/>
      </svg>
      <div><div class="namn">A member</div><div class="var dampad">Choosewise community</div></div>
    </div>

    <!-- Frågan. Byt mot den riktiga frågan; låt kärnan ligga i .nyckel. -->
    <div class="fraga">How do I stop pupils <span class="nyckel">copying AI answers<b class="streck"></b></span> in homework?</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Kortet kommer in, sedan avsändaren och frågan. Fokus landar
     på kärnan i frågan med ett klick. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och det tomma kortet.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.kort', { opacity: 0, y: 40 }, 0.2);

  // Avsändaren och frågan (tyst: framväxt).
  tl.from('.vem', { opacity: 0, x: -20 }, 1.2);
  tl.from('.fraga', { opacity: 0, y: 24 }, 2.0);

  // Fokus: strecket under kärnan ritas fram och orden blir koppar. Ett klick.
  var tF = 4.4;
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.nyckel', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.6, 'landa');

  tl.to({}, { duration: 3 });  // vila medan Johan läser frågan

  Tavla.start(tl);
</script>
</body>
</html>
