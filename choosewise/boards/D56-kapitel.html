<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D56 · Chapter divider</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kapitelavdelaren ----------
     En kort paus mellan två stora delar av filmen. Den visas i helbild utan
     kamera, därför mörk scen (regeln i OMBYGGNAD.md). Allt står i en
     vänsterställd kolumn från x 120. */

  /* Kapitlets nummer: stort och tunt. */
  .nummer {
    position: absolute; left: 110px; top: 170px; margin: 0;
    font-size: 260px; font-weight: var(--cw-vikt-tunn); line-height: 1; letter-spacing: -0.03em;
    color: var(--cw-text-mork-dampad);
  }

  /* Kapitlets namn med ett kopparstreck under som ritas fram. */
  .namn {
    position: absolute; left: 120px; top: 470px; margin: 0;
    font-size: 104px; font-weight: var(--cw-vikt-display); line-height: 1.1; letter-spacing: -0.02em;
  }
  .namn .streck {
    position: absolute; left: 0; right: 0; bottom: -14px; height: 7px; border-radius: 4px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }

  /* "Chapter 2 of 5" i typsnittet med fast teckenbredd. */
  .var-ar-vi {
    position: absolute; left: 124px; top: 660px;
    font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett);
    color: var(--cw-text-mork-dampad); letter-spacing: .04em;
  }

  /* Framstegsprickarna: en per kapitel. Klara och pågående är fyllda,
     de som återstår är bara en kontur. */
  .prickar { position: absolute; left: 124px; top: 760px; display: flex; gap: 20px; }
  .prickar i { width: 88px; height: 16px; border-radius: 8px; border: 2px solid var(--cw-text-mork-dampad); }
  .prickar i.klar { background: var(--cw-text-mork); border-color: var(--cw-text-mork); }
</style>
</head>
<body>

<!-- ===== BOARDEN (mörk scen: kameran syns inte här) ===== -->
<div class="cw mork">
  <div class="nummer">02</div>
  <h1 class="namn">Prompts that work<b class="streck"></b></h1>
  <div class="var-ar-vi">Chapter 2 of 5</div>
  <!-- Fem kapitel: två är klara eller pågår, tre återstår. -->
  <div class="prickar"><i class="klar"></i><i class="klar"></i><i></i><i></i><i></i></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer namnet när Johan säger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Numret stiger upp, sedan namnet (tyst: en framväxt har inget ljud).
  tl.from('.nummer', { opacity: 0, y: 60, duration: 1.0 }, 0.2);
  tl.from('.namn', { opacity: 0, y: 30 }, 1.0);

  // Fokus: kopparstrecket ritas fram under namnet.
  tl.to('.namn .streck', { scaleX: 1, duration: 0.9, ease: 'power2.inOut' }, 2.0);

  // Var vi är i filmen: raden och prickarna, en i taget.
  tl.from('.var-ar-vi', { opacity: 0, y: 16 }, 2.8);
  tl.from('.prickar i', { opacity: 0, scaleX: 0.4, stagger: STEG, duration: 0.5 }, 3.2);

  // Lång vila: avdelaren ska stå still en stund innan nästa del börjar.
  tl.to({}, { duration: 3.6 });

  Tavla.start(tl);
</script>
</body>
</html>
