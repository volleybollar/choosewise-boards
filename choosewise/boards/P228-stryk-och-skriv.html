<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P228 · Cross out and rewrite</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- "Inte det här, utan det här" ----------
     En inledande rad, sedan det gamla ordet som stryks över med en
     klotterlinje. Det nya ordet skrivs fram ovanför, från vänster till
     höger, som med en penna. Allt ligger till vänster om x 1300. */
  .inledning { position: absolute; left: 120px; top: 280px; font-size: 56px; color: var(--cw-text-ljus-dampad); }

  /* Det nya ordet: kursiv serif, så att det känns handskrivet. */
  .nytt {
    position: absolute; left: 120px; top: 380px; white-space: nowrap;
    font-family: var(--cw-font-serif); font-style: italic; font-size: 190px; line-height: 1;
    color: var(--cw-text-ljus);
  }
  /* Det gamla ordet, stort och tunt. */
  .gammalt {
    position: absolute; left: 120px; top: 640px; white-space: nowrap;
    font-size: 160px; font-weight: var(--cw-vikt-display); line-height: 1; letter-spacing: -0.02em;
  }
  /* Klotterlinjen som stryker över det gamla ordet. */
  .klotter { position: absolute; left: 100px; top: 640px; width: 760px; height: 170px; overflow: visible; }
  .klotter path { fill: none; stroke: var(--cw-text-ljus); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Feedback that moves learning</h1>

  <div class="inledning">Every piece of work should end with</div>

  <!-- Det nya ordet (skrivs fram) och det gamla (stryks över). -->
  <div class="nytt">a next step.</div>
  <div class="gammalt">a grade.</div>

  <!-- Klotterlinjen: en sicksack fram och tillbaka över ordet. -->
  <svg class="klotter" viewBox="0 0 760 170">
    <path d="M10,110 L560,60 L40,95 L590,40 L70,80 L610,30"/>
  </svg>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk stryks ordet när Johan säger "not", och det nya
     skrivs fram när han säger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  // Klotterlinjen göms genom att streckmönstret skjuts ut helt.
  var klotter = document.querySelector('.klotter path');
  var langd = klotter.getTotalLength();
  klotter.style.strokeDasharray = langd;
  klotter.style.strokeDashoffset = langd;

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och inledningen, sedan det gamla ordet (tyst).
  tl.from('.rubrik, .inledning', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.gammalt', { opacity: 0, y: 24 }, 1.2);

  // Det gamla ordet stryks över och tonas ned.
  tl.to(klotter, { strokeDashoffset: 0, duration: 1.0, ease: 'power2.inOut' }, 3.2);
  tl.to(['.gammalt', '.klotter'], { opacity: 0.38, duration: 0.6 }, 4.3);

  // Det nya ordet skrivs fram från vänster, som med en penna.
  // clipPath öppnas från höger kant mot vänster: "inset(0 100% 0 0)" döljer allt.
  tl.fromTo('.nytt', { clipPath: 'inset(0 100% 0 -20px)' },
    { clipPath: 'inset(0 -40px 0 -20px)', duration: 1.8, ease: 'none' }, 4.8);

  // Fokus: det nya ordet blir koppar när det är färdigskrivet. Ett klick.
  var tF = 6.7;
  tl.to('.nytt', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
