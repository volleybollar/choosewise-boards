<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S09 · Stamps and verdicts</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Korten ----------
     Två kort, ett användningsområde per kort. Det högra kortet slutar vid
     x 1540, till vänster om kamerazonen. */
  .kort {
    position: absolute; top: 320px; width: 680px; height: 500px; padding: 56px 56px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort);
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  .kort .typ {
    font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett);
    letter-spacing: .06em; text-transform: uppercase; color: var(--cw-text-ljus-dampad);
  }
  .kort .vad {
    font-size: 66px; font-weight: var(--cw-vikt-display); line-height: 1.12;
    margin-top: 28px; letter-spacing: -0.01em;
  }

  /* ---------- Stämpeln ----------
     En ram med versaler, lite sned, som stämplas på kortets nedre del.
     Den ligger inuti kortet så att den aldrig sticker ut i kamerazonen. */
  .stampel {
    position: absolute; left: 56px; bottom: 56px; padding: 12px 32px;
    border: 6px solid currentColor; border-radius: 14px;
    font-size: 54px; font-weight: var(--cw-vikt-stark); letter-spacing: .08em;
    text-transform: uppercase; transform: rotate(-6deg);
  }
  /* "Tested" i accentfärg. "Doesn't work" i koppar: boardens fokus. */
  .stampel.testad { color: var(--cw-accent); }
  .stampel.inte { color: var(--cw-glod-text); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Two tasks, two verdicts</h1>
  <!-- Omdömena är exempel. Byt mot det ni själva har testat. -->
  <div class="exempel" style="left:120px; top:205px">Example verdicts · replace with your own tests</div>

  <div class="kort" style="left:120px">
    <div class="typ">Task 1</div>
    <div class="vad">Quiz questions from a text</div>
    <div class="stampel testad">Tested</div>
  </div>

  <div class="kort" style="left:860px">
    <div class="typ">Task 2</div>
    <div class="vad">Final grades with no teacher</div>
    <div class="stampel inte">Doesn't work</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar varje stämpel när Johan säger omdömet. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var kort = gsap.utils.toArray('.kort');
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken, märket och båda korten.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from(kort, { opacity: 0, y: 40, stagger: 0.4 }, 0.6);

  // En stämpel "trycks" ned: den börjar stor och genomskinlig och landar
  // snabbt på kortet. Den rör sig inte efter att den landat.
  function stampla(el, t) {
    tl.fromTo(el, { scale: 1.8, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: 'power3.in' }, t);
  }

  // Första stämpeln: "Tested" (tyst).
  stampla('.stampel.testad', 2.6);

  // Fokus: "Doesn't work" landar, och det första kortet tonas ned. Ett klick.
  var tF = 4.8;
  stampla('.stampel.inte', tF);
  tl.to(kort[0], { opacity: 0.38, duration: 0.6 }, tF + 0.35);
  tl.to(kort[1], { borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF + 0.35);
  Tavla.ljud(tl, tF + 0.35, 'landa');
  tl.to({}, { duration: 3 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
