<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H143 · Agenda</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kapitellistan ----------
     Fem kapitel uppifrån och ned. Klara kapitel får en bock, kapitlet vi
     är i nu blir koppar. Boarden kan visas flera gånger i samma video:
     byt bara vilket kapitel som är "nu" (se rörelsen nedan).
     Listan håller sig till vänster om x 1300, så kamerazonen är tom. */
  .lista { position: absolute; left: 120px; top: 250px; }
  .kapitel {
    display: flex; align-items: center; height: 132px; white-space: nowrap;
  }
  /* Ringen till vänster: tom för de andra kapitlen, fylld för "nu". */
  .ring {
    flex: 0 0 36px; height: 36px; margin-right: 48px; border-radius: 50%;
    border: 4px solid var(--cw-text-ljus-dampad);
  }
  .nr {
    width: 140px; font-size: 72px; font-weight: var(--cw-vikt-tunn);
    color: var(--cw-text-ljus-dampad); font-variant-numeric: tabular-nums;
  }
  .namn { font-size: 60px; font-weight: var(--cw-vikt-display); }
  .bock { margin-left: 40px; font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What we’ll cover</h1>

  <!-- Kapitlen. Klassen "klar" ger en bock, klassen "nu" ger fokus.
       Namnen kan bli kapitelnamnen i videon. -->
  <div class="lista">
    <div class="kapitel klar"><i class="ring"></i><span class="nr">01</span><span class="namn">Why it matters</span><span class="bock">✓ done</span></div>
    <div class="kapitel klar"><i class="ring"></i><span class="nr">02</span><span class="namn">Your first prompt</span><span class="bock">✓ done</span></div>
    <div class="kapitel nu"><i class="ring"></i><span class="nr">03</span><span class="namn">Checking the answer</span></div>
    <div class="kapitel"><i class="ring"></i><span class="nr">04</span><span class="namn">Using it in class</span></div>
    <div class="kapitel"><i class="ring"></i><span class="nr">05</span><span class="namn">What to avoid</span></div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar fokus när Johan säger namnet på kapitlet
     han går in i nu. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var kapitel = gsap.utils.toArray('.kapitel');
  var nu = document.querySelector('.kapitel.nu');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Rubriken och alla kapitel, uppifrån och ned (tyst: framväxt).
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from(kapitel, { opacity: 0, x: -24, stagger: 0.3 }, 0.5);

  // Klara kapitel får sin bock.
  var tK = 3.4;
  tl.from('.bock', { opacity: 0, x: -16, duration: 0.5, stagger: STEG }, tK);

  // Fokus: kapitlet vi är i nu blir koppar, alla andra tonas ned. Ett klick.
  var tF = 5.2;
  tl.to(kapitel.filter(function (k) { return k !== nu; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(nu.querySelector('.ring'), { backgroundColor: '#C2793A', borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(nu.querySelectorAll('.nr, .namn'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
