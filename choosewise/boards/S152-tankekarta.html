<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S152 · Mind map</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Grenarna ----------
     Linjerna ritas i en SVG som täcker hela boarden. Varje linje går från
     mitten (x 860, y 600) ut till sin gren. */
  .linjer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .linjer line { stroke: var(--cw-kant-ljus); stroke-width: 5; stroke-linecap: round; }

  /* Mitten: ämnet i en mörkblå cirkel. */
  .mitt {
    position: absolute; left: 860px; top: 600px; width: 300px; height: 300px;
    margin: -150px 0 0 -150px; border-radius: 50%;
    background: var(--cw-accent); color: #FFFFFF;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 52px; font-weight: var(--cw-vikt-stark); line-height: 1.1;
  }

  /* En gren: en vit kapsel med kort text. left/top i HTML är kapselns
     mittpunkt; transform flyttar den så att mitten hamnar där.
     .gren har samma färg som bakgrunden och döljer linjens sista bit, så
     att linjen inte syns genom kapseln när den tonas ned. */
  .gren {
    position: absolute; transform: translate(-50%, -50%);
    background: var(--cw-ljus); border-radius: 999px;
  }
  .kapsel {
    white-space: nowrap; background: #FFFFFF; border: 3px solid var(--cw-kant-ljus);
    border-radius: 999px; padding: 22px 40px; font-size: var(--cw-min-etikett);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Everything AI touches in school</h1>

  <!-- Linjerna. x2/y2 är samma punkt som grenens left/top nedan.
       Grenarna nere till höger slutar före x 1570 (kamerazonen). -->
  <svg class="linjer">
    <line x1="860" y1="600" x2="380"  y2="370"/>
    <line x1="860" y1="600" x2="1350" y2="370"/>
    <line x1="860" y1="600" x2="1440" y2="620"/>
    <line x1="860" y1="600" x2="1200" y2="880"/>
    <line x1="860" y1="600" x2="520"  y2="890"/>
    <line x1="860" y1="600" x2="300"  y2="640"/>
  </svg>

  <div class="mitt">AI in<br>school</div>

  <!-- Grenarna, i den ordning de ritas ut. Den sista får fokus. -->
  <div class="gren" style="left:380px;  top:370px"><div class="kapsel">Lesson planning</div></div>
  <div class="gren" style="left:1350px; top:370px"><div class="kapsel">Assessment</div></div>
  <div class="gren" style="left:1440px; top:620px"><div class="kapsel">Student privacy</div></div>
  <div class="gren" style="left:1200px; top:880px"><div class="kapsel">Teacher time</div></div>
  <div class="gren" style="left:520px;  top:890px"><div class="kapsel">Ethics</div></div>
  <div class="gren" style="left:300px;  top:640px"><div class="kapsel">Feedback</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk ritas varje gren ut på ordet som namnger den. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var linjer = gsap.utils.toArray('.linjer line');
  var grenar = gsap.utils.toArray('.kapsel');
  var fokus = grenar[grenar.length - 1];

  // Linjerna gömms med streckmönstret, så att de kan ritas fram från mitten.
  linjer.forEach(function (l) {
    var len = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value);
    // Glappet görs lite längre än linjen, annars syns en prick vid änden.
    gsap.set(l, { strokeDasharray: len + ' ' + (len + 20), strokeDashoffset: len });
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och mitten finns när boarden öppnar.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.mitt', { opacity: 0, scale: 0.7, duration: 0.9 }, 0.3);

  // Grenarna ritas ut en i taget: linjen växer från mitten, sedan kommer
  // kapseln (tyst: framväxt).
  grenar.forEach(function (g, i) {
    var t = 1.4 + i * 1.0;
    tl.to(linjer[i], { strokeDashoffset: 0, duration: 0.7 }, t);
    tl.from(g, { opacity: 0, scale: 0.8, duration: 0.6 }, t + 0.5);
  });

  // Fokus: "Feedback" får kopparkant och koppartext, de andra grenarna
  // och linjerna tonas ned. Ett klick när fokus landar.
  var tF = 1.4 + grenar.length * 1.0 + 0.8;
  tl.to(grenar.filter(function (g) { return g !== fokus; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(linjer.slice(0, -1), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(linjer[linjer.length - 1], { stroke: '#C2793A', duration: 0.6 }, tF);
  tl.to(fokus, { borderColor: '#C2793A', color: '#9C5A24', boxShadow: '0 0 0 10px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
