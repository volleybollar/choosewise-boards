<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S177 · A number with its source</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Siffran, meningen och källan ----------
     Tre lager under varandra, vänsterställda vid x 120 som rubriken.
     Allt slutar före x 1500, långt från kamerazonen nere till höger. */

  /* Nyckeltalet: mycket stort och tunt. */
  .tal {
    position: absolute; left: 110px; top: 280px; margin: 0;
    font-size: 300px; font-weight: var(--cw-vikt-tunn); line-height: 1;
    letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  /* Meningen som säger vad talet betyder. */
  .mening {
    position: absolute; left: 120px; top: 620px; width: 1300px; margin: 0;
    font-size: 56px; font-weight: var(--cw-vikt-display); line-height: 1.2;
  }
  /* Källraden: ett tunt streck och sedan källan i dämpad text.
     Strecket ritas fram från vänster innan källan syns. */
  .linje {
    position: absolute; left: 120px; top: 800px; width: 600px; height: 3px;
    background: var(--cw-kant-ljus); transform-origin: 0 50%;
  }
  .kalla { position: absolute; left: 120px; top: 840px; margin: 0; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What the research says</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- data-varde är talet som räknas upp. -->
  <p class="tal" data-varde="68">0%</p>
  <p class="mening">of teachers used AI to plan a lesson</p>

  <div class="linje"></div>
  <!-- Källan. Byt platshållaren mot den riktiga studien (författare, år, länk). -->
  <p class="kalla etikett dampad">Source: replace with the real study</p>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar talet när Johan säger siffran. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tal = document.querySelector('.tal');
  var mal = +tal.dataset.varde, rakn = { v: 0 };

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och märket.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Talet tonar in och räknas upp till sitt värde.
  tl.from(tal, { opacity: 0, y: 30 }, 1.0);
  tl.to(rakn, { v: mal, duration: 1.8, ease: 'power2.out',
    onUpdate: function () { tal.textContent = Math.round(rakn.v) + '%'; } }, 1.0);

  // Fokus: när talet har landat blir det koppar. Ett klick, en gång.
  var tF = 2.9;
  tl.to(tal, { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF, 'landa');

  // Meningen kommer, sedan strecket och källraden (tyst).
  tl.from('.mening', { opacity: 0, y: 24 }, 3.6);
  tl.from('.linje', { scaleX: 0, duration: 0.9, ease: 'power2.inOut' }, 4.8);
  tl.from('.kalla', { opacity: 0, y: 16 }, 5.4);

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
