<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S07 · Concept cards</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Korten ----------
     Tre kort i en rad, ett begrepp per kort. Raden börjar vid x 120 och
     slutar vid x 1550, alltså till vänster om kamerazonen (x 1570). */
  .rad { position: absolute; left: 120px; top: 330px; display: flex; gap: 40px; }
  .kort {
    width: 450px; height: 520px; padding: 56px 48px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort);
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  /* Numret: tunt och stort, i accentfärg. */
  .kort .nr {
    font-size: 96px; font-weight: var(--cw-vikt-tunn); line-height: 1;
    color: var(--cw-accent);
  }
  /* Begreppet och en kort fråga som förklarar det. */
  .kort .ord {
    font-size: 66px; font-weight: var(--cw-vikt-display); margin-top: 56px;
    letter-spacing: -0.01em;
  }
  .kort .fraga {
    font-size: var(--cw-min-etikett); line-height: 1.25; margin-top: 24px;
    color: var(--cw-text-ljus-dampad);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Three parts of a good prompt</h1>

  <!-- Korten. Byt ord och fråga för att använda boarden till andra begrepp. -->
  <div class="rad">
    <div class="kort"><div class="nr">1</div><div class="ord">Role</div><div class="fraga">Who should the AI be?</div></div>
    <div class="kort"><div class="nr">2</div><div class="ord">Context</div><div class="fraga">Who are your pupils?</div></div>
    <div class="kort"><div class="nr">3</div><div class="ord">Format</div><div class="fraga">What should come back?</div></div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer varje kort på ordet som namnger det. */
  var IN = 0.8, EASE = 'power2.out';
  var kort = gsap.utils.toArray('.kort');
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken finns när boarden öppnar.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);

  // Korten kommer ett i taget, med en paus mellan så att varje begrepp hinner sägas.
  kort.forEach(function (k, i) {
    var t = 1.0 + i * 1.8;
    tl.from(k, { opacity: 0, y: 50 }, t);
    tl.from(k.querySelectorAll('.ord, .fraga'), { opacity: 0, y: 16, stagger: 0.18, duration: 0.6 }, t + 0.3);
  });

  // Fokus: kort 2 ("Context") blir koppar, de andra tonas ned. Ett klick.
  var fokus = kort[1];
  var tF = 1.0 + kort.length * 1.8 + 0.6;
  tl.to(kort.filter(function (k) { return k !== fokus; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(fokus, { borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(fokus.querySelectorAll('.nr, .ord'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
