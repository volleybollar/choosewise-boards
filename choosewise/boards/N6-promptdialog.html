<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N6 · Questioning a line in the answer</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Chattfönstret ----------
     Samma generiska fönster som i N5 och P219, utan varumärke. Det slutar
     vid x 1500 och y 990, så att kamerazonen nere till höger alltid är tom.
     Skillnaden mot P219: här är det en rad i AI:ns SVAR som markeras, och
     lärarens följdfråga citerar just den raden. */
  .fonster {
    position: absolute; left: 140px; top: 90px; width: 1360px; height: 900px;
    background: #FFFFFF; color: var(--cw-text-ljus);
    border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-media); overflow: hidden;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }
  /* Fönstrets list: tre prickar och ett tomt adressfält. */
  .list { height: 76px; background: var(--cw-ljus-alt); display: flex; align-items: center; gap: 14px; padding: 0 28px; }
  .list i { width: 18px; height: 18px; border-radius: 50%; background: var(--cw-kant-ljus); }
  .adress { margin-left: 24px; flex: 1; height: 40px; border-radius: 999px; background: var(--cw-ljus); }

  /* Lärarens repliker: till höger i en ljusgrå bubbla. */
  .prompt {
    position: absolute; right: 60px; background: var(--cw-ljus-alt); border-radius: 36px;
    padding: 26px 40px; font-size: var(--cw-min-etikett); line-height: 1.3; white-space: nowrap;
  }
  /* Citatet i följdfrågan: raden läraren pekar på, med ett streck till
     vänster, som när man svarar på en viss rad. */
  .citat {
    border-left: 6px solid var(--cw-kant-ljus); padding-left: 22px; margin-bottom: 12px;
    color: var(--cw-text-ljus-dampad);
  }

  /* AI:ns svar: till vänster med en rund symbol, utan bubbla. */
  .svar { position: absolute; left: 60px; display: flex; gap: 32px; }
  .avatar { flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--cw-accent); }
  .svar p { margin: 0 0 14px; font-size: var(--cw-min-etikett); line-height: 1.3; }
  /* Raden som läraren ifrågasätter. Bakgrunden tonas in i koppar som fokus. */
  .svar .tveksam { margin-left: -16px; padding: 4px 16px; border-radius: 12px; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">
  <div class="fonster">
    <div class="list"><i></i><i></i><i></i><div class="adress"></div></div>

    <!-- Lärarens fråga. -->
    <div class="prompt p1" style="top:116px">Summarise the research on homework.</div>

    <!-- AI:ns svar i tre rader. Den tredje raden är den som ifrågasätts. -->
    <div class="svar s1" style="top:252px">
      <div class="avatar"></div>
      <div>
        <p>Homework helps older students more.</p>
        <p>Short tasks work better than long ones.</p>
        <p class="tveksam">It doubles test scores in primary school.</p>
      </div>
    </div>

    <!-- Lärarens följdfråga, med den markerade raden som citat. -->
    <div class="prompt p2" style="top:500px">
      <div class="citat">It doubles test scores…</div>
      <div>Which study says that?</div>
    </div>

    <!-- AI:ns andra svar. -->
    <div class="svar s2" style="top:740px">
      <div class="avatar"></div>
      <div><p>I can’t find a source for that line.</p></div>
    </div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN ===== Provtider; vid synk följer replikerna Johans röst. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Fönstret glider upp (framväxt, tyst).
  tl.from('.fonster', { opacity: 0, y: 40 }, 0);

  // Lärarens fråga och AI:ns svar, rad för rad.
  tl.from('.p1', { opacity: 0, y: 20 }, 0.9);
  tl.from('.s1 .avatar', { opacity: 0, scale: 0.6, duration: 0.5 }, 2.0);
  tl.from('.s1 p', { opacity: 0, y: 20, stagger: 0.6 }, 2.1);

  // Fokus: den tveksamma raden markeras i koppar, de andra raderna tonas
  // ned. Ett klick när markeringen landar.
  var tF = 4.6;
  tl.to('.p1, .s1 .avatar, .s1 p:not(.tveksam)', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.tveksam', { backgroundColor: 'rgba(194,121,58,.18)', color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  // Läraren följer upp och citerar raden. Citatstrecket blir koppar,
  // så att man ser vilken rad frågan gäller.
  tl.from('.p2', { opacity: 0, y: 20 }, tF + 1.4);
  tl.to('.citat', { borderLeftColor: '#C2793A', duration: 0.6 }, tF + 1.6);

  // AI:ns andra svar (tyst).
  tl.from('.s2 .avatar', { opacity: 0, scale: 0.6, duration: 0.5 }, tF + 3.0);
  tl.from('.s2 p', { opacity: 0, y: 20 }, tF + 3.1);

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
