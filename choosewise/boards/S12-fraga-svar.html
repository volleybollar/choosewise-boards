<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S12 · Question and verdict</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Frågan och svaret ----------
     Två block under varandra: först frågan, sedan omdömet. Varje block har
     en liten etikett ovanför. Allt slutar före x 1500. */
  .block { position: absolute; left: 120px; width: 1380px; }
  .fraga-block { top: 170px; }
  .svar-block { top: 560px; padding-left: 48px; }

  .etikett-liten {
    font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett);
    letter-spacing: .06em; text-transform: uppercase; color: var(--cw-text-ljus-dampad);
  }
  .fraga {
    margin: 20px 0 0; font-size: 120px; font-weight: var(--cw-vikt-display);
    line-height: 1.08; letter-spacing: -0.02em;
  }
  .svar {
    margin: 20px 0 0; font-size: 96px; font-weight: var(--cw-vikt-display);
    line-height: 1.1; letter-spacing: -0.02em;
  }
  /* Kopparstrecket till vänster om svaret: det är fokus. */
  .svar-block .streck {
    position: absolute; left: 0; top: 0; width: 8px; height: 100%; border-radius: 4px;
    background: var(--cw-glod); transform-origin: 50% 0; transform: scaleY(0);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <!-- Frågan. -->
  <div class="block fraga-block">
    <div class="etikett-liten">The question</div>
    <h1 class="fraga">Should AI write the feedback?</h1>
  </div>

  <!-- Omdömet. De två raderna i omdömet kommer var för sig. -->
  <div class="block svar-block">
    <b class="streck"></b>
    <div class="etikett-liten">Verdict</div>
    <p class="svar"><span class="del">It can draft it.</span><br><span class="del nyckel">You decide what’s sent.</span></p>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Frågan får hänga kvar en stund innan svaret, så att
     tittaren hinner tänka själv. Vid synk kommer svaret när Johan svarar. */
  var IN = 0.8, EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Frågan kommer först, ensam på boarden.
  tl.from('.fraga-block .etikett-liten', { opacity: 0, y: 16 }, 0.2);
  tl.from('.fraga', { opacity: 0, y: 30 }, 0.5);

  // Paus. Sedan tonas frågan ned och omdömet kommer.
  var tS = 3.8;
  tl.to('.fraga-block', { opacity: 0.38, duration: 0.6 }, tS);
  tl.from('.svar-block .etikett-liten', { opacity: 0, y: 16 }, tS);
  tl.from('.svar .del', { opacity: 0, y: 24, stagger: 1.0 }, tS + 0.3);

  // Fokus: kopparstrecket ritas ned och andra raden blir koppar. Ett klick.
  var tF = tS + 1.6;
  tl.to('.svar-block .streck', { scaleY: 1, duration: 0.8 }, tF);
  tl.to('.nyckel', { color: '#9C5A24', duration: 0.6 }, tF + 0.2);
  Tavla.ljud(tl, tF + 0.3, 'landa');
  tl.to({}, { duration: 3 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
