<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P199 · Scramble decode</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Namnet ----------
     Ett filnamn i typsnitt med fast teckenbredd, så att ingenting hoppar
     när tecknen byts. Varje tecken är ett eget span (byggs av skriptet),
     så att låsta tecken kan ha en annan färg än de som fortfarande snurrar. */
  .namn {
    position: absolute; left: 120px; top: 380px; margin: 0;
    font-family: var(--cw-font-mono); font-size: 120px; font-weight: 500;
    line-height: 1.2; white-space: pre;
  }
  .namn .snurrar { color: var(--cw-text-ljus-dampad); }
  .forklaring { position: absolute; left: 120px; top: 600px; color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Save the prompt you reuse</h1>

  <!-- Namnet som avkodas. Byt texten i data-namn för ett annat namn. -->
  <p class="namn" data-namn="essay-feedback.md"></p>
  <div class="forklaring etikett">Reuse it with every class.</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== TECKNEN =====
     Ett span per tecken. Slumptecknen räknas fram ur tecknets plats och
     tiden, så samma tid ger alltid samma bild (viktigt för exporten). */
  var namnEl = document.querySelector('.namn');
  var NAMN = namnEl.dataset.namn;
  var GLYFER = '#%&@$*+=01<>/';
  var spans = NAMN.split('').map(function () {
    var s = document.createElement('span');
    namnEl.appendChild(s);
    return s;
  });

  // När tecknet dyker upp och när det låses, i sekunder från start.
  // Tecknen låses ett i taget från vänster till höger.
  function dyker(i) { return 0.05 * i; }
  function lases(i) { return 0.8 + 0.14 * i; }
  var LANGD = lases(NAMN.length - 1) + 0.1;

  // Ritar namnet som det ser ut efter p sekunder av avkodningen.
  function rita(p) {
    spans.forEach(function (s, i) {
      if (p < dyker(i)) { s.textContent = ' '; s.className = ''; }
      else if (p < lases(i)) {
        var k = Math.floor(p * 15);
        s.textContent = GLYFER[(i * 7 + k * 5) % GLYFER.length];
        s.className = 'snurrar';
      } else { s.textContent = NAMN[i]; s.className = ''; }
    });
  }
  rita(0);

  /* ===== RÖRELSEN =====
     Provtider. Vid synk startar avkodningen när Johan säger namnet. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Struktur först: rubriken och förklaringen.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.forklaring', { opacity: 0, y: 16 }, 0.6);

  // Avkodningen: en räknare går från 0 till LANGD sekunder i jämn takt.
  var tStart = 2.0;
  var raknare = { p: 0 };
  tl.to(raknare, { p: LANGD, duration: LANGD, ease: 'none',
    onUpdate: function () { rita(raknare.p); } }, tStart);

  // Fokus: när hela namnet är låst blir det koppar. Ett klick.
  var tF = tStart + LANGD + 0.1;
  tl.to(namnEl, { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
