<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D53 · Numbered steps</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Skenan ----------
     En grå skena går genom alla siffror. Ovanpå ligger en blå skena som
     fylls på allteftersom rösten når nästa steg. Skenans mitt är y 390. */
  .skena, .fyllning {
    position: absolute; left: 300px; top: 386px; width: 1080px; height: 8px; border-radius: 4px;
  }
  .skena { background: var(--cw-kant-ljus); transform-origin: 0 50%; }
  .fyllning { background: var(--cw-accent); transform-origin: 0 50%; }

  /* ---------- Ett steg: en siffra i en ring och ett kort under ----------
     Siffrans mitt är stegets x. Kortet är 320 px brett och centrerat under. */
  .steg { position: absolute; top: 0; width: 0; height: 0; }
  .siffra {
    position: absolute; left: -60px; top: 330px; width: 120px; height: 120px; border-radius: 50%;
    background: #fff; border: 3px solid var(--cw-kant-ljus);
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: var(--cw-vikt-display); color: var(--cw-text-ljus-dampad);
  }
  .kort {
    position: absolute; left: -160px; top: 500px; width: 320px; height: 220px; padding: 32px;
    background: var(--cw-ljus-alt); border: 2px solid var(--cw-ljus-alt); border-radius: var(--cw-radie-kort);
    font-size: 44px; line-height: 1.2;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Four steps to an AI-ready lesson</h1>

  <div class="skena"></div>
  <div class="fyllning"></div>

  <!-- Stegen. style="left" är siffrans mitt på skenan. -->
  <div class="steg" style="left:300px"><div class="siffra">1</div><div class="kort">Set the goal</div></div>
  <div class="steg" style="left:660px"><div class="siffra">2</div><div class="kort">Write the prompt</div></div>
  <div class="steg" style="left:1020px"><div class="siffra">3</div><div class="kort">Check every answer</div></div>
  <div class="steg" style="left:1380px"><div class="siffra">4</div><div class="kort">Adapt it for your class</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk tänds varje steg när Johan säger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var steg = gsap.utils.toArray('.steg');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken, skenan och de släckta siffrorna.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.skena', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.2);
  tl.from('.siffra', { opacity: 0, scale: 0.8, stagger: STEG }, 0.5);
  tl.set('.fyllning', { scaleX: 0 }, 0);

  // Varje steg: den blå skenan fylls fram till siffran, siffran tänds
  // (blå fyllning, vit siffra) och kortet stiger upp under den.
  steg.forEach(function (s, i) {
    var t = 1.8 + i * 1.5;
    if (i > 0) tl.to('.fyllning', { scaleX: i / (steg.length - 1), duration: 0.8, ease: 'power2.inOut' }, t - 0.6);
    tl.to(s.querySelector('.siffra'), { backgroundColor: '#0B3A6F', borderColor: '#0B3A6F', color: '#FFFFFF', duration: 0.5 }, t);
    tl.from(s.querySelector('.kort'), { opacity: 0, y: 30 }, t + 0.15);
  });

  // Fokus: steg 3, "Check every answer", blir koppar och de andra tonas ned.
  // Ett klick när fokus landar.
  var fokus = steg[2];
  var tF = 1.8 + steg.length * 1.5 + 0.6;
  // Siffrorna tonas inte med genomskinlighet (då syns skenan igenom),
  // utan får en blekare blå. Korten tonas ned som vanligt.
  steg.filter(function (s) { return s !== fokus; }).forEach(function (s) {
    tl.to(s.querySelector('.kort'), { opacity: 0.38, duration: 0.6 }, tF);
    tl.to(s.querySelector('.siffra'), { backgroundColor: '#A9BBD0', borderColor: '#A9BBD0', duration: 0.6 }, tF);
  });
  tl.to('.skena, .fyllning', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(fokus.querySelector('.siffra'), { backgroundColor: '#C2793A', borderColor: '#C2793A',
    boxShadow: '0 0 0 14px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(fokus.querySelector('.kort'), { borderColor: '#C2793A', color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
