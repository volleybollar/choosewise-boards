<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C239 · Card reveal</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kortet ----------
     Ett vitt kort som "maskas upp" nerifrån när det kommer in. Sedan
     kommer innehållet uppifrån och ned: etikett, tal, rad och etiketter.
     Kortet slutar vid x 980 och y 940, långt från kamerazonen. */
  .kort {
    position: absolute; left: 120px; top: 280px; width: 860px; height: 660px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort); padding: 56px 64px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  .kort .namn { font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad); }
  .kort .tal {
    font-size: 200px; font-weight: var(--cw-vikt-tunn); line-height: 1;
    letter-spacing: -0.03em; margin-top: 24px; color: var(--cw-accent);
  }
  .kort .rad { font-size: var(--cw-min-etikett); margin-top: 36px; }
  /* Små etiketter längst ned i kortet (årskurs och ämne). */
  .chips { display: flex; gap: 20px; margin-top: 48px; }
  .chips span {
    font-size: var(--cw-min-etikett); padding: 10px 28px; border-radius: 999px;
    background: var(--cw-ljus-alt); color: var(--cw-text-ljus-dampad);
  }

  /* ---------- Märket ----------
     Ligger utanför kortet (annars skulle kortets mask klippa det) och
     sitter snett på kortets övre högra hörn. Det är boardens fokus. */
  .marke {
    position: absolute; left: 800px; top: 236px; padding: 14px 36px; border-radius: 999px;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark);
    background: var(--cw-glod); color: #FFFFFF;
    box-shadow: 0 0 0 12px var(--cw-glod-sken);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">One lesson, planned with AI</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:1000px">Example data · replace with real numbers and source</div>

  <!-- Kortet. Delarna har klassen "del" så att de kan komma in i tur och ordning. -->
  <div class="kort">
    <div class="del namn">Prep time</div>
    <div class="del tal">20 min</div>
    <div class="del rad">Plan, quiz and exit ticket</div>
    <div class="del chips"><span>Year 8</span><span>Science</span></div>
  </div>

  <!-- Märket på hörnet. -->
  <div class="marke">With AI</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer kortet när Johan börjar prata om lektionen
     och märket när han säger "med AI". */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Rubriken och märket för exempeldata finns från början.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Kortet maskas upp nerifrån och glider samtidigt lite uppåt.
  // Innehållet kommer aldrig före kortet.
  tl.fromTo('.kort',
    { clipPath: 'inset(100% 0% 0% 0% round 42px)', y: 40 },
    { clipPath: 'inset(0% 0% 0% 0% round 42px)', y: 0, duration: 0.9, ease: 'power2.inOut' }, 1.0);

  // Innehållet uppifrån och ned, en del i taget.
  tl.from('.kort .del', { opacity: 0, y: 24, stagger: 0.5 }, 1.6);

  // Fokus: märket "With AI" landar på hörnet. Det är det enda i koppar.
  // Ett klick när märket landar.
  var tF = 5.6;
  tl.fromTo('.marke', { scale: 0, rotation: -20, opacity: 0 },
    { scale: 1, rotation: -6, opacity: 1, duration: 0.6, ease: 'back.out(2)' }, tF);
  Tavla.ljud(tl, tF + 0.3, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
