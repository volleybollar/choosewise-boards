<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C114 · Ranking</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Rankningslistan ----------
     Fem rader, etta överst. Raderna slutar vid x 1480 och y 960, så att
     kamerazonen nere till höger är tom. Varje rad: placering, namn,
     en poängstapel och poängen. */
  .rad {
    position: absolute; left: 120px; width: 1360px; height: 116px;
    display: flex; align-items: center; gap: 36px; padding: 0 40px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus); border-radius: 30px;
  }
  .plats {
    flex: 0 0 72px; height: 72px; border-radius: 50%;
    background: var(--cw-text-ljus); color: var(--cw-ljus);
    font-size: var(--cw-min-etikett); line-height: 72px; text-align: center;
  }
  .rad .namn { flex: 0 0 520px; font-size: var(--cw-min-etikett); }
  /* Stapeln: en ljusgrå bana med en blå fyllning som växer från vänster. */
  .bana { flex: 1; height: 28px; border-radius: 14px; background: var(--cw-ljus-alt); overflow: hidden; }
  .fyll { height: 100%; border-radius: 14px; background: var(--cw-accent); transform-origin: 0 50%; }
  .rad .poang { flex: 0 0 90px; text-align: right; font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Where AI helps teachers most</h1>
  <!-- Poängen är en bedömning. Byts mot riktiga siffror med källa. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Raderna. data-poang (0–10) styr hur lång stapeln blir. -->
  <div class="rad" style="top:270px" data-poang="9.1"><div class="plats">1</div><div class="namn">Drafting quiz questions</div><div class="bana"><div class="fyll"></div></div><div class="poang">9.1</div></div>
  <div class="rad" style="top:410px" data-poang="8.4"><div class="plats">2</div><div class="namn">Adapting reading texts</div><div class="bana"><div class="fyll"></div></div><div class="poang">8.4</div></div>
  <div class="rad" style="top:550px" data-poang="7.2"><div class="plats">3</div><div class="namn">Parent letters</div><div class="bana"><div class="fyll"></div></div><div class="poang">7.2</div></div>
  <div class="rad" style="top:690px" data-poang="6.0"><div class="plats">4</div><div class="namn">Lesson planning</div><div class="bana"><div class="fyll"></div></div><div class="poang">6.0</div></div>
  <div class="rad" style="top:830px" data-poang="4.8"><div class="plats">5</div><div class="namn">Grading essays</div><div class="bana"><div class="fyll"></div></div><div class="poang">4.8</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Raderna kommer från sista plats till första, så att vinnaren landar
     sist. Provtider; vid synk kommer varje rad när Johan säger den. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var rader = gsap.utils.toArray('.rad');

  // Stapelns längd: poängen av 10.
  rader.forEach(function (r) { r.querySelector('.fyll').style.width = (r.dataset.poang * 10) + '%'; });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik och märket.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Från femte plats till första: raden glider in, stapeln växer, poängen syns.
  rader.slice().reverse().forEach(function (r, i) {
    var t = 1.0 + i * 1.2;
    tl.from(r, { opacity: 0, y: 24 }, t);
    tl.from(r.querySelector('.fyll'), { scaleX: 0, duration: 0.9 }, t + 0.3);
    tl.from(r.querySelector('.poang'), { opacity: 0, duration: 0.5 }, t + 0.7);
  });

  // Fokus: ettan får koppar (stapel, poäng, namn och en ring), de andra
  // tonas ned. Ett klick när fokus landar.
  var etta = rader[0];
  var tF = 1.0 + rader.length * 1.2 + 0.6;
  tl.to(rader.slice(1), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(etta, { borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(etta.querySelector('.fyll'), { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to(etta.querySelector('.plats'), { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to(etta.querySelectorAll('.namn, .poang'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
