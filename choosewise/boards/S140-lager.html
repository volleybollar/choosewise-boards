<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S140 · Stack layers</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Lagren ----------
     Fyra breda plattor staplade på varandra, nedifrån och upp. Varje platta
     har ett namn till vänster och en kort förklaring till höger.
     Plattorna slutar vid x 1460, så kamerazonen nere till höger är tom. */
  .lager {
    position: absolute; left: 120px; width: 1340px; height: 120px;
    background: var(--cw-ljus-alt); border: 3px solid var(--cw-kant-ljus);
    border-radius: 30px; padding: 0 48px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .lager .namn { font-size: 48px; font-weight: var(--cw-vikt-stark); white-space: nowrap; }
  .lager .vad { font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad); white-space: nowrap; }
  /* Det understa lagret är mörkast och det översta ljusast: grunden är tung. */
  .lager.l1 { background: var(--cw-serie-1); border-color: var(--cw-serie-1); color: #FFFFFF; }
  .lager.l1 .vad { color: var(--cw-serie-3); }
  .lager.l2 { background: var(--cw-serie-2); border-color: var(--cw-serie-2); color: #FFFFFF; }
  .lager.l2 .vad { color: var(--cw-ljus-alt); }
  .lager.l3 { background: var(--cw-serie-3); border-color: var(--cw-serie-3); }
  .lager.l3 .vad { color: var(--cw-text-ljus); }
  .lager.l4 { background: #FFFFFF; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Four layers, one decision</h1>

  <!-- Lagren, nedifrån och upp. Byt texterna här; håll dem korta. -->
  <div class="lager l1" style="top:780px"><span class="namn">The AI model</span><span class="vad">predicts the next word</span></div>
  <div class="lager l2" style="top:630px"><span class="namn">The tool</span><span class="vad">where you type and read</span></div>
  <div class="lager l3" style="top:480px"><span class="namn">School rules</span><span class="vad">what is allowed, and when</span></div>
  <div class="lager l4" style="top:330px"><span class="namn">Teacher judgement</span><span class="vad">what is right for this class</span></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar varje lager när Johan nämner det.
     Klicket ligger på det översta lagret, lärarens omdöme. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var lager = gsap.utils.toArray('.lager');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);

  // Lagren sjunker ned på plats ett i taget, underifrån (tyst: framväxt).
  lager.forEach(function (l, i) {
    tl.from(l, { opacity: 0, y: -60 }, 1.0 + i * 1.6);
  });

  // Fokus: det översta lagret får kopparkant och sken, de andra tonas ned. Ett klick.
  var tF = 1.0 + lager.length * 1.6 + 0.4;
  var topp = lager[lager.length - 1];
  tl.to(lager.slice(0, -1), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(topp, { borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(topp.querySelector('.namn'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
