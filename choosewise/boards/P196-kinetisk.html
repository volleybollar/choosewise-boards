<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P196 · Kinetic type</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Orden ----------
     En poäng med siffror, en fras i taget. Storleken visar vikten:
     slutsiffran är störst. Allt står till vänster och slutar ovanför
     y 760, så kamerazonen är tom. */
  .ord {
    position: absolute; left: 120px; margin: 0; white-space: nowrap;
    letter-spacing: -0.02em; line-height: 1; transform-origin: 0 50%;
  }
  .ord1 { top: 270px; font-size: 120px; font-weight: var(--cw-vikt-display); }
  .ord2 { top: 420px; font-size: 84px; font-weight: var(--cw-vikt-display); color: var(--cw-text-ljus-dampad); }
  /* Sista raden: den stora siffran och resten av meningen på samma baslinje. */
  .ord3 { top: 540px; display: flex; align-items: baseline; gap: 40px; }
  .ord3 .tal { font-size: 240px; font-weight: var(--cw-vikt-tunn); transform-origin: 0 70%; }
  .ord3 .rest { font-size: 84px; font-weight: var(--cw-vikt-display); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What feedback costs</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Tre fraser. Vid synk landar varje fras på ordet då Johan säger den. -->
  <p class="ord ord1">30 essays.</p>
  <p class="ord ord2">4 minutes each.</p>
  <p class="ord ord3"><span class="tal">2 hours</span><span class="rest">of feedback.</span></p>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Varje fras "slår ned": den börjar lite större och suddig
     och landar skarp på sin plats. Lugnare än Sirios original (inget skak). */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: 0.18 }, 0);

  // En fras landar: från 1,4 gånger storleken och suddig, till skarp.
  function landa(el, t) {
    tl.from(el, { opacity: 0, scale: 1.4, filter: 'blur(8px)', duration: 0.6 }, t);
  }
  landa('.ord1', 1.4);
  landa('.ord2', 3.0);
  landa('.ord3 .tal', 4.8);
  tl.from('.ord3 .rest', { opacity: 0, x: -20, duration: 0.6 }, 5.3);

  // Fokus: den stora siffran blir koppar, de två första raderna tonas ned.
  // Ett klick när siffran landar.
  var tF = 5.0;
  tl.to('.ord1, .ord2', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.ord3 .tal', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
