<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D48 · Funnel</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Tratten ----------
     Fyra steg uppifrån och ned, från y 300. Varje steg är en rektangel
     som klipps till ett trapets med clip-path; skriptet räknar fram läge
     och sneda kanter. Antalet står till höger om varje steg. */
  .steg {
    position: absolute; height: 140px;
    background: var(--cw-accent); color: var(--cw-ljus);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--cw-min-etikett);
    will-change: opacity;   /* eget lager: annars kan nedtoningen ge en ljusare rand i bilden */
  }
  /* Antalet: ett nyckeltal, stort och tunt. */
  .antal {
    position: absolute; height: 140px; display: flex; align-items: center;
    font-size: var(--cw-min-siffra); font-weight: var(--cw-vikt-tunn); line-height: 1;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">From feedback to better writing</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Stegen, uppifrån. data-antal är talet som visas till höger. -->
  <div class="steg" data-antal="120">Students in Year 9</div>
  <div class="steg" data-antal="84">Used AI feedback</div>
  <div class="steg" data-antal="46">Revised their essay</div>
  <div class="steg" data-antal="19">Better grade</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== FORMEN =====
     Översta steget är 1200 px brett, nedersta slutar 260 px brett.
     Kanterna lutar jämnt hela vägen ned. */
  var VANSTER = 140, TOPPBREDD = 1200, SLUTBREDD = 260, TOPP = 300, HOJD = 140, GLIPA = 16;
  var steg = gsap.utils.toArray('.steg');
  var total = steg.length * HOJD + (steg.length - 1) * GLIPA;
  var lutning = (TOPPBREDD - SLUTBREDD) / 2 / total;
  var cw = document.querySelector('.cw');

  var antal = steg.map(function (el, i) {
    var overkant = TOPP + i * (HOJD + GLIPA);
    var inOver = (overkant - TOPP) * lutning;            // indrag vid stegets överkant
    var bredd = TOPPBREDD - 2 * inOver;
    var d = HOJD * lutning;                              // underkanten är smalare per sida
    el.style.left = (VANSTER + inOver) + 'px';
    el.style.top = overkant + 'px';
    el.style.width = bredd + 'px';
    el.style.clipPath = 'polygon(0 0, 100% 0, ' + (bredd - d) + 'px 100%, ' + d + 'px 100%)';

    // Antalet placeras en bit till höger om stegets kant.
    var a = document.createElement('div');
    a.className = 'antal';
    a.textContent = el.dataset.antal;
    a.style.left = (VANSTER + inOver + bredd + 32) + 'px';
    a.style.top = overkant + 'px';
    cw.appendChild(a);
    return a;
  });

  /* ===== RÖRELSEN =====
     Provtider. Vid synk öppnas varje steg på ordet som namnger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Varje steg öppnas från mitten och antalet kommer strax efter (tyst).
  steg.forEach(function (el, i) {
    var t = 1.0 + i * 1.2;
    tl.from(el, { opacity: 0, scaleX: 0.6 }, t);
    tl.from(antal[i], { opacity: 0, x: -20, duration: 0.6 }, t + 0.4);
  });

  // Fokus: sista steget är svaret och blir koppar, resten tonas ned. Ett klick.
  var sista = steg.length - 1;
  var tF = 1.0 + steg.length * 1.2 + 0.6;
  tl.to(steg.slice(0, sista).concat(antal.slice(0, sista)), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(steg[sista], { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to(antal[sista], { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
