<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B134 · Prompt to answer</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- De två parterna ----------
     Läraren till vänster, AI-tjänsten till höger. Två pilar mellan dem:
     prompten går dit (övre pilen), svaret kommer tillbaka (nedre pilen).
     Allt slutar vid x 1500, så kamerazonen nere till höger är tom. */
  .part {
    position: absolute; top: 240px; width: 420px; height: 140px;
    display: flex; align-items: center; gap: 28px; padding: 0 40px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-media); box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark);
  }
  .larare { left: 120px; }
  .ai { left: 1080px; }
  /* Enkla ikoner utan varumärke: en rund avatar och en ruta med tre prickar. */
  .avatar { flex: 0 0 64px; height: 64px; border-radius: 50%; background: var(--cw-accent); }
  .tjanst {
    flex: 0 0 64px; height: 64px; border-radius: 16px; background: var(--cw-ljus-alt);
    border: 3px solid var(--cw-accent); display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .tjanst i { width: 9px; height: 9px; border-radius: 50%; background: var(--cw-accent); }

  /* Pilarna och prickarna som färdas längs dem. */
  svg.pilar { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .pil { fill: none; stroke: var(--cw-text-ljus-dampad); stroke-width: 4; stroke-linecap: round;
         stroke-dasharray: 1; stroke-dashoffset: 1; }
  .prick { position: absolute; width: 24px; height: 24px; border-radius: 50%;
           background: var(--cw-accent); opacity: 0; }

  /* ---------- Prompten och svaret ----------
     Två paneler under parterna. Etiketten till vänster säger vad det är. */
  .panel {
    position: absolute; left: 120px; width: 1380px; padding: 36px 48px;
    border-radius: var(--cw-radie-media); font-size: var(--cw-min-etikett); line-height: 1.3;
  }
  .panel p { margin: 0; }
  .etikett-liten { color: var(--cw-text-ljus-dampad); margin-bottom: 12px !important; }
  .promptpanel { top: 440px; background: var(--cw-ljus-alt); display: flex; gap: 32px; }
  .promptpanel .etikett-liten { margin: 0 !important; }
  .svarpanel { top: 620px; background: #FFFFFF; border: 3px solid var(--cw-kant-ljus); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">You ask, the AI answers</h1>

  <div class="part larare"><i class="avatar"></i>Teacher</div>
  <div class="part ai"><span class="tjanst"><i></i><i></i><i></i></span>AI service</div>

  <!-- Övre pilen går mot AI-tjänsten, nedre pilen tillbaka till läraren. -->
  <svg class="pilar">
    <path class="pil dit" d="M 560 285 L 1060 285 M 1044 273 L 1060 285 L 1044 297" pathLength="1"/>
    <path class="pil tillbaka" d="M 1060 335 L 560 335 M 576 323 L 560 335 L 576 347" pathLength="1"/>
  </svg>
  <div class="prick p-dit" style="left:548px; top:273px"></div>
  <div class="prick p-tillbaka" style="left:1048px; top:323px"></div>

  <!-- Prompten läraren skickar. -->
  <div class="panel promptpanel"><p class="etikett-liten">Prompt</p><p>Write three quiz questions on volcanoes.</p></div>

  <!-- Svaret som kommer tillbaka. -->
  <div class="panel svarpanel">
    <p class="etikett-liten">Answer</p>
    <p class="rad">1. What is magma made of?</p>
    <p class="rad">2. Why do some volcanoes erupt?</p>
    <p class="rad">3. Where do volcanoes usually form?</p>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk skickas prompten när Johan säger "prompt" och
     svaret landar när han säger "answer". */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och de två parterna.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.part', { opacity: 0, y: 24, stagger: STEG }, 0.3);

  // Prompten skrivs och skickas: pilen ritas och en prick färdas dit (tyst).
  tl.from('.promptpanel', { opacity: 0, x: -30 }, 1.3);
  tl.to('.pil.dit', { strokeDashoffset: 0, duration: 0.6 }, 2.4);
  tl.to('.p-dit', { opacity: 1, duration: 0.2 }, 2.4);
  tl.to('.p-dit', { x: 500, duration: 1.0, ease: 'power2.inOut' }, 2.5);
  tl.to('.p-dit', { opacity: 0, duration: 0.3 }, 3.5);

  // Svaret kommer tillbaka längs den nedre pilen.
  tl.to('.pil.tillbaka', { strokeDashoffset: 0, duration: 0.6 }, 4.0);
  tl.to('.p-tillbaka', { opacity: 1, duration: 0.2 }, 4.0);
  tl.to('.p-tillbaka', { x: -500, duration: 1.0, ease: 'power2.inOut' }, 4.1);
  tl.to('.p-tillbaka', { opacity: 0, duration: 0.3 }, 5.1);
  tl.from('.svarpanel', { opacity: 0, y: 30 }, 5.0);
  tl.from('.svarpanel .rad', { opacity: 0, y: 16, stagger: 0.4 }, 5.4);

  // Fokus: svaret får koppar, prompten tonas ned. Ett klick när fokus landar.
  var tF = 7.0;
  tl.to('.promptpanel', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.svarpanel', { borderColor: '#C2793A', boxShadow: '0 0 0 10px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to('.svarpanel .etikett-liten', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
