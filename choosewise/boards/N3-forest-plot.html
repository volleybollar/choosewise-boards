<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N3 · Forest plot</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Diagrammet ----------
     Studienamnen står i en kolumn vid x 120. Själva diagrammet går från
     x 520 till x 1360 och visar effektstorleken d från −0,4 till 1,0
     (600 px per helt steg). Talen står i en kolumn vid x 1420 och slutar
     före x 1570, så kamerazonen nere till höger är tom. */

  /* Nollinjen: "ingen skillnad". Lodrät, genom hela diagrammet. */
  .noll {
    position: absolute; top: 280px; width: 3px; height: 580px; margin-left: -1.5px;
    background: var(--cw-text-ljus-dampad); transform-origin: 50% 0;
  }
  /* Axeln längst ned med tre tal. */
  .axel { position: absolute; left: 520px; top: 860px; width: 840px; height: 3px; background: var(--cw-kant-ljus); }
  .axeltal {
    position: absolute; top: 880px; width: 120px; margin-left: -60px; text-align: center;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* En rad: namn, konfidensintervall (strecket), punkt (rutan) och tal.
     top sätts i HTML och är radens mittlinje. */
  .rad { position: absolute; left: 0; width: 1560px; height: 0; }
  .rad .namn { position: absolute; left: 120px; top: -28px; font-size: var(--cw-min-etikett); line-height: 1.3; }
  .rad .ki { position: absolute; top: -2px; height: 4px; background: var(--cw-accent); }
  .rad .ruta { position: absolute; background: var(--cw-accent); }
  .rad .tal { position: absolute; left: 1420px; top: -28px; font-size: var(--cw-min-etikett); line-height: 1.3; font-variant-numeric: tabular-nums; }

  /* Det sammanvägda resultatet: en romb i stället för en ruta. */
  .samman .namn, .samman .tal { font-weight: var(--cw-vikt-stark); }
  .romb { position: absolute; top: -28px; overflow: visible; }
  .romb polygon { fill: var(--cw-accent); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Five studies, one answer</h1>
  <!-- Byts mot riktiga studier med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with the real studies and source</div>

  <div class="axel"></div>
  <div class="noll"></div>
  <!-- Axeltalen läggs ut av skriptet: 0, 0.5, 1.0. -->

  <!-- Studierna. data-d är effekten, data-lag/data-hog är
       konfidensintervallets ändar och data-vikt rutans storlek i px
       (större studie = större ruta). -->
  <div class="rad studie" style="top:330px" data-d="0.45" data-lag="0.10" data-hog="0.80" data-vikt="30"><span class="namn">Study 1</span><div class="ki"></div><div class="ruta"></div><span class="tal">0.45</span></div>
  <div class="rad studie" style="top:420px" data-d="0.20" data-lag="-0.15" data-hog="0.55" data-vikt="26"><span class="namn">Study 2</span><div class="ki"></div><div class="ruta"></div><span class="tal">0.20</span></div>
  <div class="rad studie" style="top:510px" data-d="0.60" data-lag="0.30" data-hog="0.90" data-vikt="34"><span class="namn">Study 3</span><div class="ki"></div><div class="ruta"></div><span class="tal">0.60</span></div>
  <div class="rad studie" style="top:600px" data-d="0.15" data-lag="-0.20" data-hog="0.50" data-vikt="24"><span class="namn">Study 4</span><div class="ki"></div><div class="ruta"></div><span class="tal">0.15</span></div>
  <div class="rad studie" style="top:690px" data-d="0.50" data-lag="0.25" data-hog="0.75" data-vikt="40"><span class="namn">Study 5</span><div class="ki"></div><div class="ruta"></div><span class="tal">0.50</span></div>

  <!-- Det sammanvägda resultatet. Rombens bredd är konfidensintervallet. -->
  <div class="rad samman" style="top:800px" data-d="0.38" data-lag="0.24" data-hog="0.52"><span class="namn">Pooled</span><svg class="romb" height="56"><polygon/></svg><span class="tal">0.38</span></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer varje studie på ordet som nämner den, och
     romben landar när Johan säger det sammanvägda resultatet. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var cw = document.querySelector('.cw');
  function xFor(d) { return 520 + (d + 0.4) * 600; }

  // Nollinjen och axeltalen.
  document.querySelector('.noll').style.left = xFor(0) + 'px';
  [0, 0.5, 1.0].forEach(function (d) {
    var t = document.createElement('div'); t.className = 'axeltal';
    t.style.left = xFor(d) + 'px'; t.textContent = d === 0 ? '0' : d.toFixed(1); cw.appendChild(t);
  });

  // Placera strecken och rutorna efter värdena.
  var studier = gsap.utils.toArray('.studie');
  studier.forEach(function (r) {
    var lag = xFor(+r.dataset.lag), hog = xFor(+r.dataset.hog), mitt = xFor(+r.dataset.d), v = +r.dataset.vikt;
    var ki = r.querySelector('.ki');
    ki.style.left = lag + 'px'; ki.style.width = (hog - lag) + 'px';
    // Strecket växer ut åt båda hållen från punkten.
    ki.style.transformOrigin = ((mitt - lag) / (hog - lag) * 100) + '% 50%';
    var ruta = r.querySelector('.ruta');
    ruta.style.left = (mitt - v / 2) + 'px'; ruta.style.top = (-v / 2) + 'px';
    ruta.style.width = v + 'px'; ruta.style.height = v + 'px';
  });

  // Romben: spetsar i intervallets ändar, höjden 56 px.
  var samman = document.querySelector('.samman');
  var sl = xFor(+samman.dataset.lag), sh = xFor(+samman.dataset.hog), sm = xFor(+samman.dataset.d);
  var romb = samman.querySelector('.romb');
  romb.style.left = sl + 'px'; romb.setAttribute('width', sh - sl);
  romb.querySelector('polygon').setAttribute('points', '0,28 ' + (sm - sl) + ',0 ' + (sh - sl) + ',28 ' + (sm - sl) + ',56');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märke, axeln, nollinjen och studienamnen.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.axel, .axeltal', { opacity: 0, duration: 0.6 }, 0.4);
  tl.from('.noll', { scaleY: 0, duration: 1.0, ease: 'power2.inOut' }, 0.5);
  tl.from('.rad .namn', { opacity: 0, x: -16, stagger: 0.08 }, 0.8);

  // Studierna, en i taget: rutan dyker upp, strecket växer ut, talet
  // kommer sist (tyst: framväxt).
  studier.forEach(function (r, i) {
    var t = 2.2 + i * 1.0;
    tl.from(r.querySelector('.ruta'), { scale: 0, duration: 0.5, ease: 'back.out(2)' }, t);
    tl.from(r.querySelector('.ki'), { scaleX: 0, duration: 0.7 }, t + 0.2);
    tl.from(r.querySelector('.tal'), { opacity: 0, duration: 0.5 }, t + 0.5);
  });

  // Fokus: romben landar sist i koppar och studierna tonas ned.
  // Ett klick när romben landar.
  var tF = 2.2 + studier.length * 1.0 + 0.6;
  tl.to(studier, { opacity: 0.38, duration: 0.6 }, tF);
  tl.from(romb, { scaleX: 0, transformOrigin: ((sm - sl) / (sh - sl) * 100) + '% 50%', duration: 0.7 }, tF);
  tl.to(romb.querySelector('polygon'), { fill: '#C2793A', duration: 0.6 }, tF + 0.3);
  tl.to(samman.querySelectorAll('.namn, .tal'), { color: '#9C5A24', duration: 0.6 }, tF + 0.3);
  tl.from(samman.querySelector('.tal'), { opacity: 0, duration: 0.5 }, tF + 0.5);
  Tavla.ljud(tl, tF + 0.6, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
