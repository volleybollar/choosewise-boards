<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F6 · Survey results</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Raderna ----------
     Varje påstående har en text och en liggande stapel under sig.
     Stapeln är delad i fem delar (Strongly agree … Strongly disagree)
     och går från x 120 till x 1220. Till höger står andelen som håller med.
     Allt slutar till vänster om x 1500, så att kamerazonen är tom. */
  .rad { position: absolute; left: 120px; width: 1360px; }
  .pastaende { margin-bottom: 10px; }
  .stapel {
    position: relative; width: 1100px; height: 56px; border-radius: 14px; overflow: hidden;
    background: var(--cw-ljus-alt); display: flex;
  }
  /* En del av stapeln. Bredden räknas fram ur siffrorna nedan. */
  .del { height: 100%; transform-origin: 0 50%; }
  /* Andelen som håller med (Strongly agree + Agree), till höger om stapeln. */
  .summa {
    position: absolute; left: 1140px; bottom: -4px; font-size: 56px;
    font-weight: var(--cw-vikt-stark); line-height: 1;
  }

  /* ---------- Färgerna för svaren ----------
     Blått för att hålla med, grått för att inte hålla med. Bara färger ur
     temat. Kopparn används inte här, den är bara fokus. */
  .sa { background: var(--cw-serie-1); }
  .a  { background: var(--cw-serie-2); }
  .n  { background: var(--cw-kant-ljus); }
  .d  { background: var(--cw-text-mork-dampad); }
  .sd { background: var(--cw-text-ljus-dampad); }

  /* ---------- Förklaringen av färgerna ----------
     Två rader längst ned till vänster, under staplarna. */
  .forklaring { position: absolute; left: 120px; top: 875px; width: 1300px; display: flex; flex-wrap: wrap; column-gap: 48px; row-gap: 10px; }
  .forklaring span { display: flex; align-items: center; gap: 16px; color: var(--cw-text-ljus-dampad); }
  .forklaring i { width: 34px; height: 34px; border-radius: 8px; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">How teachers use AI</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · Source: replace with the real survey</div>

  <!-- De fyra påståendena. data-svar är procent för
       Strongly agree, Agree, Neutral, Disagree, Strongly disagree (summa 100). -->
  <div class="rad" style="top:270px" data-svar="22,38,15,15,10"><div class="pastaende etikett">I use AI to plan lessons</div><div class="stapel"></div><div class="summa"></div></div>
  <div class="rad" style="top:415px" data-svar="12,29,21,23,15"><div class="pastaende etikett">I use AI to give feedback</div><div class="stapel"></div><div class="summa"></div></div>
  <div class="rad" style="top:560px" data-svar="8,25,22,27,18"><div class="pastaende etikett">I let students use AI</div><div class="stapel"></div><div class="summa"></div></div>
  <div class="rad" style="top:705px" data-svar="5,19,20,32,24"><div class="pastaende etikett">I feel trained to use AI</div><div class="stapel"></div><div class="summa"></div></div>

  <div class="forklaring etikett">
    <span><i class="sa"></i>Strongly agree</span>
    <span><i class="a"></i>Agree</span>
    <span><i class="n"></i>Neutral</span>
    <span><i class="d"></i>Disagree</span>
    <span><i class="sd"></i>Strongly disagree</span>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk fylls varje stapel när Johan läser påståendet. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var klasser = ['sa', 'a', 'n', 'd', 'sd'];
  var rader = gsap.utils.toArray('.rad');

  // Bygg stapelns fem delar och skriv andelen som håller med.
  rader.forEach(function (r) {
    var svar = r.dataset.svar.split(',').map(Number);
    var stapel = r.querySelector('.stapel');
    svar.forEach(function (p, i) {
      var d = document.createElement('div');
      d.className = 'del ' + klasser[i];
      d.style.width = p + '%';
      stapel.appendChild(d);
    });
    r.querySelector('.summa').textContent = (svar[0] + svar[1]) + '%';
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märket, påståendena, tomma staplar och färgförklaringen.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.pastaende, .stapel', { opacity: 0, y: 16, stagger: 0.08 }, 0.4);
  tl.from('.forklaring span', { opacity: 0, y: 16, stagger: 0.08 }, 0.8);

  // Staplarna fylls en i taget, del för del från vänster (tyst: framväxt).
  rader.forEach(function (r, i) {
    var t = 2.0 + i * 1.3;
    tl.from(r.querySelectorAll('.del'), { scaleX: 0, duration: 0.35, ease: 'none', stagger: 0.18 }, t);
    tl.from(r.querySelector('.summa'), { opacity: 0, y: 12, duration: 0.5 }, t + 0.9);
  });

  // Fokus: "I feel trained to use AI" får koppar på andelen, de andra
  // raderna tonas ned. Ett klick när fokus landar.
  var fokus = rader[3];
  var tF = 2.0 + rader.length * 1.3 + 0.8;
  tl.to(rader.filter(function (r) { return r !== fokus; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(fokus.querySelectorAll('.summa, .pastaende'), { color: '#9C5A24', duration: 0.6 }, tF);
  tl.to(fokus.querySelector('.stapel'), { boxShadow: '0 0 0 8px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
