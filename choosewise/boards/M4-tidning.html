<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M4 · Newspaper front</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Tidningen ----------
     En förstasida i två halvor med vikningen emellan. Övre halvan har
     tidningens namn och rubriken, nedre halvan en bild och två notiser.
     Tidningen slutar vid x 1440 och y 970, så kamerazonen nere till höger är tom. */
  .tidning { position: absolute; left: 240px; top: 290px; width: 1200px; height: 680px; }
  .halva {
    position: absolute; left: 0; width: 1200px; height: 340px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
  }
  .ovre { top: 0; border-radius: 16px 16px 0 0; box-shadow: 0 24px 60px rgba(11, 58, 111, .14); }
  /* Nedre halvan fälls ned runt vikningen (sin överkant). backface-visibility
     gör att den inte syns medan den ännu är vikt bakåt. */
  .nedre {
    top: 340px; border-top: 2px solid var(--cw-kant-ljus); border-radius: 0 0 16px 16px;
    transform-origin: 50% 0%; backface-visibility: hidden;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }

  /* Tidningens namn: påhittat, i kursiv antikva, med en dubbel linje under. */
  .namn {
    position: absolute; left: 0; right: 0; top: 28px; text-align: center;
    font-family: var(--cw-font-serif); font-style: italic; font-size: 72px; line-height: 1;
  }
  .linjer {
    position: absolute; left: 60px; right: 60px; top: 118px; height: 10px;
    border-top: 3px solid var(--cw-text-ljus); border-bottom: 1px solid var(--cw-text-ljus);
  }
  /* Rubriken ovanför vikningen. Det är den som får fokus. */
  .rubrik-tidning {
    position: absolute; left: 60px; right: 60px; top: 158px; margin: 0;
    font-family: var(--cw-font-serif); font-style: italic; font-weight: 400;
    font-size: 96px; line-height: 1.02; letter-spacing: -0.01em;
  }

  /* Nedre halvan: en bildplatshållare till vänster och två notiser till höger. */
  .bild {
    position: absolute; left: 60px; top: 40px; width: 560px; height: 256px;
    background: var(--cw-ljus-alt); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }
  .notis { position: absolute; left: 670px; width: 470px; }
  .notis h3 { margin: 0 0 22px; font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); line-height: 1.15; }
  /* Notisens brödtext: grå streck, den ska inte läsas. */
  .notis i { display: block; height: 14px; border-radius: 7px; background: var(--cw-kant-ljus); margin-bottom: 18px; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What made the front page?</h1>
  <!-- Tidningen och rubriken är påhittade. Byt mot en riktig rubrik med källa. -->
  <div class="exempel" style="left:120px; top:205px">Example headline · replace with a real one and its source</div>

  <div class="tidning">
    <!-- Övre halvan: namnet och rubriken. -->
    <div class="halva ovre">
      <div class="namn">The School Times</div>
      <div class="linjer"></div>
      <h2 class="rubrik-tidning">Pupils mark the AI’s homework</h2>
    </div>

    <!-- Nedre halvan: syns först när tidningen vecklas ut. -->
    <div class="halva nedre">
      <div class="bild">Photo</div>
      <div class="notis" style="top:40px"><h3>Book fair on Friday</h3><i style="width:100%"></i><i style="width:70%"></i></div>
      <div class="notis" style="top:176px"><h3>New library hours</h3><i style="width:94%"></i><i style="width:55%"></i></div>
    </div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk vecklas tidningen ut när Johan börjar tala om den,
     och rubriken får fokus när han läser den. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Nedre halvan börjar vikt: vriden 90° bakåt runt vikningen, alltså osynlig.
  gsap.set('.nedre', { rotationX: -90, transformPerspective: 2400 });

  // Struktur först: rubriken och märket.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Den vikta tidningen landar (bara övre halvan syns).
  tl.from('.ovre', { opacity: 0, y: 50, duration: 1.0 }, 0.5);

  // Nedre halvan fälls ned runt vikningen och visar bilden och notiserna (tyst).
  tl.to('.nedre', { rotationX: 0, duration: 1.3, ease: 'power2.inOut' }, 2.6);

  // Fokus: rubriken blir koppar, resten av tidningen tonas ned. I nedre
  // halvan tonas bara innehållet, så att papperet förblir vitt och täcker
  // övre halvans skugga.
  var tF = 5.6;
  tl.to('.namn, .linjer, .bild, .notis', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.rubrik-tidning', { color: '#9C5A24', duration: 0.6 }, tF);
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
