<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H144 · Myth vs fact</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Myten och faktan ----------
     Myten överst i ett grått kort. Ett stort kryss stämplas på den.
     Sedan landar faktan under, i ett vitt kort som får fokus.
     Korten slutar vid x 1420, så kamerazonen nere till höger är tom. */
  .lapp {
    position: absolute; left: 120px; font-size: var(--cw-min-etikett);
    letter-spacing: .08em; text-transform: uppercase; color: var(--cw-text-ljus-dampad);
  }
  .kort {
    position: absolute; left: 120px; width: 1300px; height: 170px;
    display: flex; align-items: center; padding: 0 56px;
    border-radius: var(--cw-radie-kort); font-size: 56px; font-weight: var(--cw-vikt-display);
  }
  .myt { top: 320px; background: var(--cw-ljus-alt); }
  .fakta {
    top: 640px; background: #FFFFFF; border: 3px solid var(--cw-kant-ljus);
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }

  /* Krysset som stämplas på myten: en ring med ett ✕, i mörk textfärg. */
  .stampel {
    position: absolute; left: 1300px; top: 330px; width: 150px; height: 150px;
    border-radius: 50%; border: 6px solid var(--cw-text-ljus); background: var(--cw-ljus);
    display: flex; align-items: center; justify-content: center;
    font-size: 84px; line-height: 1; color: var(--cw-text-ljus);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What people think, what’s true</h1>

  <!-- Myten. Skriv den som folk faktiskt säger den. -->
  <div class="lapp" style="top:252px">Myth</div>
  <div class="kort myt">AI detectors reliably catch AI writing.</div>
  <div class="stampel">✕</div>

  <!-- Faktan. En mening, i Johans egna ord från videon. -->
  <div class="lapp lapp-fakta" style="top:572px">Fact</div>
  <div class="kort fakta">They can flag honest pupils’ work too.</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk stämplas krysset när Johan säger att det inte
     stämmer, och faktan landar när han säger vad som gäller. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Rubriken och myten (tyst: framväxt).
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.lapp:not(.lapp-fakta), .myt', { opacity: 0, y: 24, stagger: STEG }, 0.4);

  // Krysset stämplas: det kommer in stort och landar i sin storlek.
  var tS = 2.8;
  tl.from('.stampel', { opacity: 0, scale: 1.8, duration: 0.45, ease: 'power3.in' }, tS);

  // Myten och krysset tonas ned, faktan landar och får fokus. Ett klick.
  var tF = 4.4;
  tl.to('.lapp:not(.lapp-fakta), .myt, .stampel', { opacity: 0.38, duration: 0.6 }, tF);
  tl.from('.lapp-fakta, .fakta', { opacity: 0, y: 24, stagger: STEG }, tF);
  tl.to('.fakta', { borderColor: '#C2793A', color: '#9C5A24', boxShadow: '0 0 0 10px rgba(194,121,58,.34)', duration: 0.6 }, tF + 0.6);
  Tavla.ljud(tl, tF + 0.7, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
