<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M17 · Context meter</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Filerna ----------
     Tre kort i en rad överst. Ikonen på varje kort har samma färg som
     filens del i mätaren, så att tittaren ser vilken fil som tar plats. */
  .fil {
    position: absolute; top: 300px; width: 420px; height: 130px;
    display: flex; align-items: center; gap: 28px; padding: 0 36px;
    background: var(--cw-ljus-alt); border-radius: 30px;
    font-size: var(--cw-min-etikett); white-space: nowrap;
  }
  /* Filikonen: en enkel platt rektangel, inget riktigt programmärke. */
  .fil i { flex: 0 0 48px; height: 60px; border-radius: 8px; display: block; }

  /* ---------- Mätaren ----------
     En liggande bana från x 120 till x 1460. Den slutar långt till vänster
     om kamerazonen (x 1570). Delarna i banan får sin plats och bredd av
     rörelsen nedan. Talet till höger visar hur full mätaren är. */
  .matnamn {
    position: absolute; left: 120px; top: 562px;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }
  .procent {
    position: absolute; left: 1060px; width: 400px; top: 500px; text-align: right;
    font-size: 120px; font-weight: var(--cw-vikt-tunn); line-height: 1;
  }
  .bana {
    position: absolute; left: 120px; top: 650px; width: 1340px; height: 96px;
    background: var(--cw-ljus-alt); border-radius: 48px; overflow: hidden;
  }
  .del { position: absolute; top: 0; height: 100%; width: 0; }
  /* Gränsen: ett lodrätt streck vid banans slut, med en etikett under. */
  .grans {
    position: absolute; left: 1456px; top: 626px; width: 4px; height: 144px;
    background: var(--cw-text-ljus); border-radius: 2px;
  }
  .gransnamn {
    position: absolute; left: 1260px; width: 200px; top: 784px; text-align: right;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* Slutsatsen som kommer när mätaren slår om till koppar. */
  .slutsats {
    position: absolute; left: 120px; top: 860px;
    font-size: 56px; color: var(--cw-glod-text);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">The context window has a limit</h1>
  <!-- Andelarna är påhittade. Byts mot riktiga tal (till exempel antal
       tokens för ett verkligt verktyg) med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Filerna. data-andel är hur många procent av mätaren filen tar.
       Tillsammans ska de bli 100, så att sista filen når kanten. -->
  <div class="fil" data-andel="15" data-farg="#A9BBD0" style="left:120px"><i></i><span>Syllabus</span></div>
  <div class="fil" data-andel="10" data-farg="#4A7FB5" style="left:580px"><i></i><span>Lesson plan</span></div>
  <div class="fil" data-andel="75" data-farg="#0B3A6F" style="left:1040px"><i></i><span>30 essays</span></div>

  <!-- Mätaren: namnet, talet, banan med en del per fil, och gränsen. -->
  <div class="matnamn">Context window</div>
  <div class="procent">0%</div>
  <div class="bana"><div class="del"></div><div class="del"></div><div class="del"></div></div>
  <div class="grans"></div>
  <div class="gransnamn">Limit</div>

  <div class="slutsats">Too much: it forgets the start</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== FÄRGERNA =====
     Varje fil får sin seriefärg på ikonen och på sin del av mätaren. */
  var BANBREDD = 1340;
  var filer = gsap.utils.toArray('.fil');
  var delar = gsap.utils.toArray('.del');
  var procent = document.querySelector('.procent');
  filer.forEach(function (f, i) {
    f.querySelector('i').style.background = f.dataset.farg;
    delar[i].style.background = f.dataset.farg;
  });

  /* ===== RÖRELSEN =====
     Provtider. Vid synk faller varje fil in när Johan nämner den, och
     mätaren slår om när han säger "too much". */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märket och den tomma mätaren med sin gräns.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.bana, .grans', { opacity: 0, duration: 0.6 }, 0.3);
  tl.from('.matnamn, .procent, .gransnamn', { opacity: 0, y: 16, stagger: 0.08 }, 0.5);

  // Filerna faller in en i taget. Efter varje fil växer dess del av
  // mätaren och talet räknar upp. Ett räkneobjekt styr både delens
  // bredd och talet, så att exporten kan hoppa till vilken bildruta
  // som helst (tyst: framväxt).
  var start = 0;   // hur många procent som redan är fyllda
  filer.forEach(function (f, i) {
    var t = 1.4 + i * 2.0;
    var del = delar[i], fran = start, andel = +f.dataset.andel;
    del.style.left = (BANBREDD * fran / 100) + 'px';
    tl.from(f, { opacity: 0, y: -50 }, t);
    var r = { v: 0 };
    tl.to(r, { v: andel, duration: i === filer.length - 1 ? 1.6 : 1.0,
      onUpdate: function () {
        del.style.width = (BANBREDD * r.v / 100) + 'px';
        procent.textContent = Math.round(fran + r.v) + '%';
      } }, t + 0.6);
    start += andel;
  });

  // Fokus: mätaren är full och slår om till koppar. Filerna tonas ned
  // och slutsatsen kommer fram. Ett klick när mätaren slår om.
  var tF = 1.4 + (filer.length - 1) * 2.0 + 0.6 + 1.6 + 0.4;
  // Ikonen och namnet tonas ned, inte hela kortet: tonas kortet ned på en
  // gång ritar webbläsaren en synlig skarv i kortets bakgrund.
  tl.to('.fil i, .fil span', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(delar, { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to('.bana', { boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to('.procent', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.from('.slutsats', { opacity: 0, y: 24 }, tF + 0.4);
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
