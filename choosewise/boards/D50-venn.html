<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D50 · Venn</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Två cirklar som överlappar ----------
     Vänster cirkel har mitten i x 600, höger i x 920, båda på y 620 och
     med radien 300. Överlappet ligger mellan x 620 och x 900.
     Allt slutar vid x 1220, långt från kamerazonen. */
  .venn { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  /* Etiketterna står i den del av cirkeln som inte överlappar. */
  .namn {
    position: absolute; width: 300px; text-align: center;
    font-size: var(--cw-min-etikett); line-height: 1.15;
  }
  /* Överlappets etikett: boardens poäng, koppar när fokus landar. */
  .mitt {
    position: absolute; left: 610px; top: 568px; width: 300px; text-align: center;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); line-height: 1.15;
    color: var(--cw-glod-text);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Good feedback needs both</h1>

  <svg class="venn" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <!-- Formen av vänster cirkel, så att överlappet kan klippas fram. -->
      <clipPath id="vanster-form"><circle cx="600" cy="620" r="300"></circle></clipPath>
    </defs>
    <!-- Vänster cirkel i djupblått, höger i mellanblått (serie 1 och 2). -->
    <g class="cirkel vanster">
      <circle cx="600" cy="620" r="300" fill="#0B3A6F" fill-opacity="0.08" stroke="#0B3A6F" stroke-width="6"></circle>
    </g>
    <g class="cirkel hoger">
      <circle cx="920" cy="620" r="300" fill="#4A7FB5" fill-opacity="0.12" stroke="#4A7FB5" stroke-width="6"></circle>
    </g>
    <!-- Överlappet: höger cirkel klippt med vänster cirkels form.
         Syns först när fokus landar. -->
    <circle class="lins" cx="920" cy="620" r="300" clip-path="url(#vanster-form)"
            fill="#C2793A" fill-opacity="0.34" stroke="none"></circle>
  </svg>

  <div class="namn namn-v" style="left:290px; top:592px">AI speed</div>
  <div class="namn namn-h" style="left:930px; top:568px">Teacher<br>judgement</div>
  <div class="mitt">Better<br>feedback</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk glider varje cirkel in på sitt ord, och fokus
     landar när Johan säger vad som händer i överlappet. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);

  // Cirklarna glider in från var sitt håll, och namnen kommer strax efter.
  tl.from('.vanster', { x: -160, opacity: 0, duration: 1.0 }, 1.0);
  tl.from('.namn-v', { opacity: 0, y: 16 }, 1.6);
  tl.from('.hoger', { x: 160, opacity: 0, duration: 1.0 }, 2.6);
  tl.from('.namn-h', { opacity: 0, y: 16 }, 3.2);

  // Fokus: överlappet fylls med koppar och får sin etikett, cirklarna
  // och deras namn tonas ned. Ett klick.
  var tF = 5.0;
  tl.from('.lins', { opacity: 0, duration: 0.8 }, tF);
  tl.from('.mitt', { opacity: 0, scale: 0.9 }, tF + 0.1);
  tl.to('.cirkel, .namn', { opacity: 0.38, duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
