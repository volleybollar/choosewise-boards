<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P217 · Goal and assessment stay linked</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kabeln ----------
     En mjuk kurva mellan två rutor. SVG-ytan täcker hela boarden, så att
     koordinaterna är samma som board-pixlar. Kurvan räknas om varje gång
     rutorna flyttar sig, därför följer den alltid med. */
  .ytan { position: absolute; left: 0; top: 0; }

  /* Rutorna i ändarna. Deras plats sätts med x och y i rörelsen nedan
     (mitten av rutan hamnar på punkten). De håller sig till vänster om
     x 1460, långt från kamerazonen. */
  .nod {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    padding: 24px 44px; border-radius: 28px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    box-shadow: 0 18px 40px rgba(11, 58, 111, .10);
    font-size: var(--cw-min-etikett); line-height: 1.2;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Goal and assessment stay linked</h1>

  <!-- Kabeln och prickarna som flyter längs den. Ligger under rutorna. -->
  <svg class="ytan" width="1920" height="1080" viewBox="0 0 1920 1080">
    <path class="kabel" fill="none" stroke="#0B3A6F" stroke-width="8" stroke-linecap="round"/>
    <circle class="flode" r="9" fill="#4A7FB5"/>
    <circle class="flode" r="9" fill="#4A7FB5"/>
    <circle class="flode" r="9" fill="#4A7FB5"/>
  </svg>

  <div class="nod a">Learning goal</div>
  <div class="nod b">Assessment</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk flyttar sig rutorna medan Johan säger att lektionen
     ändras, och fokus landar på kabeln när han säger "still linked". */
  var IN = 0.8, EASE = 'power2.out';
  var kabel = document.querySelector('.kabel');
  var floden = gsap.utils.toArray('.flode');

  // Allt som ritas styrs av de här talen. Rutornas mittpunkter (a, b),
  // hur mycket av kabeln som syns (visa, 0–1) och hur långt prickarna har
  // flutit (flod). rita() körs varje gång tidslinjen ritas, också när
  // exporten hoppar till en viss bildruta.
  var a = { x: 420, y: 560 }, b = { x: 1240, y: 460 };
  var lage = { visa: 0, flod: 0 };
  gsap.set('.nod', { xPercent: -50, yPercent: -50 });

  function rita() {
    gsap.set('.nod.a', { x: a.x, y: a.y });
    gsap.set('.nod.b', { x: b.x, y: b.y });
    // Kurvan går vågrätt ut från högerkanten på den vänstra rutan till
    // vänsterkanten på den högra, och böjer mjukt mellan dem.
    // Bredden mäts här varje gång, så att den stämmer när typsnittet har laddats.
    var x1 = a.x + document.querySelector('.nod.a').offsetWidth / 2;
    var x2 = b.x - document.querySelector('.nod.b').offsetWidth / 2;
    var dx = (x2 - x1) * 0.5;
    kabel.setAttribute('d', 'M' + x1 + ' ' + a.y + ' C' + (x1 + dx) + ' ' + a.y + ' ' +
      (x2 - dx) + ' ' + b.y + ' ' + x2 + ' ' + b.y);
    var langd = kabel.getTotalLength();
    kabel.style.strokeDasharray = langd;
    kabel.style.strokeDashoffset = langd * (1 - lage.visa);
    // Tre prickar med lika avstånd. De går runt från början när de nått slutet.
    floden.forEach(function (f, i) {
      var p = kabel.getPointAtLength(langd * (((lage.flod + i / 3) % 1 + 1) % 1));
      f.setAttribute('cx', p.x);
      f.setAttribute('cy', p.y);
    });
  }
  gsap.set(floden, { opacity: 0 });
  rita();

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN }, onUpdate: rita });

  // Struktur först: rubriken och de två rutorna, sedan ritas kabeln mellan dem.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.nod', { opacity: 0, scale: 0.9, stagger: 0.18 }, 0.4);
  tl.to(lage, { visa: 1, duration: 1.2, ease: 'power2.inOut' }, 1.4);

  // Rutorna flyttar sig två gånger. Kabeln böjer med och prickarna flyter
  // längs den så länge något rör sig (tyst).
  var tFlytt = 3.0, flytt = 2.4;
  tl.to(floden, { opacity: 1, duration: 0.4 }, tFlytt);
  tl.to(lage, { flod: 3, duration: flytt * 2 + 0.4, ease: 'none' }, tFlytt);
  tl.to(a, { x: 520, y: 780, duration: flytt, ease: 'power2.inOut' }, tFlytt);
  tl.to(b, { x: 1160, y: 330, duration: flytt, ease: 'power2.inOut' }, tFlytt);
  tl.to(a, { x: 360, y: 440, duration: flytt, ease: 'power2.inOut' }, tFlytt + flytt + 0.4);
  tl.to(b, { x: 1290, y: 620, duration: flytt, ease: 'power2.inOut' }, tFlytt + flytt + 0.4);
  var tStilla = tFlytt + flytt * 2 + 0.4;
  tl.to(floden, { opacity: 0, duration: 0.4 }, tStilla - 0.4);

  // Fokus: kabeln blir koppar, rutorna tonas ned. Ett klick när fokus landar.
  var tF = tStilla + 0.4;
  tl.to('.nod', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(kabel, { stroke: '#C2793A', strokeWidth: 12, duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 }, tF + 0.6);  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
