<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S126 · Checking an AI image</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Bilden ----------
     En enkel egen teckning som står för en AI-genererad bild: en lärare vid
     tavlan. Den har tre typiska AI-fel inritade med flit. Bilden ligger till
     vänster (x 120–920), etiketterna till höger slutar före x 1570. */
  .bild { position: absolute; left: 120px; top: 260px; width: 800px; height: 680px; }

  /* ---------- Pekarna ----------
     Ett genomskinligt lager över hela boarden med en ring runt varje detalj
     och en linje ut till etiketten. Ringar och linjer ritas fram. */
  .pekare { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .pekare circle, .pekare line { fill: none; stroke: #0C1A2E; stroke-width: 5; stroke-linecap: round; }
  /* En ljus kant under ringen, så att den syns även på den mörka tavlan. */
  .pekare .halo { stroke: #FBFAF8; stroke-width: 14; }

  /* Etiketten: en kort mening per detalj, vänsterställd vid x 1000. */
  .etikett-ut {
    position: absolute; left: 1000px; white-space: nowrap;
    font-size: var(--cw-min-etikett); line-height: 60px; margin-top: -30px;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What to check in an AI image</h1>

  <!-- Teckningen. Byt gärna mot en riktig AI-bild (800 × 680 px) och flytta
       ringarna nedan så att de hamnar på detaljerna. -->
  <svg class="bild" viewBox="0 0 800 680">
    <!-- Bakgrund och golv -->
    <rect x="0" y="0" width="800" height="680" rx="24" fill="#EFF2F6"/>
    <line x1="0" y1="600" x2="800" y2="600" stroke="#DDE3EA" stroke-width="4"/>
    <!-- Fönstret med solen till höger -->
    <rect x="580" y="380" width="170" height="160" rx="10" fill="#FBFAF8" stroke="#DDE3EA" stroke-width="4"/>
    <circle cx="665" cy="460" r="34" fill="#A9BBD0"/>
    <!-- Tavlan med "text" som inte går att läsa (fel 1) -->
    <rect x="50" y="70" width="440" height="230" rx="12" fill="#0B3A6F"/>
    <path d="M90 130 q12 -24 24 0 t24 0 l10 -18 l8 18 q14 -20 28 0 M220 112 l0 30 m12 -30 q20 14 0 30 M270 128 q20 -26 40 0 t40 0 l12 -20 l10 20"
          fill="none" stroke="#FBFAF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 210 l14 -22 l14 22 q16 -24 32 0 M180 190 q18 22 36 0 l0 22 M240 210 q12 -26 24 0 t24 0 t24 0 l14 -18 l6 18 q12 -14 24 0"
          fill="none" stroke="#FBFAF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bänken till vänster -->
    <rect x="40" y="500" width="220" height="26" rx="6" fill="#A9BBD0"/>
    <rect x="60" y="526" width="14" height="74" fill="#A9BBD0"/>
    <rect x="226" y="526" width="14" height="74" fill="#A9BBD0"/>
    <!-- Skuggan faller MOT solen (fel 3): den borde falla åt vänster -->
    <ellipse cx="470" cy="606" rx="80" ry="14" fill="#0C1A2E" opacity=".18"/>
    <!-- Läraren -->
    <path d="M280 390 L380 390 L410 600 L250 600 Z" fill="#0B3A6F"/>
    <circle cx="330" cy="340" r="46" fill="#4A7FB5"/>
    <line x1="370" y1="410" x2="468" y2="340" stroke="#0B3A6F" stroke-width="30" stroke-linecap="round"/>
    <!-- Handen med sex fingrar (fel 2) -->
    <circle cx="480" cy="330" r="20" fill="#4A7FB5"/>
    <g stroke="#4A7FB5" stroke-width="9" stroke-linecap="round">
      <line x1="480" y1="330" x2="462" y2="292"/>
      <line x1="480" y1="330" x2="474" y2="286"/>
      <line x1="480" y1="330" x2="487" y2="285"/>
      <line x1="480" y1="330" x2="499" y2="289"/>
      <line x1="480" y1="330" x2="510" y2="298"/>
      <line x1="480" y1="330" x2="516" y2="312"/>
    </g>
  </svg>

  <!-- Ringarna och linjerna i boardens koordinater.
       Bildens hörn ligger på (120, 260), så en punkt (x, y) i teckningen
       hamnar på (x + 120, y + 260) här. -->
  <svg class="pekare" viewBox="0 0 1920 1080">
    <g class="detalj"><circle class="halo" cx="390" cy="445" r="130"/><circle class="ring" cx="390" cy="445" r="130"/><line x1="520" y1="445" x2="980" y2="445"/></g>
    <g class="detalj"><circle class="halo" cx="600" cy="580" r="60"/><circle class="ring" cx="600" cy="580" r="60"/><line x1="660" y1="580" x2="980" y2="580"/></g>
    <g class="detalj"><circle class="halo" cx="590" cy="866" r="70"/><circle class="ring" cx="590" cy="866" r="70"/><line x1="660" y1="866" x2="980" y2="866"/></g>
  </svg>

  <!-- Etiketterna, i samma ordning som ringarna. top = linjens höjd. -->
  <div class="etikett-ut" style="top:445px">Garbled text on the board</div>
  <div class="etikett-ut" style="top:580px">Six fingers on one hand</div>
  <div class="etikett-ut" style="top:866px">Shadow falls toward the sun</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk ritas varje ring när Johan nämner detaljen.
     Boarden är tyst: alla tre felen är lika viktiga. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var detaljer = gsap.utils.toArray('.detalj');
  var etiketter = gsap.utils.toArray('.etikett-ut');

  // Ringar och linjer göms genom att streckmönstret skjuts ut helt.
  gsap.utils.toArray('.pekare circle, .pekare line').forEach(function (e) {
    var langd = e.getTotalLength();
    e.style.strokeDasharray = langd;
    e.style.strokeDashoffset = langd;
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och bilden.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.bild', { opacity: 0, y: 24 }, 0.2);

  // En detalj i taget: ringen, linjen, etiketten. Den nya i koppar,
  // den förra tonas ned.
  detaljer.forEach(function (d, i) {
    var t = 1.6 + i * 2.6;
    if (i > 0) {
      tl.to([detaljer[i - 1], etiketter[i - 1]], { opacity: 0.38, duration: 0.6 }, t);
      tl.to(detaljer[i - 1].querySelectorAll('.ring, line'), { stroke: '#0C1A2E', duration: 0.6 }, t);
      tl.to(etiketter[i - 1], { color: '#0C1A2E', duration: 0.6 }, t);
    }
    tl.to(d.querySelectorAll('circle'), { strokeDashoffset: 0, duration: 0.9 }, t);
    tl.to(d.querySelector('line'), { strokeDashoffset: 0, duration: 0.6 }, t + 0.7);
    tl.from(etiketter[i], { opacity: 0, x: -20 }, t + 1.1);
    tl.to(d.querySelectorAll('.ring, line'), { stroke: '#C2793A', duration: 0.6 }, t + 0.3);
    tl.to(etiketter[i], { color: '#9C5A24', duration: 0.6 }, t + 1.1);
  });

  // Till sist står alla tre lika starka: hela listan att kolla.
  var tS = 1.6 + detaljer.length * 2.6 + 0.4;
  tl.to(detaljer.concat(etiketter), { opacity: 1, duration: 0.6 }, tS);
  tl.to(detaljer[detaljer.length - 1].querySelectorAll('.ring, line'), { stroke: '#0C1A2E', duration: 0.6 }, tS);
  tl.to(etiketter[etiketter.length - 1], { color: '#0C1A2E', duration: 0.6 }, tS);

  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
