<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S67 · The trade-off scale</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Vågen ----------
     Vågen ritas i en SVG som täcker hela boarden. Balken vrids runt
     mittpunkten (x 820, y 330) och vågskålarna hänger alltid rakt ned från
     balkens ändar; skriptet nedan räknar ut var de ska sitta.
     Högra skålen slutar vid x 1530, så kamerazonen är tom. */
  .vag { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

  /* Vikterna: två block som läggs i skålarna. Positionen sätts av skriptet. */
  .vikt {
    position: absolute; width: 380px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: var(--cw-min-etikett); color: #FFFFFF; background: var(--cw-accent);
  }
  .v1 { height: 120px; }
  .v2 { height: 160px; }   /* den tyngre vikten är lite större */
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What are we trading?</h1>

  <svg class="vag" viewBox="0 0 1920 1080">
    <!-- Foten och stolpen står still. -->
    <rect x="620" y="950" width="400" height="24" rx="12" fill="#0C1A2E"/>
    <rect x="810" y="330" width="20" height="630" fill="#0C1A2E"/>
    <!-- Balken: vrids runt mittpunkten. -->
    <rect class="balk" x="300" y="320" width="1040" height="20" rx="10" fill="#0C1A2E"/>
    <circle cx="820" cy="330" r="22" fill="#0C1A2E"/>
    <!-- Vågskålarna: snören (först snett, sedan rakt ned förbi vikten) och en skål. Flyttas till balkens ändar. -->
    <g class="skal s-v">
      <path d="M0 0 L-210 80 L-210 250 M0 0 L210 80 L210 250" stroke="#4E5A68" stroke-width="4" fill="none"/>
      <path d="M-220 250 Q0 300 220 250 Z" fill="#4E5A68"/>
    </g>
    <g class="skal s-h">
      <path d="M0 0 L-210 80 L-210 250 M0 0 L210 80 L210 250" stroke="#4E5A68" stroke-width="4" fill="none"/>
      <path d="M-220 250 Q0 300 220 250 Z" fill="#4E5A68"/>
    </g>
  </svg>

  <div class="vikt v1">Time saved</div>
  <div class="vikt v2">Practice lost</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN ===== Provtider. */
  var EASE = 'power2.out';

  // Ritar vågen vid en viss lutning (grader; plus = högra sidan nedåt).
  var PX = 820, PY = 330, L = 520;
  var lage = { a: 0 };
  function rita() {
    var r = lage.a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    document.querySelector('.balk').setAttribute('transform', 'rotate(' + lage.a + ' ' + PX + ' ' + PY + ')');
    [[-1, '.s-v', '.v1'], [1, '.s-h', '.v2']].forEach(function (d) {
      var x = PX + d[0] * L * c, y = PY + d[0] * L * s;
      document.querySelector(d[1]).setAttribute('transform', 'translate(' + x + ' ' + y + ')');
      var v = document.querySelector(d[2]);
      v.style.left = (x - 190) + 'px';
      v.style.top = (y + 252 - v.offsetHeight) + 'px';   // vikten står i skålen
    });
  }
  rita();

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Struktur först: rubriken och den tomma vågen i balans.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.vag', { opacity: 0, y: 30 }, 0.2);

  // Första vikten läggs i vänstra skålen, vågen tippar åt vänster.
  tl.from('.v1', { opacity: 0, y: -160 }, 1.6);
  tl.to(lage, { a: -6, duration: 1.2, ease: 'power2.inOut', onUpdate: rita }, 2.2);

  // Den andra, tyngre vikten läggs i högra skålen, vågen tippar över.
  tl.from('.v2', { opacity: 0, y: -160 }, 4.4);
  tl.to(lage, { a: 8, duration: 1.4, ease: 'power2.inOut', onUpdate: rita }, 5.0);

  // Fokus: den tyngre vikten blir koppar, den andra tonas ned.
  // Ett klick när vågen har tippat.
  var tF = 6.8;
  tl.to('.v1', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.v2', { backgroundColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
