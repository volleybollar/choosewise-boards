<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C241 · Chart with one bar in focus</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Diagrammet ----------
     Baslinjen ligger på y 860 och staplarna växer uppåt från den.
     Diagrammet slutar vid x 1120, så att pratbubblan får plats till höger
     och kamerazonen nere till höger förblir tom. */
  .baslinje {
    position: absolute; left: 140px; top: 860px; width: 1000px; height: 3px;
    background: var(--cw-text-ljus); transform-origin: 0 50%;
  }
  .stapel { position: absolute; width: 160px; bottom: 220px; }   /* 1080 − 860 = 220 */
  .stapel .fyll {
    position: absolute; left: 0; bottom: 0; width: 100%;
    background: var(--cw-accent); border-radius: 18px 18px 0 0; transform-origin: 50% 100%;
  }
  /* Värdet ovanför stapeln och månaden under baslinjen. */
  .stapel .varde {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark);
  }
  .stapel .namn {
    position: absolute; left: -20px; width: 200px; bottom: -74px; text-align: center;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* ---------- Pratbubblan ----------
     Nyckeltalet som dyker upp bredvid stapeln i fokus, med en linje som
     ritas fram från talet till stapeln. Båda är koppar: de hör till fokus. */
  .notis { position: absolute; left: 1220px; top: 330px; color: var(--cw-glod-text); }
  .notis .tal { display: block; font-size: 120px; font-weight: var(--cw-vikt-tunn); line-height: 1; }
  .notis .etikett { display: block; color: var(--cw-text-ljus-dampad); }
  .ledare { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Lesson plans drafted with AI</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <div class="baslinje"></div>
  <!-- Staplarna, en per månad. data-antal är värdet; höjden räknas fram nedan. -->
  <div class="stapel" data-antal="4"  style="left:160px"><div class="fyll"></div><div class="varde">4</div><div class="namn">Sep</div></div>
  <div class="stapel" data-antal="6"  style="left:360px"><div class="fyll"></div><div class="varde">6</div><div class="namn">Oct</div></div>
  <div class="stapel" data-antal="9"  style="left:560px"><div class="fyll"></div><div class="varde">9</div><div class="namn">Nov</div></div>
  <div class="stapel" data-antal="11" style="left:760px"><div class="fyll"></div><div class="varde">11</div><div class="namn">Dec</div></div>
  <div class="stapel" data-antal="14" style="left:960px"><div class="fyll"></div><div class="varde">14</div><div class="namn">Jan</div></div>

  <!-- Linjen från talet till stapeln i fokus (ritas fram i fokusögonblicket). -->
  <svg class="ledare" width="1920" height="1080">
    <path class="linje" d="M1205 470 Q1160 470 1140 400" stroke="#C2793A" stroke-width="5" fill="none"/>
  </svg>
  <div class="notis"><span class="tal">×3.5</span><span class="etikett">since September</span></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk växer staplarna när Johan börjar prata om diagrammet,
     och fokus landar på ordet som pekar ut januari. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var staplar = gsap.utils.toArray('.stapel');

  // Höjd: den högsta stapeln blir 480 px, de andra i proportion.
  var max = Math.max.apply(null, staplar.map(function (s) { return +s.dataset.antal; }));
  staplar.forEach(function (s) {
    var h = 480 * s.dataset.antal / max;
    s.style.height = h + 'px';
    s.querySelector('.fyll').style.height = h + 'px';
    s.querySelector('.varde').style.bottom = (h + 16) + 'px';
  });

  // Linjen ritas med streckmönstret: hela längden "gömd" till att börja med.
  var linje = document.querySelector('.linje');
  var langd = linje.getTotalLength();
  gsap.set(linje, { strokeDasharray: langd, strokeDashoffset: langd, opacity: 0 });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märket, baslinjen och månaderna.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.baslinje', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.2);
  tl.from('.namn', { opacity: 0, y: 16, stagger: 0.08 }, 0.6);

  // Staplarna växer från baslinjen, en i taget (tyst: framväxt).
  staplar.forEach(function (s, i) {
    var t = 1.8 + i * 0.6;
    tl.from(s.querySelector('.fyll'), { scaleY: 0, duration: 0.9 }, t);
    tl.from(s.querySelector('.varde'), { opacity: 0, y: 16, duration: 0.5 }, t + 0.5);
  });

  // Fokus: januari lyfts lite och blir koppar, de andra tonas ned.
  // Sedan ritas linjen och talet kommer fram. Ett klick när fokus landar.
  var fokus = staplar[staplar.length - 1];
  var tF = 1.8 + staplar.length * 0.6 + 1.0;
  tl.to(staplar.filter(function (s) { return s !== fokus; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(fokus, { y: -12, duration: 0.6, ease: 'back.out(2)' }, tF);
  tl.to(fokus.querySelector('.fyll'), { backgroundColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(fokus.querySelectorAll('.varde, .namn'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.set(linje, { opacity: 1 }, tF + 0.5);
  tl.to(linje, { strokeDashoffset: 0, duration: 0.6 }, tF + 0.5);
  tl.from('.notis .tal, .notis .etikett', { opacity: 0, y: 20, stagger: STEG }, tF + 0.8);

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
