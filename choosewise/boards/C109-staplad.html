<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C109 · Stacked bars</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Teckenförklaringen ----------
     En rad under rubriken: en färgruta och ett namn per del. Delarna står
     i samma ordning som i staplarna, nerifrån och upp. */
  .forklaring { position: absolute; left: 120px; top: 290px; display: flex; gap: 64px; }
  .post { display: flex; align-items: center; gap: 18px; }
  .post i { width: 40px; height: 40px; border-radius: 10px; }

  /* ---------- Diagrammet ----------
     Baslinjen ligger på y 860. En timme är 30 px. Varje stapel är en
     kolumn med delar staplade nerifrån och upp, och summan ovanpå.
     Allt håller sig till vänster om x 1440, långt från kamerazonen. */
  .baslinje {
    position: absolute; left: 140px; top: 860px; width: 1300px; height: 3px;
    background: var(--cw-text-ljus); transform-origin: 0 50%;
  }
  .stapel { position: absolute; width: 180px; bottom: 220px; }   /* 1080 − 860 = 220 */
  .bit { position: absolute; left: 0; width: 100%; transform-origin: 50% 100%; }
  .bit.d2 { border-radius: 18px 18px 0 0; }   /* den översta biten får rundade hörn */
  .summa {
    position: absolute; left: -30px; width: 240px; text-align: center;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark);
  }
  .namn {
    position: absolute; left: -40px; width: 260px; bottom: -74px; text-align: center;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* De tre delarnas färger: serierna ur temat. Kopparn är bara fokus. */
  .d0 { background: var(--cw-serie-1); }
  .d1 { background: var(--cw-serie-2); }
  .d2 { background: var(--cw-serie-3); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Hours per week, by subject</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <div class="forklaring">
    <div class="post p0"><i class="d0"></i><span class="etikett">Planning</span></div>
    <div class="post p1"><i class="d1"></i><span class="etikett">Marking</span></div>
    <div class="post p2"><i class="d2"></i><span class="etikett">Admin</span></div>
  </div>

  <div class="baslinje"></div>
  <!-- Staplarna. data-delar är timmarna för planering, rättning och
       administration, i den ordningen. Bitarna byggs i skriptet. -->
  <div class="stapel" data-delar="4,6,2" style="left:180px"><div class="namn">Maths</div></div>
  <div class="stapel" data-delar="4,8,2" style="left:480px"><div class="namn">English</div></div>
  <div class="stapel" data-delar="5,4,2" style="left:780px"><div class="namn">Science</div></div>
  <div class="stapel" data-delar="3,5,2" style="left:1080px"><div class="namn">History</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk växer varje stapel när Johan nämner ämnet. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var PX = 30;   // pixlar per timme
  var staplar = gsap.utils.toArray('.stapel');

  // Bygg bitarna i varje stapel, nerifrån och upp, och lägg summan ovanpå.
  staplar.forEach(function (s) {
    var delar = s.dataset.delar.split(',').map(Number), y = 0;
    delar.forEach(function (h, i) {
      var bit = document.createElement('div');
      bit.className = 'bit d' + i;
      bit.style.bottom = y + 'px';
      bit.style.height = h * PX + 'px';
      s.appendChild(bit);
      y += h * PX;
    });
    var summa = document.createElement('div');
    summa.className = 'summa';
    summa.style.bottom = (y + 16) + 'px';
    summa.textContent = delar.reduce(function (a, b) { return a + b; }) + ' h';
    s.appendChild(summa);
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märket, teckenförklaringen, baslinjen och namnen.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.post', { opacity: 0, y: 16, stagger: STEG }, 0.4);
  tl.from('.baslinje', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.2);
  tl.from('.namn', { opacity: 0, y: 16, stagger: 0.08 }, 0.6);

  // Staplarna byggs en i taget: bitarna växer efter varandra nerifrån,
  // sedan kommer summan (tyst: framväxt).
  staplar.forEach(function (s, i) {
    var t = 1.8 + i * 1.3;
    s.querySelectorAll('.bit').forEach(function (b, j) {
      tl.from(b, { scaleY: 0, duration: 0.4, ease: 'power1.out' }, t + j * 0.35);
    });
    tl.from(s.querySelector('.summa'), { opacity: 0, y: 16, duration: 0.5 }, t + 1.0);
  });

  // Fokus: rättningen. Den delen blir koppar i alla staplar och i
  // teckenförklaringen, de andra delarna tonas ned. Ett klick när fokus landar.
  var tF = 1.8 + staplar.length * 1.3 + 0.8;
  tl.to('.bit.d0, .bit.d2, .post.p0, .post.p2', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.d1', { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to('.post.p1 .etikett', { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
