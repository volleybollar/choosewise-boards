<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N13 · Three assistants</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- De tre platserna ----------
     Tre lika breda kolumner (440 px) mellan x 110 och x 1510. Texten under
     varje figur är centrerad och får gå på två rader. Allt slutar ovanför
     y 1000 och till vänster om x 1570, så att kamerazonen alltid är tom. */
  .plats {
    position: absolute; top: 120px; width: 440px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .plats svg { display: block; width: 320px; height: 560px; overflow: visible; }
  .plats .etikett { margin-top: 30px; }
  .beskrivning { margin: 12px 0 0; font-size: var(--cw-min-etikett); line-height: 1.25; }

  /* ---------- Figuren ----------
     En egen, enkel figur i helkropp, sedd framifrån: kort hår med sidbena,
     mörkblå kofta över en ljus tröja och händerna knäppta framför magen.
     Samma figur tre gånger. */
  .linje { stroke: var(--cw-text-ljus); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .hy { fill: #FFFFFF; }
  .har { fill: var(--cw-text-ljus); }
  .kofta { fill: var(--cw-serie-1); }
  .arm { fill: none; stroke: var(--cw-serie-1); stroke-width: 24; stroke-linecap: round; }
  .arm-kant { fill: none; stroke: var(--cw-text-ljus); stroke-width: 32; stroke-linecap: round; }
  .trojan { fill: var(--cw-serie-3); }
  .ben { fill: var(--cw-serie-2); }
  .sko { fill: var(--cw-text-ljus); }
  .drag { fill: none; }
  .oga { fill: var(--cw-text-ljus); }
  .skugga { fill: var(--cw-ljus-alt); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <!-- Figuren ritas en gång här och återanvänds i de tre platserna nedan
       (<use>). Ändrar du figuren här, ändras alla tre. -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="assistent">
        <ellipse class="skugga" cx="120" cy="404" rx="80" ry="12"/>
        <!-- Benen ritas först, så att kroppen ligger ovanpå. -->
        <rect class="ben" x="86" y="312" width="28" height="84" rx="12"/><rect class="ben" x="126" y="312" width="28" height="84" rx="12"/>
        <ellipse class="sko" cx="98" cy="398" rx="20" ry="10"/><ellipse class="sko" cx="142" cy="398" rx="20" ry="10"/>
        <!-- Kroppen: kofta med en ljus tröja i mitten. -->
        <path class="kofta" d="M74,178 Q120,166 166,178 L172,320 Q120,330 68,320 Z"/>
        <path class="trojan" d="M104,172 L136,172 L132,326 L108,326 Z"/>
        <!-- Armarna böjs in mot mitten och händerna möts knäppta framför magen. -->
        <!-- Varje arm ritas två gånger: först bredare i mörkt (konturen), sedan i koftans färg. -->
        <path class="arm-kant" d="M80,192 Q50,262 106,270"/><path class="arm-kant" d="M160,192 Q190,262 134,270"/>
        <path class="arm" d="M80,192 Q50,262 106,270"/><path class="arm" d="M160,192 Q190,262 134,270"/>
        <!-- Två händer, den ena över den andra. -->
        <ellipse class="hy linje" cx="128" cy="272" rx="15" ry="12"/>
        <ellipse class="hy linje" cx="112" cy="268" rx="15" ry="12"/>
        <!-- Hals, huvud och hår med sidbena: luggen sveper i en rundad båge mot vänster. -->
        <rect class="hy linje" x="108" y="146" width="24" height="30" rx="6"/>
        <circle class="hy linje" cx="120" cy="100" r="56"/>
        <path class="har" d="M64,116 C46,16 190,16 180,104 C176,86 166,74 150,68 C138,90 104,96 82,94 C72,96 66,106 64,116 Z"/>
        <!-- Ögon och leende. -->
        <circle class="oga" cx="98" cy="106" r="6"/><circle class="oga" cx="142" cy="106" r="6"/>
        <path class="drag linje" d="M104,134 Q120,146 136,134"/>
      </g>
    </defs>
  </svg>

  <!-- Varje plats: figuren, etiketten och texten som växer fram under. -->
  <div class="plats" style="left:110px">
    <svg viewBox="0 0 240 420"><use href="#assistent"/></svg>
    <div class="etikett">Assistant 1</div>
    <p class="beskrivning dampad">Knows nothing about you and your work.</p>
  </div>
  <div class="plats" style="left:590px">
    <svg viewBox="0 0 240 420"><use href="#assistent"/></svg>
    <div class="etikett">Assistant 2</div>
    <p class="beskrivning dampad">Knows a bit about you and your work.</p>
  </div>
  <div class="plats" style="left:1070px">
    <svg viewBox="0 0 240 420"><use href="#assistent"/></svg>
    <div class="etikett">Assistant 3</div>
    <p class="beskrivning dampad">Knows a lot about you and your work.</p>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer varje assistent när Johan nämner den.
     Tyst: figurerna bara växer fram. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  var platser = gsap.utils.toArray('.plats');

  // Steg 1–3: assistenterna med sina namn, en i taget från vänster.
  platser.forEach(function (p, i) {
    tl.from([p.querySelector('svg'), p.querySelector('.etikett')], { opacity: 0, y: 30 }, 0.4 + i * 1.8);
  });

  // Paus (här pratar Johan). Steg 4–6: texterna under, en i taget i samma
  // ordning. Vid synk landar varje text på sitt ord.
  var tText = 0.4 + 2 * 1.8 + 3.0;
  platser.forEach(function (p, i) {
    tl.from(p.querySelector('.beskrivning'), { opacity: 0, y: 20 }, tText + i * 1.8);
  });
  tl.to({}, { duration: 3 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
