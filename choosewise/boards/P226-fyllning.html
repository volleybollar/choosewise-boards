<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P226 · Filling up</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Ordet som fylls ----------
     SVG-ytan täcker hela boarden, så koordinaterna är board-pixlar.
     Det tomma ordet ritas i ljusgrått. Vätskan klipps av ordets form
     (clipPath), så den syns bara inuti bokstäverna. Ordet slutar ovanför
     y 720. (En kontur runt bokstäverna fungerar inte med det här typsnittet:
     linjer inuti R och A syns då.) */
  .ytan { position: absolute; left: 0; top: 0; }
  .ytan text { font-family: var(--cw-font); font-weight: 600; font-size: 300px; letter-spacing: -6px; }

  /* Räknaren till höger om ordet: nyckeltal (stort och tunt) och etikett. */
  .raknare { position: absolute; left: 1240px; top: 470px; }
  .procent { font-size: 160px; font-weight: var(--cw-vikt-tunn); line-height: 1; letter-spacing: -0.03em; }
  .raknare .etikett { margin-top: 12px; color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">AI training this term</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <svg class="ytan" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <!-- Ordets form. Byt ordet här och i det ljusgrå <text> nedanför. -->
      <clipPath id="ordform"><text x="120" y="700">READY</text></clipPath>
    </defs>
    <!-- Det tomma ordet, i ljusgrått. -->
    <text x="120" y="700" fill="#DDE3EA">READY</text>
    <!-- Vätskan: två vågor, en ljusare bakom och en mörkare framför. -->
    <g clip-path="url(#ordform)">
      <path class="vag-bak" fill="#4A7FB5"/>
      <path class="vag-fram" fill="#0B3A6F"/>
    </g>
  </svg>

  <div class="raknare">
    <div class="procent">0%</div>
    <div class="etikett">of staff trained</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk stiger vätskan medan Johan säger meningen, och
     "100%" blir koppar när han säger att alla är med. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var vagBak = document.querySelector('.vag-bak');
  var vagFram = document.querySelector('.vag-fram');
  var procent = document.querySelector('.procent');

  // Allt som ritas styrs av tre tal: nivå (0 = tomt, 1 = fullt), fas (hur
  // långt vågorna har rört sig i sidled) och höjd (hur höga vågorna är).
  // rita() körs varje gång tidslinjen ritas, också när exporten hoppar.
  var lage = { niva: 0, fas: 0, hojd: 22 };
  var BOTTEN = 760, TOPP = 450;   // vätskeytans y-läge vid tomt (under ordet) och fullt

  function vag(y, fas) {
    var d = 'M0 ' + 1080;
    for (var x = 0; x <= 1300; x += 20) {
      d += ' L' + x + ' ' + (y + lage.hojd * Math.sin(x / 220 * Math.PI * 2 + fas)).toFixed(1);
    }
    return d + ' L1300 1080 Z';
  }
  function rita() {
    var y = BOTTEN - (BOTTEN - TOPP) * lage.niva;
    vagBak.setAttribute('d', vag(y - 10, -lage.fas * 0.7 + 1.5));
    vagFram.setAttribute('d', vag(y, lage.fas));
    procent.textContent = Math.round(lage.niva * 100) + '%';
  }
  rita();

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN }, onUpdate: rita });

  // Struktur först: rubrik, märket, det tomma ordet och räknaren på 0 %.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.ytan, .raknare', { opacity: 0, y: 24, stagger: STEG }, 0.5);

  // Vätskan stiger lugnt, vågorna rör sig i sidled under tiden och lägger
  // sig när ordet är fullt. Därefter står allt stilla.
  var tFyll = 1.8, fyll = 5.0;
  tl.to(lage, { niva: 1, duration: fyll, ease: 'power2.inOut' }, tFyll);
  tl.to(lage, { fas: Math.PI * 6, duration: fyll + 0.6, ease: 'sine.out' }, tFyll);
  tl.to(lage, { hojd: 0, duration: 1.4, ease: 'power2.inOut' }, tFyll + fyll - 0.8);

  // Fokus: "100%" blir koppar när ordet är fullt. Ett klick.
  var tF = tFyll + fyll + 0.6;
  tl.to(procent, { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 }, tF + 0.6);  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
