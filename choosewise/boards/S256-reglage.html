<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S256 · Before/after slider</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Bildramen ----------
     Två bilder ligger exakt på varandra. Underst bilden UTAN kod, överst
     bilden MED kod. Den översta visas bara till höger om handtaget, så när
     handtaget dras fram och tillbaka jämförs de två bilderna.
     Ramen slutar vid x 1440 och y 950, långt från kamerazonen. */
  .ram {
    position: absolute; left: 140px; top: 250px; width: 1300px; height: 700px;
    border-radius: var(--cw-radie-media); overflow: hidden;
    border: 2px solid var(--cw-kant-ljus);
  }
  .lager { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .lager svg { display: block; width: 100%; height: 100%; }

  /* Etiketterna: "Without code" uppe till vänster, "With code" uppe till
     höger. De ligger i varsitt lager och klipps alltså med bilden. */
  .lapp {
    position: absolute; top: 32px; padding: 8px 30px;
    border-radius: 999px; background: var(--cw-ljus);
    font-size: var(--cw-min-etikett); line-height: 1.2;
  }
  .utan .lapp { left: 32px; }
  .med .lapp { right: 32px; }

  /* ---------- Handtaget ----------
     En lodrät linje genom hela bilden och en rund knopp med två pilar.
     Skriptet flyttar det i sidled. */
  .handtag { position: absolute; left: 0; top: 0; width: 0; height: 100%; }
  .handtag .linje {
    position: absolute; left: -3px; top: 0; width: 6px; height: 100%;
    background: var(--cw-ljus); box-shadow: 0 0 12px rgba(11, 58, 111, .3);
  }
  .handtag .knopp {
    position: absolute; left: -48px; top: 302px; width: 96px; height: 96px;
    border-radius: 50%; background: var(--cw-ljus);
    border: 4px solid var(--cw-accent);
    box-shadow: 0 8px 24px rgba(11, 58, 111, .22);
  }
  .knopp svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .knopp path { fill: none; stroke: var(--cw-accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Bildens färger ----------
     Samma motiv ritas i båda lagren. Klassen på lagret bestämmer färgerna:
     .utan är blek och suddig, .med är skarp med tydliga konturer. */
  .utan svg { filter: blur(2px); }
  .utan .himmel { fill: var(--cw-ljus-alt); }
  .utan .sol    { fill: var(--cw-ljus); }
  .utan .kulle-bak  { fill: var(--cw-kant-ljus); }
  .utan .kulle-fram { fill: var(--cw-text-mork-dampad); opacity: .55; }
  .utan .hus    { fill: var(--cw-ljus); }
  .utan .tak, .utan .dorr { fill: var(--cw-kant-ljus); }
  .utan .fonster { fill: var(--cw-ljus-alt); }
  .utan .stam   { fill: var(--cw-text-ljus-dampad); opacity: .4; }
  .utan .krona  { fill: var(--cw-text-mork-dampad); opacity: .5; }

  .med .himmel { fill: var(--cw-serie-3); }
  .med .sol    { fill: var(--cw-ljus); }
  .med .kulle-bak  { fill: var(--cw-serie-2); }
  .med .kulle-fram { fill: var(--cw-serie-1); }
  .med .hus    { fill: var(--cw-ljus); }
  .med .tak, .med .dorr { fill: var(--cw-accent); }
  .med .fonster { fill: var(--cw-serie-3); }
  .med .stam   { fill: var(--cw-text-ljus); }
  .med .krona  { fill: var(--cw-serie-2); }
  .med svg * { stroke: var(--cw-text-ljus); stroke-width: 6; stroke-linejoin: round; }
  .med .himmel { stroke: none; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Drag to see what the code does</h1>

  <div class="ram">
    <div class="lager utan"><span class="lapp">Without code</span></div>
    <div class="lager med"><span class="lapp">With code</span></div>
    <!-- Handtaget: pilar åt båda hållen i knoppen. -->
    <div class="handtag">
      <div class="linje"></div>
      <div class="knopp"><svg viewBox="0 0 96 96"><path d="M38 34 L24 48 L38 62"/><path d="M58 34 L72 48 L58 62"/></svg></div>
    </div>
  </div>

  <!-- Motivet ritas en gång här och kopieras till båda lagren av skriptet.
       Byt gärna motiv: behåll klassnamnen, så följer färgerna med. -->
  <template id="motiv">
    <svg viewBox="0 0 1300 700" preserveAspectRatio="xMidYMid slice">
      <rect class="himmel" width="1300" height="700"/>
      <circle class="sol" cx="1060" cy="205" r="78"/>
      <path class="kulle-bak" d="M0 470 Q 320 360 650 450 T 1300 420 V700 H0 Z"/>
      <rect class="hus" x="430" y="300" width="400" height="250" rx="6"/>
      <polygon class="tak" points="400,310 630,175 860,310"/>
      <rect class="fonster" x="470" y="350" width="90" height="70" rx="6"/>
      <rect class="fonster" x="700" y="350" width="90" height="70" rx="6"/>
      <rect class="dorr" x="590" y="440" width="80" height="110" rx="6"/>
      <path class="kulle-fram" d="M0 560 Q 400 490 800 560 T 1300 545 V700 H0 Z"/>
      <rect class="stam" x="1000" y="440" width="24" height="110" rx="6"/>
      <circle class="krona" cx="1012" cy="410" r="78"/>
      <rect class="stam" x="200" y="460" width="22" height="100" rx="6"/>
      <circle class="krona" cx="211" cy="430" r="66"/>
    </svg>
  </template>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  // Lägg in motivet i båda lagren, före etiketten.
  var motiv = document.getElementById('motiv');
  document.querySelectorAll('.lager').forEach(function (l) {
    l.insertBefore(motiv.content.cloneNode(true), l.firstChild);
  });

  /* ===== HANDTAGET =====
     reglage.x är handtagets läge i ramen (0 = vänsterkant, 1300 = högerkant).
     placera() flyttar handtaget och klipper bilden med kod så att den bara
     syns till höger om handtaget. */
  var med = document.querySelector('.lager.med');
  var handtag = document.querySelector('.handtag');
  var reglage = { x: 650 };
  function placera() {
    handtag.style.transform = 'translateX(' + reglage.x + 'px)';
    med.style.clipPath = 'inset(0 0 0 ' + reglage.x + 'px)';
  }
  placera();

  /* ===== RÖRELSEN =====
     Provtider. Vid synk dras handtaget medan Johan jämför bilderna. */
  var IN = 0.8, EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken, ramen och etiketterna. Handtaget står i mitten.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.ram', { opacity: 0, y: 40 }, 0.3);
  tl.from('.lapp', { opacity: 0, y: 16, stagger: 0.18 }, 1.0);
  tl.from('.handtag', { opacity: 0, duration: 0.6 }, 1.4);

  // Handtaget dras: först åt höger (mer utan kod), sedan åt vänster
  // (mer med kod) och till sist tillbaka till ett viloläge (tyst).
  var stopp = [1040, 220, 480], t = 2.6;
  stopp.forEach(function (x) {
    tl.to(reglage, { x: x, duration: 1.6, ease: 'power2.inOut', onUpdate: placera }, t);
    t += 2.0;
  });

  // Fokus: "With code" blir koppar när handtaget har stannat. Ett klick.
  var tF = t - 0.3;
  tl.to('.med .lapp', { color: '#9C5A24', boxShadow: '0 0 0 6px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
