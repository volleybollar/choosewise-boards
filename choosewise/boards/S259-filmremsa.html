<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S259 · Film strip, pick one frame</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Filmremsan ----------
     En lång mörk remsa med fjorton bildrutor. Den är 4000 px bred och glider
     in från höger. När den stannar slutar den vid x 1540, så att kamerazonen
     nere till höger är tom. Rutorna skapas av skriptet längst ned. */
  .remsa {
    position: absolute; left: 0; top: 740px; width: 4000px; height: 200px;
    background: var(--cw-text-ljus); border-radius: 12px;
  }
  /* Perforeringen: små ljusa hål längs över- och underkanten. */
  .remsa::before, .remsa::after {
    content: ''; position: absolute; left: 12px; right: 12px; height: 10px;
    background: repeating-linear-gradient(90deg, var(--cw-text-ljus-dampad) 0 18px, transparent 18px 40px);
  }
  .remsa::before { top: 7px; }
  .remsa::after { bottom: 7px; }

  /* En bildruta: en platshållare för en stillbild ur filmen, med nummer.
     Teckningen (en kastrull med ånga) står för "här ska en bild ligga". */
  .ruta {
    position: absolute; top: 25px; width: 260px; height: 150px;
    background: var(--cw-ljus-alt); border-radius: 8px;
  }
  .ruta svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ruta .nr {
    position: absolute; left: 20px; top: 12px;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* Rutan som lyfts upp: en kopia som ligger exakt över originalet
     och sedan stiger upp och växer. Osynlig tills den lyfts. */
  .lyft { position: absolute; left: 688px; top: 765px; z-index: 5; opacity: 0; transform-origin: 50% 50%; }

  /* Texten bredvid den lyfta rutan. */
  .forklaring { position: absolute; left: 1240px; top: 400px; width: 540px; }
  .forklaring p { margin: 0 0 12px; }
  .forklaring .fokus { color: var(--cw-glod-text); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">
  <h1 class="rubrik">Find the frame that shows it</h1>

  <!-- Remsan fylls med bildrutor av skriptet nedan. -->
  <div class="remsa"></div>

  <!-- Kopian av den valda rutan (nummer 12). -->
  <div class="ruta lyft"></div>

  <div class="forklaring">
    <p class="etikett dampad">Frame 12</p>
    <p class="etikett fokus">The moment the water boils</p>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RUTORNA =====
     Fjorton rutor, 260 px breda med 24 px mellanrum. VALD är rutan som
     lyfts upp (räknat från 1). Ändrar du VALD måste .lyft flyttas också. */
  var VALD = 12, ANTAL = 14;
  var remsa = document.querySelector('.remsa');
  var teckning =
    '<svg viewBox="0 0 260 150"><rect x="80" y="80" width="100" height="50" rx="8" fill="#DDE3EA"/>' +
    '<path d="M110 70 q-8 -12 0 -24 M130 70 q-8 -12 0 -24 M150 70 q-8 -12 0 -24" stroke="#A9BBD0" stroke-width="5" fill="none" stroke-linecap="round"/></svg>';
  for (var i = 0; i < ANTAL; i++) {
    var r = document.createElement('div');
    r.className = 'ruta';
    r.style.left = (24 + i * 284) + 'px';
    r.innerHTML = teckning + '<div class="nr">' + (i + 1) + '</div>';
    remsa.appendChild(r);
  }
  // Kopian får samma teckning och nummer som originalet.
  document.querySelector('.lyft').innerHTML = teckning + '<div class="nr">' + VALD + '</div>';

  /* ===== RÖRELSEN =====
     Provtider. Vid synk lyfts rutan på ordet som pekar ut den. */
  var IN = 0.8, EASE = 'power2.out';   // tempot "Lugn"
  var original = remsa.querySelectorAll('.ruta')[VALD - 1];
  var slutX = 1540 - 4000;   // remsan stannar med högra änden vid x 1540

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Rubriken, sedan glider remsan in från höger och stannar (tyst).
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.fromTo(remsa, { x: 1920 }, { x: slutX, duration: 4.2, ease: 'power2.inOut' }, 0.3);

  // Fokus: kopian tar originalets plats och lyfts upp ur remsan,
  // remsan tonas ned. Ett klick när rutan landar.
  var tF = 5.0;
  tl.set(original, { opacity: 0 }, tF);
  tl.set('.lyft', { opacity: 1 }, tF);
  tl.to(remsa, { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.lyft', { y: -370, scale: 2.8, duration: 1.0, ease: 'power2.inOut' }, tF);
  tl.to('.lyft', { boxShadow: '0 0 0 2px #C2793A, 0 0 0 6px rgba(194,121,58,.34)', duration: 0.6 }, tF + 0.6);
  Tavla.ljud(tl, tF + 1.0, 'landa');
  tl.from('.forklaring p', { opacity: 0, y: 24, stagger: 0.18 }, tF + 1.2);

  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
