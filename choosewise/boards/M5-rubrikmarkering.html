<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M5 · Headline highlight</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Urklippet ----------
     Ett tidningsurklipp, lite snett, med en kort etikett, en rubrik på två
     rader och grå streck som brödtext. Det slutar vid x 1320 och y 940,
     så kamerazonen nere till höger är tom. */
  .urklipp {
    position: absolute; left: 240px; top: 330px; width: 1080px; height: 610px;
    padding: 64px 80px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus); border-radius: 6px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }
  .etikett-ur {
    font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett);
    letter-spacing: .06em; text-transform: uppercase; color: var(--cw-text-ljus-dampad);
  }
  /* Rubriken i kursiv antikva, som i en tidning. */
  .rubrik-ur {
    margin: 24px 0 36px;
    font-family: var(--cw-font-serif); font-style: italic; font-weight: 400;
    font-size: 120px; line-height: 1.1; letter-spacing: -0.01em;
  }
  .rad { display: block; white-space: nowrap; }
  /* Brödtexten: grå streck, den ska inte läsas. */
  .streck { height: 16px; border-radius: 8px; background: var(--cw-kant-ljus); margin-bottom: 26px; }

  /* ---------- Överstrykningen ----------
     Pennan ligger bakom nyckelorden: z-index 0 på frasen och −1 på pennan
     håller pennan inom frasen. Den dras fram från vänster. */
  .fras { position: relative; z-index: 0; }
  .penna {
    position: absolute; left: -18px; right: -18px; top: 20%; bottom: 6%; z-index: -1;
    background: var(--cw-glod-sken); border-radius: 10px 22px 12px 26px;
    transform-origin: 0 50%;
  }

  /* ---------- Tejpen ----------
     Två genomskinliga tejpbitar som håller fast urklippets övre hörn. */
  .tejp {
    position: absolute; width: 180px; height: 56px;
    background: var(--cw-serie-3); opacity: .6; border-radius: 4px;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Read past the headline</h1>
  <!-- Rubriken är påhittad. Byt mot en riktig rubrik med källa. -->
  <div class="exempel" style="left:120px; top:205px">Example headline · not a real study</div>

  <div class="urklipp">
    <div class="etikett-ur">Education</div>
    <!-- Rubriken på två rader. Nyckelorden på andra raden får överstrykningen. -->
    <h2 class="rubrik-ur">
      <span class="rad forsta">New study: AI tutor</span>
      <span class="rad"><span class="fras"><b class="penna"></b>doubles test scores</span></span>
    </h2>
    <div class="streck" style="width:100%"></div>
    <div class="streck" style="width:92%"></div>
    <div class="streck" style="width:64%"></div>
  </div>

  <!-- Tejpbitarna, snett över urklippets två övre hörn. -->
  <div class="tejp" style="left:150px; top:316px; transform: rotate(-25deg)"></div>
  <div class="tejp" style="left:1230px; top:288px; transform: rotate(25deg)"></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk drar pennan fram när Johan säger nyckelorden. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Pennan lutar en grad och börjar med bredden noll.
  gsap.set('.penna', { rotation: -1, scaleX: 0 });

  // Struktur först: rubriken och märket.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Urklippet landar: det kommer uppifrån, lite snettare, och lägger sig
  // med 1,5 graders lutning. Det rör sig inte efter att det landat.
  tl.fromTo('.urklipp', { opacity: 0, y: -50, rotation: -5 },
    { opacity: 1, y: 0, rotation: -1.5, duration: 1.0 }, 0.5);

  // Tejpbitarna trycks fast, en i taget: de börjar lite större och landar snabbt (tyst).
  gsap.utils.toArray('.tejp').forEach(function (t, i) {
    tl.fromTo(t, { opacity: 0, scale: 1.3 },
      { opacity: 0.6, scale: 1, duration: 0.35, ease: 'power3.in' }, 2.2 + i * 0.6);
  });

  // Fokus: pennan drar fram över nyckelorden, de blir koppar och resten av
  // urklippet tonas ned (tyst).
  var tF = 5.0;
  tl.to('.penna', { scaleX: 1, duration: 1.0, ease: 'power3.inOut' }, tF);
  tl.to('.fras', { color: '#9C5A24', duration: 0.6 }, tF + 0.5);
  tl.to('.etikett-ur, .forsta, .streck, .tejp', { opacity: 0.38, duration: 0.6 }, tF + 0.5);
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
