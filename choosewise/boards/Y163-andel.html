<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y163 · Share split</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Rutorna ----------
     Arbetet är tio rutor i en rad. AI fyller sin andel ruta för ruta,
     sedan tar läraren resten. Ändra fördelningen med AI_ANDEL i skriptet.
     Raden slutar vid x 1464, långt från kamerazonen. */
  .rutor { position: absolute; left: 120px; top: 330px; display: flex; gap: 16px; }
  .ruta {
    width: 120px; height: 170px; border-radius: 22px;
    border: 3px solid var(--cw-kant-ljus); background: #fff;
  }

  /* ---------- Räknarna under rutorna ----------
     Ett stort, tunt tal och en etikett under. */
  .raknare { position: absolute; top: 560px; }
  .tal { font-size: 150px; font-weight: var(--cw-vikt-tunn); line-height: 1; letter-spacing: -0.02em; }
  .raknare .etikett { margin-top: 12px; color: var(--cw-text-ljus-dampad); }
  /* Lärarens andel är fokus, så den är kopparfärgad från början. */
  .r-larare .tal, .r-larare .etikett { color: var(--cw-glod-text); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">AI drafts, the teacher decides</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- Tio tomma rutor; skriptet lägger in dem. -->
  <div class="rutor"></div>

  <!-- AI:s andel till vänster, lärarens andel under de sista rutorna. -->
  <div class="raknare r-ai" style="left:120px">
    <div class="tal"><span class="siffra">0</span>%</div>
    <div class="etikett">AI writes the draft</div>
  </div>
  <div class="raknare r-larare" style="left:1072px">
    <div class="tal">30%</div>
    <div class="etikett">Teacher checks</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk fylls AI:s rutor medan Johan pratar om utkastet,
     och lärarens del landar när han säger "the teacher". */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var AI_ANDEL = 7;  // hur många av de tio rutorna AI fyller

  // Lägg in tio rutor.
  var rad = document.querySelector('.rutor');
  for (var i = 0; i < 10; i++) rad.appendChild(document.createElement('div')).className = 'ruta';
  var rutor = gsap.utils.toArray('.ruta');
  var aiRutor = rutor.slice(0, AI_ANDEL), lararRutor = rutor.slice(AI_ANDEL);

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken, märket och de tomma rutorna.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from(rutor, { opacity: 0, y: 20, stagger: 0.06 }, 0.4);

  // AI fyller sina rutor en i taget och räknaren hoppar tio procent för
  // varje ny ruta, så att talet alltid stämmer med rutorna.
  var tAI = 2.0, perRuta = 0.45;
  tl.from('.r-ai', { opacity: 0, y: 16, duration: 0.5 }, tAI - 0.3);
  aiRutor.forEach(function (r, i) {
    tl.to(r, { backgroundColor: '#0B3A6F', borderColor: '#0B3A6F', duration: 0.35 }, tAI + i * perRuta);
  });
  var tal = { v: 0 };
  tl.to(tal, { v: AI_ANDEL, duration: AI_ANDEL * perRuta, ease: 'none',
    onUpdate: function () {
      var fyllda = tal.v === 0 ? 0 : Math.min(AI_ANDEL, Math.ceil(tal.v));
      document.querySelector('.r-ai .siffra').textContent = fyllda * 10;
    } }, tAI);

  // Fokus: lärarens rutor fylls i koppar och "30%" landar. AI:s del tonas
  // ned. Ett klick när talet landar.
  var tF = tAI + AI_ANDEL * perRuta + 1.0;
  tl.to(aiRutor.concat(document.querySelector('.r-ai')), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(lararRutor, { backgroundColor: '#C2793A', borderColor: '#C2793A',
    boxShadow: '0 0 0 10px rgba(194,121,58,.34)', stagger: STEG, duration: 0.5 }, tF);
  tl.from('.r-larare', { opacity: 0, y: 16, duration: 0.6 }, tF + 0.4);
  Tavla.ljud(tl, tF + 0.5, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
