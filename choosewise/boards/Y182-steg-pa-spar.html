<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y182 · Steps on a track</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Hela processen som stationer på ett spår ----------
     Fem stationer på en linje. Djupblå station = en människa gör steget,
     gråblå = AI gör steget. En mörk spärr på spåret betyder att en
     människa granskar innan det går vidare. En kopparprick åker längs
     spåret och tänder stationen den når. Allt ligger ovanför y 720
     (utom förklaringen nere till vänster), så kamerazonen hålls tom. */
  .spar {
    position: absolute; left: 240px; top: 487px; width: 1460px; height: 6px;
    background: var(--cw-kant-ljus); border-radius: 3px; transform-origin: 0 50%;
  }

  /* En station: en rund skiva med numret, namnet och vem som gör steget under. */
  .station { position: absolute; top: 490px; width: 0; height: 0; }
  .skiva {
    position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px; font-weight: var(--cw-vikt-display);
  }
  .manniska .skiva { background: var(--cw-accent); color: #FFFFFF; }
  .ai .skiva { background: var(--cw-serie-3); color: var(--cw-text-ljus); }
  .station .namn, .station .vem {
    position: absolute; left: -180px; width: 360px; text-align: center; white-space: nowrap;
    font-size: var(--cw-min-etikett);
  }
  .station .namn { top: 84px; font-weight: var(--cw-vikt-stark); }
  .station .vem { top: 138px; color: var(--cw-text-ljus-dampad); }

  /* Spärren: en människa granskar AI:ns arbete innan nästa steg. */
  .sparr { position: absolute; left: 1148px; top: 446px; width: 10px; height: 88px; border-radius: 5px; background: var(--cw-text-ljus); }
  .sparr-text { position: absolute; left: 953px; top: 340px; width: 400px; text-align: center; font-size: var(--cw-min-etikett); }

  /* Kopparpricken som åker längs spåret. */
  .prick {
    position: absolute; left: 0; top: 490px; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; background: var(--cw-glod); box-shadow: 0 0 0 10px var(--cw-glod-sken);
  }

  /* Förklaringen: vad färgerna betyder. */
  .forklaring { position: absolute; left: 120px; top: 800px; display: flex; gap: 64px; font-size: var(--cw-min-etikett); }
  .forklaring span { display: flex; align-items: center; gap: 18px; }
  .forklaring i { width: 36px; height: 36px; border-radius: 50%; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">A writing task in five steps</h1>

  <div class="spar"></div>
  <!-- Pricken ligger före stationerna i koden, så att skivorna täcker den när den stannar. -->
  <div class="prick"></div>

  <!-- Stationerna. Klassen "manniska" eller "ai" styr färgen;
       style="left:..." är platsen på spåret. -->
  <div class="station manniska" style="left:240px"><div class="skiva">1</div><div class="namn">Set the task</div><div class="vem">teacher</div></div>
  <div class="station manniska" style="left:605px"><div class="skiva">2</div><div class="namn">Write a draft</div><div class="vem">student</div></div>
  <div class="station ai" style="left:970px"><div class="skiva">3</div><div class="namn">Feedback</div><div class="vem">AI</div></div>
  <div class="station manniska" style="left:1335px"><div class="skiva">4</div><div class="namn">Revise</div><div class="vem">student</div></div>
  <div class="station manniska" style="left:1700px"><div class="skiva">5</div><div class="namn">Assess</div><div class="vem">teacher</div></div>

  <!-- Spärren mellan steg 3 och 4. -->
  <div class="sparr"></div>
  <div class="sparr-text">✓ student checks</div>

  <div class="forklaring">
    <span><i style="background:var(--cw-accent)"></i>person</span>
    <span><i style="background:var(--cw-serie-3)"></i>AI</span>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk når pricken varje station när Johan nämner steget. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var stationer = gsap.utils.toArray('.station');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, spår, stationer, spärr och förklaring (tyst).
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.spar', { scaleX: 0, duration: 1.2, ease: 'power2.inOut' }, 0.2);
  tl.from(stationer, { opacity: 0, y: 24, stagger: STEG }, 0.6);
  tl.from('.sparr, .sparr-text, .forklaring', { opacity: 0, stagger: STEG }, 1.4);

  // Tänd och släck en station: kopparring runt skivan och namnet i koppar.
  function tand(s, t) {
    tl.to(s.querySelector('.skiva'), { boxShadow: '0 0 0 14px rgba(194,121,58,.34)', duration: 0.5 }, t);
    tl.to(s.querySelector('.namn'), { color: '#9C5A24', duration: 0.5 }, t);
  }
  function slack(s, t) {
    tl.to(s.querySelector('.skiva'), { boxShadow: '0 0 0 0px rgba(194,121,58,0)', duration: 0.5 }, t);
    tl.to(s.querySelector('.namn'), { color: '#0C1A2E', duration: 0.5 }, t);
  }

  // Pricken börjar vid första stationen och åker sedan station för station.
  gsap.set('.prick', { x: 240 });
  tl.from('.prick', { opacity: 0, scale: 0.4, duration: 0.5 }, 2.4);
  tand(stationer[0], 2.4);
  var tid = 3.8;
  for (var i = 1; i < stationer.length; i++) {
    tl.to('.prick', { x: parseFloat(stationer[i].style.left), duration: 1.0, ease: 'power2.inOut' }, tid);
    slack(stationer[i - 1], tid);
    tand(stationer[i], tid + 0.8);
    tid += 2.0;
  }

  // Fokus landar på sista stationen: läraren bedömer. Ett klick.
  Tavla.ljud(tl, tid - 2.0 + 0.9, 'landa');
  tl.to({}, { duration: 2 }, tid);  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
