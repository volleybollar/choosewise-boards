<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y175 · From student text to assessment</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kedjan: elevtext → AI-feedback → lärarens bedömning ----------
     Tre stationer i rad med pilar emellan. Ett "dokument" åker från
     station till station. Under kedjan visar två staplar på samma skala
     hur lång tid varje del tar. Stationerna ligger ovanför y 720 och
     staplarna till vänster om x 1570, så kamerazonen hålls tom. */
  .station {
    position: absolute; top: 310px; width: 440px; height: 250px; padding: 34px 36px;
    background: #FFFFFF; border: 4px solid var(--cw-kant-ljus); border-radius: var(--cw-radie-kort);
    box-shadow: 0 16px 40px rgba(11, 58, 111, .10);
  }
  .station .namn { font-size: 48px; font-weight: var(--cw-vikt-stark); line-height: 1.15; }
  .station .vad { margin-top: 18px; font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad); }

  /* Pilarna mellan stationerna. */
  .pil { position: absolute; top: 432px; width: 70px; height: 6px; background: var(--cw-text-ljus-dampad); border-radius: 3px; transform-origin: 0 50%; }
  .pil::after {
    content: ''; position: absolute; right: -4px; top: -9px;
    border-left: 20px solid var(--cw-text-ljus-dampad); border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  }

  /* Dokumentet som åker längs kedjan: ett litet ark med tre rader. */
  .dokument {
    position: absolute; left: 0; top: 0; width: 56px; height: 72px; margin: -36px 0 0 -28px;
    background: #FFFFFF; border: 4px solid var(--cw-accent); border-radius: 8px;
  }
  .dokument i { display: block; height: 5px; margin: 10px 8px 0; border-radius: 3px; background: var(--cw-accent); }

  /* Tidsstaplarna: namn till vänster, stapel, värde efter stapeln. */
  .tid { position: absolute; left: 120px; height: 80px; width: 1440px; }
  .tid .etikett { position: absolute; left: 0; top: 14px; width: 400px; }
  .tid .stapel {
    position: absolute; left: 420px; top: 10px; height: 60px; border-radius: 12px;
    background: var(--cw-serie-2); transform-origin: 0 50%;
  }
  .tid .varde { position: absolute; top: 14px; width: auto; font-weight: var(--cw-vikt-stark); white-space: nowrap; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Student text in, assessment out</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <!-- De tre stationerna. Byt namn och rad här. -->
  <div class="station" style="left:120px"><div class="namn">Student text</div><div class="vad">essay.docx</div></div>
  <div class="pil" style="left:580px"></div>
  <div class="station" style="left:680px"><div class="namn">AI feedback</div><div class="vad">3 comments</div></div>
  <div class="pil" style="left:1140px"></div>
  <div class="station" style="left:1240px"><div class="namn">Teacher</div><div class="vad">assessment</div></div>

  <div class="dokument"><i></i><i></i><i></i></div>

  <!-- Tidsstaplarna. data-min är minuter; längden räknas fram nedan. -->
  <div class="tid" data-min="1" style="top:700px"><div class="etikett">AI feedback</div><div class="stapel"></div><div class="varde etikett">1 min</div></div>
  <div class="tid" data-min="10" style="top:820px"><div class="etikett">Teacher reading</div><div class="stapel"></div><div class="varde etikett">10 min</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== FÖRBEREDELSER: staplarnas längd ===== */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var stationer = gsap.utils.toArray('.station');
  var tider = gsap.utils.toArray('.tid');
  // Samma skala för båda: 10 minuter blir 760 px.
  tider.forEach(function (t) {
    var b = 760 * t.dataset.min / 10;
    t.querySelector('.stapel').style.width = b + 'px';
    t.querySelector('.varde').style.left = (420 + b + 24) + 'px';
  });

  /* ===== RÖRELSEN =====
     Provtider. Vid synk åker dokumentet vidare när Johan nämner nästa steg. */
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märke, stationer och pilar (tyst).
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from(stationer, { opacity: 0, y: 30, stagger: STEG }, 0.4);
  tl.from('.pil', { scaleX: 0, stagger: STEG }, 0.9);

  // Dokumentet: dyker upp i första stationen och åker sedan vidare.
  // Mittpunkterna ligger i stationernas nederkant, under texten.
  var Y = 510, mitt = [340, 900, 1460];
  gsap.set('.dokument', { x: mitt[0] + 140, y: Y });
  tl.from('.dokument', { opacity: 0, scale: 0.6, duration: 0.5 }, 1.8);
  tl.to('.dokument', { x: mitt[1] + 140, duration: 1.2, ease: 'power2.inOut' }, 2.8);
  tl.to('.dokument', { x: mitt[2] + 140, duration: 1.2, ease: 'power2.inOut' }, 4.6);

  // Tidsstaplarna växer en i taget, på samma skala (tyst).
  tider.forEach(function (t, i) {
    var s = 6.4 + i * 1.2;
    tl.from(t.querySelector('.etikett'), { opacity: 0, y: 16, duration: 0.5 }, s);
    tl.from(t.querySelector('.stapel'), { scaleX: 0, duration: 0.9 }, s + 0.2);
    tl.from(t.querySelector('.varde'), { opacity: 0, duration: 0.5 }, s + 0.8);
  });

  // Fokus: lärarens station och lärarens tid blir koppar, resten tonas ned.
  // Poängen: bedömningen är fortfarande lärarens. Ett klick.
  var tF = 9.4;
  tl.to([stationer[0], stationer[1], '.pil', tider[0]], { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(stationer[2], { borderColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(stationer[2].querySelector('.namn'), { color: '#9C5A24', duration: 0.6 }, tF);
  tl.to(tider[1].querySelector('.stapel'), { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  tl.to(tider[1].querySelectorAll('.etikett'), { color: '#9C5A24', duration: 0.6 }, tF);
  tl.to('.dokument', { borderColor: '#C2793A', duration: 0.6 }, tF);
  tl.to('.dokument i', { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
