<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S107 · An AI assistant works through a task</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Sessionskortet ----------
     Ett kort som visar en AI-assistent i arbete: uppgiften överst, stegen
     under. Kortet slutar vid x 1440 och y 940, så att kamerazonen nere till
     höger alltid är tom. */
  .kort {
    position: absolute; left: 140px; top: 140px; width: 1300px; height: 800px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort); padding: 56px 64px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }

  /* Kortets huvud: en rund symbol för assistenten, namnet och status. */
  .huvud { position: relative; display: flex; align-items: center; gap: 28px; height: 64px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--cw-accent); }
  .huvud .namn { font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); }
  /* Två statustexter på samma plats: "Working" byts mot "Done" genom att
     den ena tonas ut och den andra in. */
  .status { position: absolute; right: 0; top: 8px; font-size: var(--cw-min-etikett); }
  .status.arbetar { color: var(--cw-text-ljus-dampad); }
  .status.klar { color: var(--cw-glod-text); opacity: 0; }

  /* Uppgiften. */
  .uppgift { margin-top: 56px; }
  .uppgift p { margin: 0; }
  .uppgift .text { font-size: 60px; font-weight: var(--cw-vikt-display); margin-top: 8px; }
  .linje { height: 2px; background: var(--cw-kant-ljus); margin: 44px 0 40px; transform-origin: 0 50%; }

  /* Ett steg: en ring som fylls och får en bock, och en kort text.
     Stegen är dämpade tills assistenten har gjort dem. */
  .steg { display: flex; align-items: center; gap: 32px; height: 84px; }
  .ring {
    flex: 0 0 52px; height: 52px; border-radius: 50%;
    border: 4px solid var(--cw-kant-ljus); background: transparent;
  }
  .ring svg { display: block; }
  .steg .etikett { color: var(--cw-text-ljus-dampad); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">
  <div class="kort">
    <div class="huvud">
      <div class="avatar"></div>
      <div class="namn">AI assistant</div>
      <div class="status arbetar">Working</div>
      <div class="status klar">Done · review it before class</div>
    </div>

    <div class="uppgift">
      <p class="etikett dampad">Task</p>
      <p class="text">Make a quiz from chapter 4</p>
    </div>
    <div class="linje"></div>

    <!-- Stegen. Bocken i varje ring ritas fram när steget är klart. -->
    <div class="steg"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M12 23 L19 30 L32 15" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="etikett">Read chapter 4</span></div>
    <div class="steg"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M12 23 L19 30 L32 15" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="etikett">Find the key ideas</span></div>
    <div class="steg"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M12 23 L19 30 L32 15" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="etikett">Write ten questions</span></div>
    <div class="steg"><div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M12 23 L19 30 L32 15" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="etikett">Add an answer key</span></div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk bockas varje steg av när Johan nämner det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var steg = gsap.utils.toArray('.steg');

  // Bockarna gömda till att börja med: hela strecket "förskjutet" bort.
  gsap.set('.ring path', { strokeDasharray: 40, strokeDashoffset: 40 });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: kortet, huvudet och uppgiften, sedan planen (alla steg dämpade).
  tl.from('.kort', { opacity: 0, y: 40 }, 0);
  tl.from('.huvud, .uppgift', { opacity: 0, y: 20, stagger: STEG }, 0.4);
  tl.from('.linje', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.8);
  tl.from(steg, { opacity: 0, y: 16, stagger: STEG }, 1.2);

  // Assistenten gör stegen ett i taget: ringen fylls blå, bocken ritas
  // och texten blir mörk (tyst).
  steg.forEach(function (s, i) {
    var t = 2.8 + i * 1.3;
    tl.to(s.querySelector('.ring'), { backgroundColor: '#0B3A6F', borderColor: '#0B3A6F', duration: 0.5 }, t);
    tl.to(s.querySelector('.ring path'), { strokeDashoffset: 0, duration: 0.5 }, t + 0.3);
    tl.to(s.querySelector('.etikett'), { color: '#0C1A2E', duration: 0.5 }, t);
  });

  // Fokus: "Working" byts mot "Done" i koppar. Ett klick när det landar.
  var tF = 2.8 + steg.length * 1.3 + 0.4;
  tl.to('.status.arbetar', { opacity: 0, duration: 0.4 }, tF);
  tl.fromTo('.status.klar', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6 }, tF + 0.2);
  Tavla.ljud(tl, tF + 0.5, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
