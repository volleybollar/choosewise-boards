<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D43 · Bar chart</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Diagrammet ----------
     Baslinjen ligger på y 860. Staplarna växer uppåt från den.
     Allt håller sig till vänster om x 1440, långt från kamerazonen. */
  .baslinje {
    position: absolute; left: 140px; top: 860px; width: 1300px; height: 3px;
    background: var(--cw-text-ljus); transform-origin: 0 50%;
  }
  .stapel { position: absolute; width: 180px; bottom: 220px; }   /* 1080 − 860 = 220 */
  .stapel .fyll {
    position: absolute; left: 0; bottom: 0; width: 100%;
    background: var(--cw-accent); border-radius: 18px 18px 0 0; transform-origin: 50% 100%;
  }
  /* Värdet ovanför stapeln och namnet under baslinjen. */
  .stapel .varde {
    position: absolute; left: 0; width: 100%; text-align: center;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark);
  }
  .stapel .namn {
    position: absolute; left: -30px; width: 240px; bottom: -74px; text-align: center;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Where a teacher’s week goes</h1>
  <!-- Byts mot riktiga siffror med källa innan boarden används. -->
  <div class="exempel" style="left:120px; top:205px">Example data · replace with real numbers and source</div>

  <div class="baslinje"></div>
  <!-- Staplarna. data-timmar är värdet; höjden räknas fram nedan. -->
  <div class="stapel" data-timmar="18" style="left:160px"><div class="fyll"></div><div class="varde">18 h</div><div class="namn">Teaching</div></div>
  <div class="stapel" data-timmar="9"  style="left:420px"><div class="fyll"></div><div class="varde">9 h</div><div class="namn">Planning</div></div>
  <div class="stapel" data-timmar="7"  style="left:680px"><div class="fyll"></div><div class="varde">7 h</div><div class="namn">Marking</div></div>
  <div class="stapel" data-timmar="5"  style="left:940px"><div class="fyll"></div><div class="varde">5 h</div><div class="namn">Admin</div></div>
  <div class="stapel" data-timmar="3"  style="left:1200px"><div class="fyll"></div><div class="varde">3 h</div><div class="namn">Meetings</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk växer varje stapel på ordet som namnger den. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';
  var staplar = gsap.utils.toArray('.stapel');

  // Höjd: den högsta stapeln blir 480 px, de andra i proportion.
  var max = Math.max.apply(null, staplar.map(function (s) { return +s.dataset.timmar; }));
  staplar.forEach(function (s) {
    var h = 480 * s.dataset.timmar / max;
    s.style.height = h + 'px';
    s.querySelector('.fyll').style.height = h + 'px';
    s.querySelector('.varde').style.bottom = (h + 16) + 'px';
  });

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, märket, baslinjen och namnen syns när boarden öppnar.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);
  tl.from('.baslinje', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.2);
  tl.from('.namn', { opacity: 0, y: 16, stagger: 0.08 }, 0.6);

  // Staplarna växer en i taget, värdet kommer strax efter (tyst: framväxt).
  staplar.forEach(function (s, i) {
    var t = 1.8 + i * 1.1;
    tl.from(s.querySelector('.fyll'), { scaleY: 0, duration: 0.9 }, t);
    tl.from(s.querySelector('.varde'), { opacity: 0, y: 16, duration: 0.5 }, t + 0.5);
  });

  // Fokus: "Marking" blir koppar, de andra tonas ned. Ett klick när fokus landar.
  var fokus = staplar[2];
  var tF = 1.8 + staplar.length * 1.1 + 0.8;
  tl.to(staplar.filter(function (s) { return s !== fokus; }), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(fokus.querySelector('.fyll'), { backgroundColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(fokus.querySelectorAll('.varde, .namn'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
