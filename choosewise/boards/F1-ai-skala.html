<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F1 · AI use scale</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Skalan ----------
     Fem nivåer i en rad, från "No AI" till vänster till "Full AI" till
     höger. Raden går från x 120 till x 1500, så att kamerazonen nere till
     höger alltid är tom. Varje nivå är 260 px bred med 20 px mellanrum. */
  .niva { position: absolute; top: 300px; width: 260px; }
  /* Nivåns nummer, stort och tunt, ovanför rutan. */
  .nr {
    font-size: var(--cw-min-siffra); font-weight: var(--cw-vikt-tunn);
    line-height: 1; margin-bottom: 24px; color: var(--cw-text-ljus-dampad);
  }
  /* Rutan börjar ljusgrå (släckt) och "tänds" i djupblått av rörelsen. */
  .ruta {
    height: 180px; border-radius: var(--cw-radie-media);
    background: var(--cw-ljus-alt); color: var(--cw-text-ljus);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: var(--cw-min-etikett); line-height: 1.15; padding: 0 16px;
  }

  /* ---------- Markören ----------
     En kopparpil under skalan som visar hur långt en viss uppgift får gå.
     Den glider in från vänster och stannar under nivå 3. */
  .markor { position: absolute; left: 0; top: 660px; width: 520px; }
  .pil {
    width: 0; height: 0; margin-left: 236px;
    border-left: 24px solid transparent; border-right: 24px solid transparent;
    border-bottom: 36px solid var(--cw-glod);
  }
  .markor .etikett { margin-top: 20px; text-align: center; color: var(--cw-glod-text); font-weight: var(--cw-vikt-stark); }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">How much AI is allowed?</h1>

  <!-- De fem nivåerna. Byt orden om skolan använder en annan skala. -->
  <div class="niva" style="left:120px"><div class="nr">1</div><div class="ruta">No AI</div></div>
  <div class="niva" style="left:400px"><div class="nr">2</div><div class="ruta">Ideas only</div></div>
  <div class="niva" style="left:680px"><div class="nr">3</div><div class="ruta">Feedback</div></div>
  <div class="niva" style="left:960px"><div class="nr">4</div><div class="ruta">Co-writing</div></div>
  <div class="niva" style="left:1240px"><div class="nr">5</div><div class="ruta">Full AI</div></div>

  <!-- Markören: uppgiften i exemplet får använda AI upp till nivå 3. -->
  <div class="markor"><div class="pil"></div><div class="etikett">This essay: up to here</div></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk tänds varje nivå när Johan nämner den. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var nivaer = gsap.utils.toArray('.niva');

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och de släckta rutorna finns när boarden öppnar.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from(nivaer, { opacity: 0, y: 24, stagger: STEG }, 0.3);

  // Nivåerna tänds en i taget: rutan blir djupblå med vit text.
  nivaer.forEach(function (n, i) {
    var t = 1.8 + i * 0.9;
    tl.to(n.querySelector('.ruta'), { backgroundColor: '#0B3A6F', color: '#FFFFFF', duration: 0.6 }, t);
    tl.to(n.querySelector('.nr'), { color: '#0C1A2E', duration: 0.6 }, t);
  });

  // Markören glider in och stannar under nivå 3 (x 680, mitt under rutan).
  var tM = 1.8 + nivaer.length * 0.9 + 0.6;
  tl.fromTo('.markor', { x: 0, opacity: 0 }, { x: 550, opacity: 1, duration: 1.4, ease: 'power2.inOut' }, tM);

  // Fokus: nivå 3 blir koppar, nivå 4 och 5 (inte tillåtna) tonas ned.
  var tF = tM + 1.4;
  tl.to(nivaer.slice(3), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(nivaer[2].querySelector('.ruta'), { backgroundColor: '#C2793A', boxShadow: '0 0 0 12px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.to(nivaer[2].querySelector('.nr'), { color: '#9C5A24', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');
  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
