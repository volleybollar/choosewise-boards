<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F5 · Key term card</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Kortet ----------
     Ett stort vitt kort med ordet, en förklaring och ett vardagsexempel.
     Det går från x 120 till x 1500 och slutar vid y 920, så att
     kamerazonen nere till höger alltid är tom. */
  .kort {
    position: absolute; left: 120px; top: 160px; width: 1380px; height: 760px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-kort); padding: 80px 100px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .10);
  }
  /* Små dämpade rubriker ovanför varje del ("Key term", "Everyday example"). */
  .typ { color: var(--cw-text-ljus-dampad); margin-bottom: 12px; }
  /* Själva ordet: stort och tunt. */
  .ord { font-size: 150px; font-weight: var(--cw-vikt-tunn); line-height: 1; letter-spacing: -0.02em; margin-bottom: 40px; }
  /* Förklaringen. Delen i fokus får ett kopparstreck som ritas fram. */
  .forklaring { font-size: 56px; font-weight: var(--cw-vikt-display); line-height: 1.25; }
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: -4px; height: 6px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }
  /* En tunn linje skiljer förklaringen från exemplet. */
  .linje { height: 3px; background: var(--cw-kant-ljus); margin: 64px 0 56px; transform-origin: 0 50%; }
  .exempeltext { font-size: 48px; line-height: 1.3; }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen) =====
     Byt ordet, förklaringen och exemplet för ett annat begrepp, till
     exempel "Token" eller "Context window". Håll meningarna korta. -->
<div class="cw ljus">
  <div class="kort">
    <div class="typ etikett">Key term</div>
    <div class="ord">Hallucination</div>
    <div class="forklaring">An AI answer that <span class="nyckel">sounds right but is false<b class="streck"></b></span>.</div>
    <div class="linje"></div>
    <div class="typ etikett">Everyday example</div>
    <div class="exempeltext">A student bluffing with total confidence.</div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk kommer förklaringen och exemplet när Johan säger dem. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: kortet finns när boarden öppnar.
  tl.from('.kort', { opacity: 0, y: 40 }, 0);

  // Ordet landar, sedan förklaringen (tyst: framväxt).
  var typer = document.querySelectorAll('.typ');
  tl.from(typer[0], { opacity: 0, y: 16 }, 0.8);
  tl.from('.ord', { opacity: 0, y: 30, duration: 1.0 }, 1.0);
  tl.from('.forklaring', { opacity: 0, y: 24 }, 2.6);

  // Fokus: strecket under "sounds right but is false" ritas i koppar.
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, 4.2);
  tl.to('.nyckel', { color: '#9C5A24', duration: 0.6 }, 4.2);

  // Linjen ritas och vardagsexemplet kommer.
  tl.from('.linje', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 6.0);
  tl.from(typer[1], { opacity: 0, y: 16 }, 6.6);
  tl.from('.exempeltext', { opacity: 0, y: 24 }, 6.6 + STEG);

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
