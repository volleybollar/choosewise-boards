<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D54 · Terminal</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Terminalfönstret ----------
     En mörk panel på den ljusa scenen. Den slutar vid x 1460 och y 810,
     så att kamerazonen nere till höger alltid är tom. */
  .terminal {
    position: absolute; left: 120px; top: 250px; width: 1340px; height: 560px;
    background: var(--cw-yta-mork); color: var(--cw-text-mork);
    border-radius: var(--cw-radie-media); overflow: hidden;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .18);
    font-family: var(--cw-font-mono); font-size: var(--cw-min-etikett); line-height: 1.6;
  }
  /* Fönstrets list: tre grå prickar. */
  .list { height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 30px; border-bottom: 2px solid var(--cw-kant-mork); }
  .list i { width: 18px; height: 18px; border-radius: 50%; background: var(--cw-text-mork-dampad); opacity: .5; }
  .rader { padding: 34px 48px; }
  .rad { white-space: pre; }

  /* Sökvägen och dollartecknet är dämpade, så att kommandot syns mest. */
  .sokvag, .dollar { color: var(--cw-text-mork-dampad); }

  /* Ordet som söks. Strecket under ritas fram när fokus landar. */
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: 2px; height: 5px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }

  /* Markören: ett stilla block (den blinkar inte, ingenting rör sig efter
     att det har landat). */
  .markor {
    display: inline-block; width: 24px; height: 52px; vertical-align: -10px;
    background: var(--cw-text-mork); margin-left: 4px;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Which lessons have a quiz?</h1>

  <div class="terminal">
    <div class="list"><i></i><i></i><i></i></div>
    <div class="rader">
      <!-- Kommandot. Det är delat i tre delar så att ordet "quiz" kan markeras. -->
      <div class="rad"><span class="sokvag">~/lessons</span> <span class="dollar">$</span> <span class="del">grep -l </span><span class="del nyckel">quiz<b class="streck"></b></span><span class="del"> week-44/*.md</span><i class="markor m1"></i></div>

      <!-- Svaret: filerna där ordet finns, en per rad. Filnamnen är exempel. -->
      <div class="rad svar">week-44/monday-fractions.md</div>
      <div class="rad svar">week-44/wednesday-plants.md</div>
      <div class="rad svar">week-44/friday-poetry.md</div>

      <!-- En ny tom prompt när kommandot är klart. -->
      <div class="rad ny"><span class="sokvag">~/lessons</span> <span class="dollar">$</span> <i class="markor"></i></div>
    </div>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk skrivs kommandot när Johan säger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';

  // Spara texten i varje del av kommandot och töm dem: kommandot skrivs
  // fram tecken för tecken (samma teknik som i N5).
  var delar = gsap.utils.toArray('.del');
  var texter = delar.map(function (d) { return d.firstChild.textContent; });
  var totalt = texter.join('').length;
  function visa(n) {
    texter.forEach(function (t, i) {
      delar[i].firstChild.textContent = t.slice(0, Math.max(0, Math.min(t.length, n)));
      n -= t.length;
    });
  }
  visa(0);

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubriken och terminalen med den tomma prompten.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.terminal', { opacity: 0, y: 40 }, 0.2);

  // Kommandot skrivs fram, ungefär 18 tecken i sekunden (tyst).
  var skrivStart = 1.4, skrivTid = totalt / 18;
  var raknare = { n: 0 };
  tl.to(raknare, { n: totalt, duration: skrivTid, ease: 'none',
    onUpdate: function () { visa(Math.round(raknare.n)); } }, skrivStart);

  // Kommandot körs: markören försvinner och svaret kommer rad för rad.
  var tSvar = skrivStart + skrivTid + 0.6;
  tl.to('.m1', { opacity: 0, duration: 0.1 }, tSvar);
  tl.from('.svar', { opacity: 0, y: 16, stagger: 0.5, duration: 0.5 }, tSvar + 0.2);
  tl.from('.ny', { opacity: 0, duration: 0.3 }, tSvar + 1.9);

  // Fokus: strecket under "quiz" ritas fram i koppar och ordet blir koppar.
  // Det är ordet som avgör vilka filer som visas. Fokuskonturen är tyst.
  var tF = tSvar + 2.8;
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.nyckel', { color: '#C2793A', duration: 0.6 }, tF);
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
