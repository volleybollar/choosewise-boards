<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S260 · Frosted glass caption over an image</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Bilden ----------
     En stor platshållare där en riktig bild ska ligga. Den slutar vid
     x 1500, så att kamerazonen nere till höger alltid är tom. */
  .bild {
    position: absolute; left: 120px; top: 90px; width: 1380px; height: 900px;
    background: var(--cw-ljus-alt); border-radius: var(--cw-radie-media); overflow: hidden;
  }
  /* Teckningen (kullar, en flod och en sol) står för "här ska en bild ligga".
     Den behövs också för att glaset ska ha något att göra suddigt. */
  .bild svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .bild .platshallare {
    position: absolute; left: 48px; top: 36px;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }

  /* ---------- Glaskortet ----------
     Choosewise glaskort ur grafikramverket: halvgenomskinlig blå fyllning,
     en ljus kant och suddig bild bakom (backdrop-filter). */
  .glas {
    position: absolute; left: 200px; top: 660px; width: 1180px; height: 250px;
    padding: 44px 56px; border-radius: var(--cw-radie-kort);
    background: rgba(11, 50, 98, .88);
    border: 2px solid rgba(232, 201, 168, .55);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    color: var(--cw-text-mork);
  }
  .glas p { margin: 0; }
  .glas .overst { color: var(--cw-text-mork-dampad); margin-bottom: 18px; }
  .glas .fraga { font-size: 60px; font-weight: var(--cw-vikt-display); line-height: 1.15; }

  /* Ordet i fokus. Strecket under ritas fram i koppar. */
  .nyckel { position: relative; }
  .nyckel .streck {
    position: absolute; left: 0; right: 0; bottom: -4px; height: 5px; border-radius: 3px;
    background: var(--cw-glod); transform-origin: 0 50%; transform: scaleX(0);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <!-- Bilden: byt platshållaren mot en riktig bild. -->
  <div class="bild">
    <svg viewBox="0 0 1380 900" preserveAspectRatio="xMidYMid slice">
      <circle cx="1080" cy="230" r="90" fill="#A9BBD0"/>
      <path d="M0 900 L0 520 Q260 360 560 500 Q860 380 1380 520 L1380 900 Z" fill="#DDE3EA"/>
      <path d="M380 900 Q560 700 700 600 Q820 520 1000 500" stroke="#A9BBD0" stroke-width="40" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="platshallare">Image placeholder</div>
  </div>

  <!-- Glaskortet med bildtexten: en rad ovanför och själva frågan. -->
  <div class="glas">
    <p class="etikett overst">Year 6 · Discussion</p>
    <p class="fraga">What changed when the river <span class="nyckel">froze?<b class="streck"></b></span></p>
  </div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk glider kortet in när Johan börjar läsa frågan. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"

  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: bilden finns när boarden öppnar och tonas fram (tyst).
  tl.from('.bild', { opacity: 0, duration: 1.0 }, 0);

  // Glaskortet glider in underifrån, sedan raderna i det en i taget (tyst).
  tl.from('.glas', { opacity: 0, y: 80, duration: 1.0 }, 1.4);
  tl.from('.glas p', { opacity: 0, y: 20, stagger: STEG }, 2.0);

  // Fokus: strecket under "froze?" ritas i koppar och ordet blir kopparfärgat.
  // Ett klick när fokus landar.
  var tF = 5.0;
  tl.to('.nyckel .streck', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.nyckel', { color: '#C2793A', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.6, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
