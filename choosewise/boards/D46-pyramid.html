<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D46 · Pyramid</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Pyramiden ----------
     Fyra lager staplade på varandra, basen längst ned vid y 960.
     Varje lager är en rektangel som klipps till ett trapets med
     clip-path; skriptet räknar fram läge och sneda kanter.
     Pyramiden slutar vid x 1400, långt från kamerazonen. */
  .lager {
    position: absolute; height: 140px;
    background: var(--cw-accent); color: var(--cw-ljus);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-text);
    will-change: opacity;   /* eget lager: annars kan nedtoningen ge en ljusare rand i bilden */
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">What real learning stands on</h1>

  <!-- Lagren, från basen och uppåt. Byt texten för att byta innehåll. -->
  <div class="lager">Clear, safe rules</div>
  <div class="lager">Confident teachers</div>
  <div class="lager">Well-designed tasks</div>
  <div class="lager">Real learning</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== FORMEN =====
     Basen är 1240 px bred, toppen 280 px. Kanterna lutar jämnt hela
     vägen upp, så lagren bildar en hel pyramid med små glipor emellan. */
  var VANSTER = 160, BAS = 1240, TOPP = 280, BOTTEN = 960, HOJD = 140, GLIPA = 14;
  var lager = gsap.utils.toArray('.lager');
  var total = lager.length * HOJD + (lager.length - 1) * GLIPA;
  var lutning = (BAS - TOPP) / 2 / total;   // hur mycket kanten flyttas in per pixel uppåt

  lager.forEach(function (el, i) {
    var underkant = BOTTEN - i * (HOJD + GLIPA);
    var inUnder = (BOTTEN - underkant) * lutning;       // indrag vid lagrets underkant
    var bredd = BAS - 2 * inUnder;
    el.style.left = (VANSTER + inUnder) + 'px';
    el.style.top = (underkant - HOJD) + 'px';
    el.style.width = bredd + 'px';
    var d = HOJD * lutning;                             // hur mycket smalare överkanten är per sida
    el.style.clipPath = 'polygon(' + d + 'px 0, ' + (bredd - d) + 'px 0, 100% 100%, 0 100%)';
  });

  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar varje lager på ordet som namnger det. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);

  // Basen kommer först, sedan landar varje lager ovanpå (tyst: framväxt).
  lager.forEach(function (el, i) {
    tl.from(el, { opacity: 0, y: -50 }, 1.0 + i * 1.2);
  });

  // Fokus: toppen blir koppar, lagren under tonas ned. Ett klick.
  var topp = lager[lager.length - 1];
  var tF = 1.0 + lager.length * 1.2 + 0.6;
  tl.to(lager.slice(0, -1), { opacity: 0.38, duration: 0.6 }, tF);
  tl.to(topp, { backgroundColor: '#C2793A', duration: 0.6 }, tF);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
