<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D51 · 2×2 matrix</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Matrisen ----------
     Axlarna korsar varandra i x 820, y 630. Vågrätt: hur mycket tid
     läraren sparar. Lodrätt: hur mycket eleven själv tänker.
     Allt slutar vid x 1480, långt från kamerazonen. */
  .axel-x {
    position: absolute; left: 160px; top: 628px; width: 1320px; height: 4px;
    background: var(--cw-text-ljus);
  }
  .axel-y {
    position: absolute; left: 818px; top: 260px; width: 4px; height: 740px;
    background: var(--cw-text-ljus);
  }
  /* Axlarnas namn, med en pil som visar riktningen. */
  .axelnamn {
    position: absolute; font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
    white-space: nowrap;
  }

  /* Ett alternativ: ett platt kort med rundade hörn. */
  .kort {
    position: absolute; height: 96px; padding: 0 40px; border-radius: 48px;
    background: var(--cw-ljus-alt); color: var(--cw-text-ljus);
    display: flex; align-items: center; white-space: nowrap;
    font-size: var(--cw-min-etikett);
  }

  /* Namnet på rutan där svaret hamnar. Koppar, syns när fokus landar. */
  .ruta {
    position: absolute; left: 900px; top: 460px;
    font-size: var(--cw-min-etikett); font-weight: var(--cw-vikt-stark); color: var(--cw-glod-text);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Save time and keep the thinking</h1>

  <div class="axel-x"></div>
  <div class="axel-y"></div>
  <div class="axelnamn" style="right:440px; top:650px">Time saved →</div>
  <div class="axelnamn" style="right:1130px; top:262px">↑ Student thinking</div>

  <!-- De tre alternativen som ligger still, ett i varje ruta. -->
  <div class="kort fast" style="left:200px; top:380px">No AI at all</div>
  <div class="kort fast" style="left:200px; top:820px">Busywork</div>
  <div class="kort fast" style="left:900px; top:740px">AI writes it all</div>

  <!-- Svaret: börjar där många tror att det hör hemma (nere till höger)
       och flyttar sedan upp till rutan uppe till höger. -->
  <div class="kort svar" style="left:900px; top:880px">AI as a sparring partner</div>
  <div class="ruta">The sweet spot</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk landar varje kort på ordet som namnger det, och
     svaret flyttar när Johan säger var det egentligen hör hemma. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Struktur först: rubrik, axlarna ritas ut från mitten, axelnamnen.
  tl.from('.rubrik', { opacity: 0, y: 24 }, 0);
  tl.from('.axel-x', { scaleX: 0, duration: 1.0, ease: 'power2.inOut' }, 0.3);
  tl.from('.axel-y', { scaleY: 0, duration: 1.0, ease: 'power2.inOut' }, 0.3);
  tl.from('.axelnamn', { opacity: 0, stagger: STEG }, 1.0);

  // Alternativen landar ett i taget (tyst: framväxt).
  tl.from('.fast', { opacity: 0, y: -24, stagger: 1.0 }, 2.0);
  tl.from('.svar', { opacity: 0, y: -24 }, 5.0);

  // Svaret flyttar 550 px uppåt, till rutan uppe till höger.
  var tFlytt = 6.6;
  tl.to('.svar', { y: -550, duration: 1.6, ease: 'power2.inOut' }, tFlytt);

  // Fokus: svaret blir koppar, rutans namn kommer in, resten tonas ned. Ett klick.
  var tF = tFlytt + 1.6;
  tl.to('.fast', { opacity: 0.38, duration: 0.6 }, tF);
  tl.to('.svar', { backgroundColor: '#C2793A', color: '#FFFFFF', boxShadow: '0 0 0 14px rgba(194,121,58,.34)', duration: 0.6 }, tF);
  tl.from('.ruta', { opacity: 0, y: 16 }, tF + 0.2);
  Tavla.ljud(tl, tF + 0.1, 'landa');

  tl.to({}, { duration: 2.5 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
