<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S135 · Document highlight</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Dokumentet ----------
     Ett vitt papper till vänster med skolans AI-riktlinjer (påhittad
     exempeltext). Det slutar vid x 1140, så kamerazonen är tom. */
  .papper {
    position: absolute; left: 120px; top: 250px; width: 1020px; height: 770px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-media); padding: 60px 64px;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }
  .papper h2 { margin: 0 0 40px; font-size: 56px; font-weight: var(--cw-vikt-stark); }
  .rad { position: relative; isolation: isolate; font-size: var(--cw-min-etikett); line-height: 1.3; margin-bottom: 34px; }
  /* Överstrykningspennan: en kopparfärgad yta bakom raden som dras fram. */
  .rad .penna {
    position: absolute; left: -16px; right: -16px; top: -6px; bottom: -6px;
    background: var(--cw-glod-sken); border-radius: 10px;
    transform-origin: 0 50%; transform: scaleX(0); z-index: -1;
  }
  .rad span { position: relative; }

  /* ---------- Kommentaren i marginalen ----------
     Ett kort till höger med en kopparkant, kopplat till raden med ett streck.
     Det ligger ovanför y 720. */
  .kommentar {
    position: absolute; left: 1240px; top: 540px; width: 560px;
    background: #FFFFFF; border-left: 8px solid var(--cw-glod);
    border-radius: 0 24px 24px 0; padding: 30px 36px;
    font-size: var(--cw-min-etikett); line-height: 1.25; color: var(--cw-glod-text);
    box-shadow: 0 16px 40px rgba(11, 58, 111, .10);
  }
  .streck {
    position: absolute; left: 1140px; top: 616px; width: 100px; height: 4px;
    background: var(--cw-glod); transform-origin: 0 50%;
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Read the fine print</h1>
  <div class="exempel" style="left:120px; top:205px">Example text · not a real policy</div>

  <div class="papper">
    <h2>School AI guidelines</h2>
    <div class="rad">1. Staff may use AI to plan lessons.</div>
    <div class="rad">2. Pupils say when they used AI.</div>
    <!-- Raden som markeras. -->
    <div class="rad nyckel"><b class="penna"></b><span>3. AI never sets a grade on its own.</span></div>
    <div class="rad">4. No pupil data in AI tools.</div>
    <div class="rad">5. Guidelines are reviewed every year.</div>
  </div>

  <div class="streck"></div>
  <div class="kommentar">So the teacher signs every grade.</div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN ===== Provtider. */
  var EASE = 'power2.out';
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: 0.8 } });

  // Struktur först: rubriken och papperet med sin rubrik.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: 0.18 }, 0);
  tl.from('.papper', { opacity: 0, y: 40 }, 0.3);

  // Raderna kommer en i taget.
  tl.from('.rad', { opacity: 0, y: 16, stagger: 0.5 }, 1.4);

  // Fokus: pennan drar fram markeringen över rad 3, de andra raderna tonas
  // ned, strecket ritas ut och kommentaren dyker upp i marginalen (tyst).
  var tF = 5.2;
  tl.to('.nyckel .penna', { scaleX: 1, duration: 0.9 }, tF);
  tl.to('.rad:not(.nyckel), .papper h2', { opacity: 0.38, duration: 0.6 }, tF + 0.3);
  tl.from('.streck', { scaleX: 0, duration: 0.6 }, tF + 1.0);
  tl.from('.kommentar', { opacity: 0, x: -20 }, tF + 1.4);
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
