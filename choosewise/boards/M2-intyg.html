<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M2 · Certificate</title>
<link rel="stylesheet" href="../tema.css">
<style>
  /* ---------- Intyget ----------
     Ett vitt papper mitt i bilden. Det slutar vid x 1460 och y 1000,
     så kamerazonen nere till höger är tom. Allt på papperet är centrerat. */
  .intyg {
    position: absolute; left: 260px; top: 260px; width: 1200px; height: 740px;
    background: #FFFFFF; border: 2px solid var(--cw-kant-ljus);
    border-radius: var(--cw-radie-media); text-align: center;
    box-shadow: 0 24px 60px rgba(11, 58, 111, .14);
  }
  /* Ramen innanför kanten: en SVG-rektangel vars streck ritas fram. */
  .ram { position: absolute; left: 0; top: 0; width: 1200px; height: 740px; overflow: visible; }
  .ram rect { fill: none; stroke: var(--cw-accent); stroke-width: 3; }

  /* Texten på intyget, uppifrån och ned. */
  .typ {
    position: absolute; left: 0; right: 0; top: 80px;
    font-size: var(--cw-min-etikett); letter-spacing: .12em; text-transform: uppercase;
    color: var(--cw-accent); font-weight: var(--cw-vikt-stark);
  }
  .till {
    position: absolute; left: 0; right: 0; top: 156px;
    font-size: var(--cw-min-etikett); color: var(--cw-text-ljus-dampad);
  }
  /* Namnet ser handskrivet ut (Instrument Serif kursiv). Det är en platshållare.
     inline-block med luft i sidled, så att masken inte klipper den lutande stilen. */
  .namnrad { position: absolute; left: 0; right: 0; top: 226px; }
  .namn {
    display: inline-block; padding: 0 24px;
    font-family: var(--cw-font-serif); font-style: italic;
    font-size: 120px; line-height: 1.1; color: var(--cw-text-ljus);
  }
  /* Linjen som namnet står på. */
  .linje {
    position: absolute; left: 300px; width: 600px; top: 366px; height: 2px;
    background: var(--cw-kant-ljus); transform-origin: 50% 50%;
  }
  .kurs {
    position: absolute; left: 0; right: 0; top: 388px;
    font-size: 54px; font-weight: var(--cw-vikt-display);
  }

  /* ---------- Sigillet ----------
     En kopparrund med en tunn inre ring och en bock. Det trycks på mitt
     under kursnamnet (mitt i x 860, y 845 på boarden), innanför ramen. */
  .sigill {
    position: absolute; left: 515px; top: 500px; width: 170px; height: 170px;
    border-radius: 50%; background: var(--cw-glod);
    box-shadow: 0 0 0 16px var(--cw-glod-sken);
  }
  .sigill svg { position: absolute; left: 0; top: 0; width: 170px; height: 170px; }
  .sigill circle { fill: none; stroke: #FFFFFF; stroke-width: 3; opacity: .7; }
  .sigill path { fill: none; stroke: #FFFFFF; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Rullen ----------
     En platt "pappersrulle" som åker nedåt medan intyget vecklas ut,
     och sedan försvinner. Den är bara en känsla av rörelse. */
  .rulle {
    position: absolute; left: 240px; top: 242px; width: 1240px; height: 36px;
    border-radius: 18px; background: var(--cw-ljus-alt); border: 2px solid var(--cw-kant-ljus);
  }
</style>
</head>
<body>

<!-- ===== BOARDEN (ljus scen: kameran syns) ===== -->
<div class="cw ljus">

  <h1 class="rubrik">Celebrate the first step</h1>
  <!-- Kursnamnet och namnet är exempel. Byt mot er egen kurs. -->
  <div class="exempel" style="left:120px; top:205px">Example certificate · replace course and name</div>

  <div class="intyg">
    <svg class="ram" viewBox="0 0 1200 740">
      <rect x="32" y="32" width="1136" height="676" rx="10"/>
    </svg>
    <div class="typ">Certificate of completion</div>
    <div class="till">Awarded to</div>
    <div class="namnrad"><span class="namn">Teacher name</span></div>
    <div class="linje"></div>
    <div class="kurs">AI in the classroom · Level 1</div>

    <!-- Sigillet: en inre ring och en bock, ritade i SVG. -->
    <div class="sigill">
      <svg viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="70"/>
        <path d="M58 92 L80 114 L124 68"/>
      </svg>
    </div>
  </div>

  <div class="rulle"></div>
</div>

<script src="../../skills/board-sync/assets/gsap.min.js"></script>
<script src="../spelare.js"></script>
<script>
  /* ===== RÖRELSEN =====
     Provtider. Vid synk skrivs namnet när Johan säger det, och sigillet
     trycks på när han säger att kursen är klar. */
  var IN = 0.8, STEG = 0.18, EASE = 'power2.out';   // tempot "Lugn"
  var tl = gsap.timeline({ paused: true, defaults: { ease: EASE, duration: IN } });

  // Ramens streck göms: strecket är lika långt som rektangeln och skjuts undan.
  var ram = document.querySelector('.ram rect');
  var ramLangd = ram.getTotalLength();
  // opacity 0 också, annars syns linjeänden som en prick innan ramen ritas.
  gsap.set(ram, { strokeDasharray: ramLangd, strokeDashoffset: ramLangd, opacity: 0 });

  // Struktur först: rubriken och märket.
  tl.from('.rubrik, .exempel', { opacity: 0, y: 24, stagger: STEG }, 0);

  // Intyget vecklas ut uppifrån: en mask öppnas nedåt medan rullen åker
  // med kanten. Masken går 100 px utanför papperet så att skuggan syns.
  tl.from('.rulle', { opacity: 0, duration: 0.4 }, 0.5);
  tl.fromTo('.intyg', { clipPath: 'inset(0px -100px 740px -100px)' },
    { clipPath: 'inset(-100px -100px -100px -100px)', duration: 1.4, ease: 'power2.inOut' }, 0.7);
  tl.to('.rulle', { y: 740, duration: 1.4, ease: 'power2.inOut' }, 0.7);
  tl.to('.rulle', { opacity: 0, duration: 0.4 }, 2.1);

  // Ramen ritas runt, sedan kommer texten överst (tyst).
  tl.set(ram, { opacity: 1 }, 2.2);
  tl.to(ram, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 2.2);
  tl.from('.typ, .till', { opacity: 0, y: 16, stagger: STEG }, 2.8);

  // Namnet skrivs fram från vänster med en mask, på en linje som ritas först.
  tl.from('.linje', { scaleX: 0, duration: 0.6 }, 3.4);
  tl.fromTo('.namn', { clipPath: 'inset(0% 100% 0% 0%)' },
    { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.4, ease: 'power1.inOut' }, 3.8);
  tl.from('.kurs', { opacity: 0, y: 16 }, 5.4);

  // Fokus: sigillet trycks på. Det börjar större och genomskinligt och landar
  // snabbt; resten av intyget tonas ned. Ett klick när sigillet landar.
  var tF = 6.8;
  tl.fromTo('.sigill', { scale: 1.3, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.35, ease: 'power3.in' }, tF);
  tl.to('.ram, .typ, .till, .namnrad, .linje, .kurs', { opacity: 0.38, duration: 0.6 }, tF + 0.35);
  Tavla.ljud(tl, tF + 0.35, 'landa');
  tl.to({}, { duration: 2 });  // vila på slutbilden

  Tavla.start(tl);
</script>
</body>
</html>
